  {id:'K10-M2',icon:'🧑‍💻',komp:'R',niveau:'III',title:{de:'KI und meine Zukunft',en:'AI and my future'},tasks:[
    {type:'info',title:{de:'KI und die Arbeitswelt von morgen',en:'AI and tomorrow’s world of work'},
     body:{de:'<p>KI verändert, welche Fähigkeiten in vielen Berufen gefragt sind: Routineaufgaben werden häufiger von KI unterstützt, während menschliche Stärken wie <strong>Urteilsvermögen</strong>, <strong>Kreativität</strong> und <strong>zwischenmenschliche Fähigkeiten</strong> an Bedeutung gewinnen.</p><p>Das betrifft auch dich: In fast jedem Berufsfeld wird ein bewusster, kritischer Umgang mit KI zunehmend Teil der Grundausstattung.</p>',
           en:'<p>AI is changing which skills matter in many jobs: routine tasks are increasingly supported by AI, while human strengths such as <strong>judgement</strong>, <strong>creativity</strong> and <strong>interpersonal skills</strong> become more important.</p><p>This affects you too: in almost every career field, a conscious, critical approach to AI is becoming part of the basic toolkit.</p>'}},
    {type:'sort',q:{de:'Wo bleibt der Mensch in vielen Berufen zentral, wo kann KI stark unterstützen?',en:'Where does the human stay central in many jobs, where can AI support strongly?'},
     buckets:[{de:'Mensch bleibt zentral',en:'Human stays central'},{de:'KI kann stark unterstützen',en:'AI can support strongly'}],
     items:[{text:{de:'ein Team motivieren und führen',en:'motivating and leading a team'},bucket:0},
            {text:{de:'große Datenmengen strukturieren',en:'structuring large amounts of data'},bucket:1},
            {text:{de:'eine schwierige ethische Entscheidung verantworten',en:'taking responsibility for a difficult ethical decision'},bucket:0},
            {text:{de:'erste Textentwürfe erstellen',en:'creating first drafts of a text'},bucket:1},
            {text:{de:'Vertrauen zu Kund:innen aufbauen',en:'building trust with clients'},bucket:0}]},
    {type:'reflect',q:{de:'In welchem Bereich möchtest du später einmal arbeiten oder studieren – und wie könnte KI dort eine Rolle spielen (Chance und Risiko)?',en:'What field would you like to work or study in one day – and what role could AI play there (opportunity and risk)?'},
     placeholder:{de:'Bereich … / Chance … / Risiko …',en:'Field … / Opportunity … / Risk …'},prod:true}
  ]},
  {id:'K10-M3',icon:'🛠️',komp:'A',niveau:'III',title:{de:'Einen KI-Workflow gestalten',en:'Designing an AI workflow'},tasks:[
    {type:'info',title:{de:'Vom einzelnen Prompt zum Workflow',en:'From a single prompt to a workflow'},
     body:{de:'<p>Für größere Aufgaben reicht selten ein einzelner Prompt. Ein <strong>Workflow</strong> ist eine geplante Abfolge aus Schritten: die Aufgabe zerlegen, pro Schritt das passende Vorgehen wählen, Zwischenergebnisse <strong>prüfen</strong> und bei Bedarf <strong>anpassen</strong>.</p><p>Das geht über das einfache Nachbessern einer einzelnen Antwort hinaus – du planst den ganzen Weg zum Ziel.</p>',
           en:'<p>Bigger tasks rarely work with a single prompt. A <strong>workflow</strong> is a planned sequence of steps: break the task down, choose the right approach for each step, <strong>check</strong> intermediate results and <strong>adjust</strong> where needed.</p><p>This goes beyond simply refining one answer – you plan the whole path to the goal.</p>'}},
    {type:'match',q:{de:'Ordne jeder Workflow-Phase zu, was dort passiert.',en:'Match each workflow phase to what happens in it.'},
     pairs:[{left:{de:'Planen',en:'Plan'},right:{de:'die Aufgabe in Teilschritte zerlegen',en:'breaking the task down into sub-steps'}},
            {left:{de:'Ausführen',en:'Do'},right:{de:'pro Schritt das passende Vorgehen oder Werkzeug wählen',en:'choosing the right approach or tool for each step'}},
            {left:{de:'Prüfen',en:'Check'},right:{de:'Zwischenergebnisse kritisch bewerten',en:'critically evaluating intermediate results'}},
            {left:{de:'Anpassen',en:'Adjust'},right:{de:'Prompt oder Vorgehen verbessern',en:'improving the prompt or approach'}}]},
    {type:'reflect',q:{de:'Plane einen mehrstufigen KI-Workflow für eine reale Aufgabe (z. B. ein Referat oder Projekt): Welche Schritte, welche Prüfpunkte?',en:'Plan a multi-step AI workflow for a real task (e.g. a presentation or project): what steps, what checkpoints?'},
     placeholder:{de:'Schritt 1 … / Prüfpunkt … / Schritt 2 …',en:'Step 1 … / Checkpoint … / Step 2 …'},prod:true},
    {type:'info',title:{de:'Jetzt du: den Workflow wirklich ausführen',en:'Now you: actually running the workflow'},
     body:{de:'<p>Planen war bisher Theorie – jetzt kommt die Praxis. Führe <strong>mindestens zwei Schritte</strong> deines eben geplanten Workflows wirklich mit <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> aus. Prüfe nach jedem Schritt das Zwischenergebnis kritisch, bevor du weitermachst.</p>',
           en:'<p>Planning was theory so far – now comes practice. Actually carry out <strong>at least two steps</strong> of the workflow you just planned using <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>. After each step, critically check the intermediate result before continuing.</p>'}},
    {type:'reflect',q:{de:'Was hast du in der Praxis tatsächlich ausgeführt (mindestens 2 Schritte)? Wo unterschied sich das reale Ergebnis von deiner Planung – musstest du etwas anpassen?',en:'What did you actually carry out in practice (at least 2 steps)? Where did the real result differ from your plan – did you have to adjust anything?'},
     placeholder:{de:'Schritt 1 ausgeführt: … / Schritt 2 ausgeführt: … / Anpassung: …',en:'Step 1 executed: … / Step 2 executed: … / Adjustment: …'},prod:true}
  ]},
  {id:'K10-M4',icon:'🆚',komp:'R',niveau:'III',title:{de:'KI-gestützt oder klassisch? Ergebnisse vergleichen',en:'AI-assisted or classic? Comparing results'},tasks:[
    {type:'info',title:{de:'Zwei Wege, ein Ziel',en:'Two paths, one goal'},
     body:{de:'<p>Eine Aufgabe einmal mit und einmal ohne KI-Unterstützung zu lösen, zeigt dir, ob sich der KI-Einsatz wirklich gelohnt hat. Vergleiche dabei: <strong>Qualität</strong>, <strong>Zeitaufwand</strong> und <strong>eigenen Lernertrag</strong>.</p><p>Manchmal gewinnt KI klar, manchmal der klassische Weg – erst der Vergleich zeigt es.</p>',
           en:'<p>Solving a task once with and once without AI support shows you whether using AI was really worth it. Compare: <strong>quality</strong>, <strong>time spent</strong> and your <strong>own learning gain</strong>.</p><p>Sometimes AI clearly wins, sometimes the classic way does – only the comparison shows it.</p>'}},
    {type:'multi',q:{de:'Woran erkennst du, ob sich der KI-Einsatz bei einer Aufgabe wirklich gelohnt hat? (Mehrere)',en:'How do you tell whether using AI for a task was really worth it? (Several)'},
     options:[{de:'Das Ergebnis ist mindestens so gut wie ohne KI',en:'The result is at least as good as without AI'},
              {de:'Du hast Zeit gespart, ohne an Qualität zu verlieren',en:'You saved time without losing quality'},
              {de:'Du kannst das Ergebnis erklären und vertreten',en:'You can explain and stand behind the result'},
              {de:'Es sah einfach beeindruckender aus',en:'It simply looked more impressive'}],
     correct:[0,1,2],explain:{de:'Qualität, Zeitgewinn und eigene Nachvollziehbarkeit zählen – reiner Eindruck nicht.',en:'Quality, time saved and being able to explain it count – mere impression does not.'}},
    {type:'reflect',q:{de:'Bearbeite eine kleine Aufgabe aus deinem Unterricht einmal mit und einmal ohne KI-Unterstützung. Vergleiche Qualität, Zeit und eigenen Lernertrag. Was ist dein Fazit?',en:'Do a small task from your lessons once with and once without AI support. Compare quality, time and your own learning gain. What is your conclusion?'},
     placeholder:{de:'Mit KI … / Ohne KI … / Fazit …',en:'With AI … / Without AI … / Conclusion …'},prod:true}
  ]},
  {id:'K10-M5',icon:'📣',komp:'M',niveau:'III',title:{de:'Über KI kommunizieren',en:'Communicating about AI'},tasks:[
    {type:'info',title:{de:'KI-Wissen weitergeben',en:'Sharing what you know about AI'},
     body:{de:'<p>Ein KI-Thema so zu erklären, dass es andere wirklich verstehen, vertieft dein eigenes Verständnis noch einmal – und trägt dazu bei, dass richtige statt falsche Informationen über KI verbreitet werden.</p><p>Deine Zielgruppe kann jüngere Mitschüler:innen sein oder die Schulgemeinschaft, z. B. über den Schulnewsletter.</p>',
           en:'<p>Explaining an AI topic so others truly understand it deepens your own understanding once more – and helps spread accurate rather than false information about AI.</p><p>Your audience can be younger students or the wider school community, e.g. via the school newsletter.</p>'}},
    {type:'quiz',q:{de:'Was macht eine Erklärung über KI für andere besonders gut verständlich?',en:'What makes an explanation about AI especially easy for others to understand?'},
     options:[{de:'Konkrete Alltagsbeispiele statt nur Fachbegriffe',en:'Concrete everyday examples instead of just technical terms'},
              {de:'Möglichst viele Fachbegriffe ohne Erklärung',en:'As many technical terms as possible without explanation'},
              {de:'Ein möglichst langer, abstrakter Text',en:'As long and abstract a text as possible'}],
     correct:0,explain:{de:'Konkrete Beispiele aus dem Alltag machen abstrakte KI-Konzepte greifbar.',en:'Concrete everyday examples make abstract AI concepts tangible.'}},
    {type:'reflect',q:{de:'Erkläre einer jüngeren Mitschüler:in (z. B. aus Klasse 6 oder 7) ein KI-Thema deiner Wahl in einfachen Worten, oder bereite einen kurzen Beitrag für die Schulgemeinschaft vor. Fasse hier zusammen, was du erklärt oder geschrieben hast.',en:'Explain an AI topic of your choice to a younger student (e.g. from Grade 6 or 7) in simple words, or prepare a short piece for the school community. Summarise here what you explained or wrote.'},
     placeholder:{de:'Zielgruppe … / Thema … / Kernaussage …',en:'Audience … / Topic … / Key message …'},prod:true}
  ]},
  {id:'K10-M6',icon:'🕵️‍♀️',komp:'A',niveau:'III',title:{de:'Deep Research kennenlernen',en:'Getting to know Deep Research'},tasks:[
    {type:'info',title:{de:'Mehr als eine schnelle Antwort',en:'More than a quick answer'},
     body:{de:'<p><strong>Deep Research</strong> ist eine Funktion von Gemini, bei der die KI nicht nur eine Antwort schreibt, sondern selbstständig <strong>wie ein Agent</strong> arbeitet: Sie plant eine Recherche, durchsucht dutzende Webseiten, liest sie und fasst alles in einem mehrseitigen Bericht mit <strong>Quellenangaben</strong> zusammen. Das dauert einige Minuten – nicht Sekunden.</p><p>Anders als bei einer normalen Antwort kannst du den Recherche-<strong>Plan vorher anpassen</strong>, bevor die KI startet.</p>',
           en:'<p><strong>Deep Research</strong> is a Gemini feature where the AI does not just write one answer but works <strong>like an agent</strong>: it plans a research process, searches dozens of webpages, reads them, and compiles it all into a multi-page report with <strong>citations</strong>. This takes a few minutes – not seconds.</p><p>Unlike a normal answer, you can <strong>adjust the research plan</strong> before the AI starts.</p>'}},
    {type:'info',title:{de:'Jetzt du: eine echte Recherche starten',en:'Now you: start a real research task'},
     body:{de:'<p>Öffne <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>, wähle in den Extras <strong>Deep Research</strong> und gib eine echte Frage aus deinem Unterricht ein (z. B. aus Geschichte, Politik oder Naturwissenschaften). Lies den fertigen Bericht und schau dir mindestens zwei zitierte Quellen genauer an.</p>',
           en:'<p>Open <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>, choose <strong>Deep Research</strong> from the extras and enter a real question from your lessons (e.g. history, politics or science). Read the finished report and look closely at at least two cited sources.</p>'}},
    {type:'quiz',q:{de:'Was unterscheidet Deep Research am meisten von einer normalen Gemini-Antwort?',en:'What most distinguishes Deep Research from a normal Gemini answer?'},
     options:[{de:'Es durchsucht selbstständig viele Quellen und braucht dafür Minuten statt Sekunden',en:'It autonomously searches many sources and takes minutes instead of seconds'},
              {de:'Es ist dadurch automatisch fehlerfrei, weil es Quellen zitiert',en:'It is automatically error-free because it cites sources'},
              {de:'Es funktioniert komplett ohne Internetzugang',en:'It works entirely without internet access'}],
     correct:0,explain:{de:'Zeit und Selbstständigkeit sind der Kern – Quellen zitieren heißt nicht automatisch fehlerfrei, wie du in K09 bei den KI-Grenzen gesehen hast.',en:'Time and autonomy are the core – citing sources does not automatically mean error-free, as you saw with AI limits in Grade 9.'}},
    {type:'reflect',q:{de:'Wofür wäre Deep Research in der Schule sinnvoll einzusetzen – und wofür nicht (z. B. bei einer bewerteten Arbeit ohne Erlaubnis)? Wie müsstest du die Nutzung laut GSIS-KI-Skala kennzeichnen?',en:'What would Deep Research be sensible to use for in school – and what not (e.g. a graded assignment without permission)? How would you have to disclose its use per the GSIS AI scale?'},
     placeholder:{de:'Sinnvoll: … / Nicht sinnvoll: … / Kennzeichnung: …',en:'Sensible: … / Not sensible: … / Disclosure: …'},prod:true}
  ]}
 ]
};

 {id:'OB-1',icon:'🔎',komp:'V',title:{de:'KI als Recherche- und Antwortmaschine',en:'AI as a research and answer engine'},tasks:[
   {type:'info',title:{de:'Chatbot oder Antwortmaschine?',en:'Chatbot or answer engine?'},
    body:{de:'<p>Klassische Chatbots wie ChatGPT oder Gemini erzeugen Text aus Wahrscheinlichkeiten – ohne automatisch Belege zu liefern. <strong>KI-Antwortmaschinen</strong> wie <strong>Perplexity</strong> kombinieren das mit einer Websuche und geben zu jeder Aussage <strong>Quellenlinks</strong> an.</p><p>Das ist praktisch für den Einstieg in ein Thema – ersetzt aber nicht das genaue Lesen und Bewerten der Originalquelle.</p>',
          en:'<p>Classic chatbots such as ChatGPT or Gemini generate text from probabilities – without automatically providing evidence. <strong>AI answer engines</strong> such as <strong>Perplexity</strong> combine this with a web search and give <strong>source links</strong> for each claim.</p><p>That is useful to get started on a topic – but it does not replace actually reading and evaluating the original source.</p>'},
    terms:[{de:'Antwortmaschine',en:'Answer engine'},{de:'Quellenlink',en:'Source link'},{de:'Wissenschaftliches Arbeiten',en:'Academic work'}]},
   {type:'quiz',q:{de:'Was unterscheidet eine KI-Antwortmaschine wie Perplexity von einem klassischen Chatbot?',en:'What sets an AI answer engine like Perplexity apart from a classic chatbot?'},
    options:[{de:'Sie durchsucht das Web und verlinkt ihre Quellen direkt bei der Antwort',en:'It searches the web and links its sources directly with the answer'},
             {de:'Sie ist grundsätzlich fehlerfrei, weil sie Quellen nennt',en:'It is fundamentally error-free because it names sources'},
             {de:'Sie funktioniert komplett ohne Training mit Daten',en:'It works entirely without being trained on data'}],
    correct:0,explain:{de:'Der Kern ist die Verknüpfung von Websuche und Quellenangabe. Fehlerfrei ist sie dadurch nicht – auch genannte Quellen musst du selbst prüfen.',en:'The core is combining web search with source citation. That does not make it error-free – even cited sources need to be checked yourself.'}},
   {type:'reflect',q:{de:'Probiere eine KI-Antwortmaschine (z. B. Perplexity) für eine Frage aus deinem Fach aus. Was fällt dir im Vergleich zu einer normalen Suchmaschine auf?',en:'Try an AI answer engine (e.g. Perplexity) for a question from one of your subjects. What stands out compared to a normal search engine?'},
    placeholder:{de:'z. B. Antwortstruktur, Quellenauswahl, Grenzen …',en:'e.g. answer structure, source selection, limitations …'},prod:true}
 ]},
 {id:'OB-2',icon:'🧭',komp:'A',title:{de:'Themenfindung, Recherche & Strukturierung mit KI',en:'Finding topics, research & structuring with AI'},tasks:[
   {type:'info',title:{de:'KI im Arbeitsprozess einer Facharbeit',en:'AI in the process of an extended essay'},
    body:{de:'<p>KI kann in mehreren Phasen einer wissenschaftlichen Arbeit unterstützen: beim <strong>Brainstorming</strong> möglicher Themen, beim <strong>Einstieg in die Recherche</strong> und bei <strong>Gliederungsvorschlägen</strong>.</p><p>Nicht abnehmen kann sie dir: die <strong>eigene Fragestellung</strong> schärfen, Quellen <strong>kritisch bewerten</strong> und deine <strong>Argumentation</strong> entwickeln – das bleibt deine Eigenleistung.</p>',
          en:'<p>AI can support several phases of an academic paper: <strong>brainstorming</strong> possible topics, an <strong>entry point into research</strong>, and suggesting an <strong>outline</strong>.</p><p>What it cannot do for you: sharpening your <strong>own research question</strong>, <strong>critically evaluating</strong> sources, and developing your <strong>argument</strong> – that stays your own work.</p>'}},
   {type:'sort',q:{de:'Facharbeit/Praxisprojekt: Wo kann KI unterstützen, wo bist du gefragt?',en:'Extended essay/project: where can AI support you, where are you needed?'},
    buckets:[{de:'KI kann unterstützen',en:'AI can support'},{de:'braucht deine eigene Leistung',en:'needs your own work'}],
    items:[{text:{de:'erste Themen sammeln',en:'gathering first topic ideas'},bucket:0},
           {text:{de:'die eigene Fragestellung präzisieren',en:'sharpening your own research question'},bucket:1},
           {text:{de:'einen Gliederungsentwurf vorschlagen',en:'suggesting a draft outline'},bucket:0},
           {text:{de:'Quellen kritisch bewerten und gewichten',en:'critically evaluating and weighing sources'},bucket:1},
           {text:{de:'die eigene Argumentation entwickeln',en:'developing your own argument'},bucket:1}]},
   {type:'reflect',q:{de:'Wende das auf ein eigenes Thema an (Facharbeit, Praxisprojekt o. Ä.): Wo würdest du KI konkret einsetzen – und wo bewusst nicht?',en:'Apply this to a topic of your own (extended essay, project etc.): where would you specifically use AI – and where deliberately not?'},
    placeholder:{de:'Einsatz … / bewusst nicht …',en:'Use … / deliberately not …'},prod:true}
 ]},
 {id:'OB-3',icon:'📋',komp:'R',title:{de:'Spielregeln – KI bei Hausaufgaben, Prüfungen & Qualifikationsphase',en:'Ground rules – AI in homework, exams & the qualification phase'},tasks:[
   {type:'info',title:{de:'Regeln kennen, bevor du KI einsetzt',en:'Know the rules before you use AI'},
    body:{de:'<p>Ob und wie du KI nutzen darfst, hängt vom <strong>Format</strong> ab: Hausaufgabe, Klassenarbeit, Facharbeit, Abiturprüfung im 4./5. Fach oder ein bewertetes Lernprodukt in der Qualifikationsphase – überall gelten <strong>unterschiedliche Regeln</strong>.</p><p><strong>[Platzhalter – von der Schule zu ergänzen]:</strong> Hier trägt eure Schule die aktuell gültigen Regelungen für Hausaufgaben, die Abiturprüfung im 4./5. Fach im DIA sowie für Lernprodukte in der Qualifikationsphase ein.</p><p>Grundregel, die immer gilt: <strong>im Zweifel vorher fragen</strong> – nicht nachträglich rechtfertigen.</p>',
          en:'<p>Whether and how you may use AI depends on the <strong>format</strong>: homework, class test, extended essay, the Abitur exam in the 4th/5th subject, or a graded learning product in the qualification phase – <strong>different rules</strong> apply everywhere.</p><p><strong>[Placeholder – to be completed by the school]:</strong> Your school fills in the currently valid rules here for homework, the Abitur exam in the 4th/5th DIA subject, and learning products in the qualification phase.</p><p>The rule that always applies: <strong>when in doubt, ask first</strong> – do not justify it afterwards.</p>'}},
   {type:'quiz',q:{de:'Warum können sich die Regeln zum KI-Einsatz zwischen Hausaufgabe und Abiturprüfung unterscheiden?',en:'Why can the rules for AI use differ between homework and the Abitur exam?'},
    options:[{de:'Weil bei Prüfungen die eigene, unter Aufsicht erbrachte Leistung bewertet wird, bei Hausaufgaben eher der Lernprozess',en:'Because exams assess your own performance under supervision, while homework is more about the learning process'},
             {de:'Weil KI bei Prüfungen technisch nicht funktioniert',en:'Because AI technically does not work during exams'},
             {de:'Es gibt keinen sinnvollen Grund für den Unterschied',en:'There is no sensible reason for the difference'}],
    correct:0,explain:{de:'Prüfungen sollen deine eigene Leistung unter vergleichbaren Bedingungen zeigen – deshalb sind die Regeln dort strenger als bei Übungsformaten.',en:'Exams are meant to show your own performance under comparable conditions – that is why the rules there are stricter than for practice formats.'}},
   {type:'reflect',q:{de:'Für welches Fach/Format bist du dir aktuell unsicher, was erlaubt ist? Formuliere eine konkrete Frage, die du deiner Kurslehrkraft stellen willst.',en:'For which subject/format are you currently unsure what is allowed? Formulate a concrete question you want to ask your course teacher.'},
    placeholder:{de:'z. B. Fach, Situation, konkrete Frage …',en:'e.g. subject, situation, specific question …'},prod:true}
 ]},
 {id:'OB-4',icon:'✍️',komp:'M',title:{de:'Eigenständiges Arbeiten mit KI-Unterstützung',en:'Working independently with AI support'},tasks:[
   {type:'info',title:{de:'Was „geistige Eigenleistung" bedeutet',en:'What "own intellectual work" means'},
    body:{de:'<p>Eine KI-unterstützte Arbeit bleibt deine eigene, wenn <strong>die Fragestellung, die Bewertung der Ergebnisse und die endgültige Argumentation von dir stammen</strong>. KI darf <strong>Sparringspartner</strong> sein – nicht Autor:in.</p><p>Wichtig: <strong>Dokumentiere</strong>, wo und wie du KI genutzt hast. Das schützt dich und zeigt Transparenz.</p>',
          en:'<p>An AI-supported piece of work remains your own if <strong>the research question, the evaluation of results and the final argument come from you</strong>. AI may be a <strong>sparring partner</strong> – not the author.</p><p>Important: <strong>document</strong> where and how you used AI. That protects you and shows transparency.</p>'}},
   {type:'multi',q:{de:'Was gehört zu eigenständigem, redlichem Arbeiten mit KI-Unterstützung? (Mehrere)',en:'What belongs to independent, honest work with AI support? (Several)'},
    options:[{de:'Die eigene Fragestellung selbst entwickeln',en:'Developing your own research question yourself'},
             {de:'Dokumentieren, wo KI genutzt wurde',en:'Documenting where AI was used'},
             {de:'KI-Vorschläge kritisch prüfen, bevor du sie übernimmst',en:'Critically checking AI suggestions before adopting them'},
             {de:'KI-Text unverändert als eigenen Text abgeben',en:'Submitting AI text unchanged as your own'}],
    correct:[0,1,2],explain:{de:'Eigene Fragestellung, Dokumentation und kritische Prüfung sichern deine Eigenleistung – unverändert übernommener KI-Text tut das Gegenteil.',en:'Your own question, documentation and critical checking safeguard your own contribution – submitting AI text unchanged does the opposite.'}},
   {type:'reflect',q:{de:'Beschreibe ein Beispiel (real oder geplant), wie du KI eigenständig und redlich in einer Arbeit einsetzt.',en:'Describe an example (real or planned) of how you use AI independently and honestly in a piece of work.'},

 {id:'OB-6',icon:'💼',komp:'R',title:{de:'KI und die Arbeitswelt von morgen',en:'AI and tomorrow\'s world of work'},tasks:[
   {type:'info',title:{de:'Was die Zahlen zeigen',en:'What the numbers show'},
    body:{de:'<p>Der <strong>PwC AI Jobs Barometer 2026</strong> wertet weltweit Millionen Stellenanzeigen aus. Kernbefunde: In stark KI-geprägten Branchen wächst die <strong>Produktivität rund 40% schneller</strong> als in wenig KI-geprägten. Der <strong>Lohnaufschlag für KI-Fähigkeiten</strong> stieg 2025 auf 34,2% (2024 noch 11%). Es entsteht ein „<strong>Zwei-Spuren-Arbeitsmarkt</strong>": Jobs, die KI-Fähigkeiten voraussetzen, wachsen deutlich schneller als Jobs, die von KI einfach „demokratisiert" werden. Und: In stark KI-geprägten Berufen wachsen <strong>menschliche Fähigkeiten</strong> wie Empathie, Urteilsvermögen und Kreativität 2,5-mal schneller als anderswo.</p><p>Mehr dazu: <a href="https://www.pwc.com/gx/en/1/services/ai/ai-jobs-barometer.html" target="_blank" rel="noopener">PwC AI Jobs Barometer ↗</a>. Für einen Überblick zu gesellschaftlichen Auswirkungen von KI allgemein (Jobs, Fairness, Grenzen der Technologie) lohnt sich der kostenlose Kurs <a href="https://course.elementsofai.com/" target="_blank" rel="noopener">Elements of AI ↗</a> (Universität Helsinki).</p>',
          en:'<p>The <strong>PwC AI Jobs Barometer 2026</strong> analyses millions of job ads worldwide. Key findings: in strongly AI-exposed industries, <strong>productivity grows about 40% faster</strong> than in less AI-exposed ones. The <strong>wage premium for AI skills</strong> rose to 34.2% in 2025 (up from 11% in 2024). A "<strong>two-track labour market</strong>" is emerging: jobs that require AI skills grow much faster than jobs simply "democratised" by AI. And in strongly AI-exposed jobs, <strong>human skills</strong> like empathy, judgement and creativity grow 2.5x faster than elsewhere.</p><p>More: <a href="https://www.pwc.com/gx/en/1/services/ai/ai-jobs-barometer.html" target="_blank" rel="noopener">PwC AI Jobs Barometer ↗</a>. For a broader look at AI\'s effects on society (jobs, fairness, the technology\'s limits), the free course <a href="https://course.elementsofai.com/" target="_blank" rel="noopener">Elements of AI ↗</a> (University of Helsinki) is worth it.</p>'}},
   {type:'sort',q:{de:'Laut den PwC-Daten: Welche Fähigkeiten werden in KI-geprägten Jobs wichtiger, welche Aufgaben übernimmt eher KI?',en:'According to the PwC data: which skills become more important in AI-exposed jobs, which tasks does AI increasingly take over?'},

   {type:'info',title:{de:'Das KI-Rennen kritisch betrachten',en:'Looking critically at the AI race'},
    body:{de:'<p>Im September 2026 warnte <strong>Dario Amodei</strong>, CEO von Anthropic, in einem viel beachteten Essay: Die KI-Branche müsse das <strong>Tempo der Fähigkeiten-Entwicklung bewusst verlangsamen</strong>, um Zeit für Sicherheit zu gewinnen. Er räumte ein: „Ich denke, die Branche hat den Menschen zu lange die Risiken dieser Technologie verschwiegen." Gleichzeitig beschrieb er das internationale Wettrennen um KI (u. a. zwischen den USA und China) als eines der schwierigsten Dilemmas überhaupt.</p><p>Quelle: <a href="https://www.cnn.com/2026/09/12/tech/anthropic-ceo-essay-ai" target="_blank" rel="noopener">CNN, 12.9.2026 ↗</a></p>',
          en:'<p>In September 2026, <strong>Dario Amodei</strong>, CEO of Anthropic, warned in a widely noted essay: the AI industry must deliberately <strong>slow the pace of capability development</strong> to buy time for safety work. He admitted: "I think for too long the industry lied to people about the fact that this technology had risks." At the same time, he described the international race for AI (including between the US and China) as one of the hardest dilemmas there is.</p><p>Source: <a href="https://www.cnn.com/2026/09/12/tech/anthropic-ceo-essay-ai" target="_blank" rel="noopener">CNN, Sep 12, 2026 ↗</a></p>'}},

 {id:'OB-7',icon:'🤖',komp:'R',title:{de:'AI Agents – Nutzen und Grenzen',en:'AI agents – uses and limits'},tasks:[
   {type:'info',title:{de:'Vom Chatbot zum Agenten',en:'From chatbot to agent'},
    body:{de:'<p>Ein Chatbot beantwortet eine Frage und wartet auf die nächste. Ein <strong>KI-Agent</strong> plant dagegen mehrstufige Aufgaben selbst, nutzt dafür Werkzeuge (z. B. Websuche, Kalender, Dateien), merkt sich Zwischenschritte über längere Zeit und arbeitet mit weniger direkter Aufsicht.</p><p>Beispiel: Statt nur „Was ist die Hauptstadt von …" zu beantworten, könnte ein Agent selbstständig recherchieren, mehrere Quellen vergleichen und daraus einen fertigen Bericht zusammenstellen.</p>',
          en:'<p>A chatbot answers one question and waits for the next. An <strong>AI agent</strong>, by contrast, plans multi-step tasks on its own, uses tools (e.g. web search, calendar, files), remembers intermediate steps over a longer time, and works with less direct supervision.</p><p>Example: instead of just answering "what is the capital of …", an agent could research independently, compare several sources and assemble a finished report from them.</p>'}},

    options:[{de:'Kleine Fehler pro Schritt summieren sich über viele Schritte hinweg',en:'Small errors per step add up across many steps'},
             {de:'Sie werden mit jedem Schritt automatisch langsamer',en:'They automatically get slower with every step'},
             {de:'Mehr Schritte bedeuten grundsätzlich bessere Ergebnisse',en:'More steps fundamentally mean better results'}],

   {type:'info',title:{de:'Deep Research: ein Agent, den du heute nutzen kannst',en:'Deep Research: an agent you can use today'},
    body:{de:'<p>Geminis <strong>Deep Research</strong> ist ein konkretes Beispiel für genau den Agenten-Typ von oben: Du gibst eine Fragestellung vor, die KI plant selbst eine Recherchestrategie, durchsucht selbstständig dutzende Quellen und liefert nach einigen Minuten einen mehrseitigen Bericht mit Zitationen – ohne dass du jeden Zwischenschritt einzeln anstoßen musst.</p>',
          en:'<p>Gemini\'s <strong>Deep Research</strong> is a concrete example of exactly the kind of agent described above: you give it a research question, the AI plans its own research strategy, autonomously searches dozens of sources, and after a few minutes delivers a multi-page report with citations – without you triggering every intermediate step yourself.</p>'}},

   correct:0,explain:{de:'Ohne Kontext (welcher Aspekt, welches Ziel) bleibt die Antwort vage.',en:'Without context (which aspect, which goal) the answer stays vague.'}},
  {type:'quiz',group:'k06-paul',q:{de:'Der Chatbot nennt Paul einen Fakt, der ihm neu vorkommt. Was macht Paul am besten?',en:'The chatbot tells Paul a fact that is new to him. What is best for him to do?'},
   options:[{de:'Den Fakt mit einer zweiten Quelle vergleichen, bevor er ihn nutzt',en:'Compare the fact with a second source before using it'},
            {de:'Sofort ins Referat übernehmen, weil es sicher klingt',en:'Use it in the talk right away because it sounds confident'},{de:'Den Chatbot fragen, ob er sich sicher ist',en:'Ask the chatbot if it is sure'}],
   correct:0,explain:{de:'Eine zweite, unabhängige Quelle zeigt, ob der Fakt stimmt – die KI selbst nochmal zu fragen, hilft dabei nicht.',en:'A second, independent source shows whether the fact is true – asking the AI itself again does not help with that.'}},
  {type:'multi',group:'k06-fix',q:{de:'Was fehlt bei diesem Prompt: „Erzähl was über Tiere."? (Mehrere)',en:'What is missing from this prompt: "Tell me something about animals."? (Several)'},
   options:[{de:'Ein klarer Kontext (welches Tier, welcher Aspekt?)',en:'Clear context (which animal, which aspect?)'},
            {de:'Ein gewünschtes Format (wie lang, welche Form?)',en:'A desired format (how long, what form?)'},
            {de:'Ein Ausrufezeichen am Ende',en:'An exclamation mark at the end'},
            {de:'Großbuchstaben am Satzanfang',en:'A capital letter at the start'}],
   correct:[0,1],explain:{de:'Kontext und Format fehlen und machen die Antwort beliebig – Satzzeichen und Groß-/Kleinschreibung sind für die KI meist nebensächlich.',en:'Context and format are missing and make the answer arbitrary – punctuation and capitalisation barely matter to the AI.'}},
  {type:'order',group:'k06-fix',q:{de:'Bringe die Schritte in die richtige Reihenfolge, wie du diesen Prompt verbesserst.',en:'Put the steps in the right order for improving this prompt.'},

          {text:{de:'Kontext ergänzen (für wen, wozu?)',en:'Add context (for whom, for what purpose?)'}},
          {text:{de:'Gewünschtes Format festlegen (z. B. 3 Sätze)',en:'Decide on the desired format (e.g. 3 sentences)'}},
          {text:{de:'Den verbesserten Prompt an die KI schicken',en:'Send the improved prompt to the AI'}}],
   explain:{de:'Erst überlegen, dann Kontext und Format ergänzen, erst dann abschicken – so entsteht ein klarer Prompt.',en:'First think, then add context and format, only then send – that is how a clear prompt is built.'}}
 ],
 K07:[
  {type:'quiz',q:{de:'Eine Gesichtserkennung funktioniert bei einer Gruppe schlecht. Wahrscheinlichste Ursache?',en:'Face recognition works poorly for one group. Most likely cause?'},
   options:[{de:'Diese Gruppe war in den Trainingsdaten kaum vertreten',en:'That group was barely present in the training data'},
            {de:'Die Kamera ist kaputt',en:'The camera is broken'},{de:'Die KI hat eine Meinung',en:'The AI has an opinion'}],
   correct:0,explain:{de:'Einseitige Daten erzeugen Bias mit unfairen Folgen.',en:'One-sided data creates bias with unfair consequences.'}},
  {type:'quiz',q:{de:'Eine KI nennt selbstsicher eine Quelle, die es nicht gibt. Das ist …',en:'An AI confidently names a source that does not exist. That is …'},
   options:[{de:'… eine Halluzination – erfunden, klingt aber echt',en:'… a hallucination – made up, but sounds real'},
            {de:'… ein Beweis, dass sie recht hat',en:'… proof that it is right'},{de:'… ein Virus',en:'… a virus'}],

  {type:'multi',q:{de:'Du erstellst ein Plakat mit KI-Hilfe. Was ist fair & verantwortungsvoll? (Mehrere)',en:'You make a poster with AI help. What is fair & responsible? (Several)'},
   options:[{de:'Erst eigene Ideen, dann mit KI vergleichen',en:'Own ideas first, then compare with AI'},{de:'KI-Einsatz kennzeichnen',en:'Label the AI use'},
            {de:'Inhalte gegen Quellen prüfen',en:'Check content against sources'},{de:'So tun, als sei alles allein von mir',en:'Pretend it was all me alone'}],

  {type:'quiz',q:{de:'Jemand will ein gefälschtes Video einer echten Person mit KI erstellen. Richtig ist:',en:'Someone wants to create a fake video of a real person with AI. The right move is:'},
   options:[{de:'Nicht mitmachen – Deepfakes echter Personen können verletzen',en:'Do not join – deepfakes of real people can hurt'},
            {de:'Mitmachen, ist nur Spaß',en:'Join in, it is just fun'},{de:'Es heimlich verbreiten',en:'Spread it secretly'}],
   correct:0,explain:{de:'Fälschungen über echte Menschen schaden – das macht man nicht.',en:'Fakes about real people cause harm – you do not do that.'}},
  {type:'quiz',q:{de:'Beste Methode, eine überraschende KI-Behauptung zu prüfen?',en:'Best method to check a surprising AI claim?'},
   options:[{de:'Mit mehreren vertrauenswürdigen Quellen abgleichen',en:'Cross-check with several trusted sources'},
            {de:'Der KI glauben, weil sie sicher klingt',en:'Believe the AI because it sounds sure'},{de:'Dieselbe Frage doppelt stellen',en:'Ask the same question twice'}],
   correct:0,explain:{de:'Unabhängige Quellen schlagen eine selbstsichere KI.',en:'Independent sources beat a confident AI.'}},
  {type:'info',group:'k07-plakat',title:{de:'Fallstudie: Leas Klima-Plakat',en:'Case study: Lea\'s climate poster'},
   body:{de:'<p>Lea gestaltet ein Plakat über den Klimawandel und lässt sich von einer Bild-KI ein passendes Titelbild erzeugen.</p>',en:'<p>Lea is designing a poster about climate change and has an image AI generate a matching cover picture.</p>'}},
  {type:'quiz',group:'k07-plakat',q:{de:'Was ist beim KI-Bild für ihr Plakat fair?',en:'What is fair regarding the AI image for her poster?'},
   options:[{de:'Angeben, dass es mit KI erstellt wurde',en:'State that it was created with AI'},
            {de:'So tun, als hätte sie es selbst gezeichnet',en:'Pretend she drew it herself'},{de:'Es als Foto ausgeben',en:'Claim it is a photo'}],
   correct:0,explain:{de:'Ehrliche Kennzeichnung ist fair gegenüber allen, die das Plakat sehen.',en:'Honest labelling is fair to everyone who sees the poster.'}},
  {type:'multi',group:'k07-plakat',q:{de:'Worauf sollte Lea bei den Klima-Fakten auf ihrem Plakat besonders achten? (Mehrere)',en:'What should Lea especially watch out for with the climate facts on her poster? (Several)'},
   options:[{de:'Zahlen/Fakten gegen eine unabhängige Quelle prüfen',en:'Check numbers/facts against an independent source'},
            {de:'Darauf achten, ob die KI überzeugend, aber falsch klingende Details erfunden hat',en:'Watch for the AI having invented convincing-sounding but false details'},
            {de:'Nur die auffälligste Zahl nehmen, egal ob sie stimmt',en:'Just take the most striking number, regardless of accuracy'},
            {de:'Bei Unsicherheit eine Lehrkraft fragen',en:'Ask a teacher if unsure'}],
   correct:[0,1,3],explain:{de:'Prüfen, auf Halluzinationen achten und im Zweifel nachfragen – die auffälligste Zahl blind zu nehmen ist keine gute Idee.',en:'Checking, watching for hallucinations and asking when unsure are good – blindly taking the most striking number is not.'}},
  {type:'info',group:'k07-suche',title:{de:'Fallstudie: Bens Hausaufgabe',en:'Case study: Ben\'s homework'},
   body:{de:'<p>Ben sucht für seine Hausaufgabe „Welches Land hat die meisten Einwohner?" bei Google. Er liest nur die <strong>KI-Übersicht</strong> ganz oben, schreibt die Zahl in sein Heft und schickt sie sofort in die Klassen-Chatgruppe – ohne weiter nachzuschauen.</p>',
         en:'<p>Ben searches Google for his homework question "Which country has the most inhabitants?" He only reads the <strong>AI Overview</strong> at the top, writes the number in his notebook, and immediately sends it to the class chat group – without checking any further.</p>'}},
  {type:'multi',group:'k07-suche',q:{de:'Was hat Ben bei seiner Recherche falsch gemacht? (Mehrere)',en:'What did Ben do wrong in his research? (Several)'},
   options:[{de:'Er hat nur die KI-Übersicht gelesen, keine zweite Quelle',en:'He only read the AI Overview, no second source'},
            {de:'Er hat die Information ungeprüft weiterverbreitet',en:'He spread the information without checking it'},
            {de:'Er hat überhaupt eine Suchmaschine benutzt',en:'He used a search engine at all'},
            {de:'Er hat sich für seine Hausaufgabe eine klare Frage gestellt',en:'He asked a clear question for his homework'}],
   correct:[0,1],explain:{de:'Eine Suchmaschine zu nutzen und eine klare Frage zu stellen ist sinnvoll – das Problem ist, nur eine Quelle zu lesen und ungeprüft weiterzugeben.',en:'Using a search engine and asking a clear question are sensible – the problem is reading only one source and passing it on unchecked.'}},
  {type:'order',group:'k07-suche',q:{de:'Bringe Bens Vorgehen in die richtige, bessere Reihenfolge.',en:'Put Ben\'s approach into the right, better order.'},
   items:[{text:{de:'Frage bei Google eingeben',en:'Enter the question into Google'}},
          {text:{de:'KI-Übersicht UND klassische Treffer lesen',en:'Read the AI Overview AND the classic results'}},
          {text:{de:'Eine unabhängige zweite Quelle suchen',en:'Look for an independent second source'}},
          {text:{de:'Beide Angaben vergleichen',en:'Compare both pieces of information'}},
          {text:{de:'Erst dann die geprüfte Information weitergeben',en:'Only then pass on the checked information'}}],
   explain:{de:'Fragen, lesen, eine zweite Quelle suchen, vergleichen, erst dann teilen – so vermeidet man, Fehler weiterzuverbreiten.',en:'Ask, read, find a second source, compare, only then share – that way you avoid spreading mistakes.'}}

 K08:[
  {type:'sort',q:{de:'Projekt-Aufsatz: Wo kann KI unterstützen, wo entscheidest du selbst?',en:'Project essay: where can AI support, where do you decide yourself?'},
   buckets:[{de:'KI kann unterstützen',en:'AI can support'},{de:'lieber selbst',en:'better yourself'}],
   items:[{text:{de:'Ideen sammeln',en:'gathering ideas'},bucket:0},{text:{de:'eigene Meinung & Argumente',en:'own opinion & arguments'},bucket:1},
          {text:{de:'Rechtschreibung prüfen',en:'checking spelling'},bucket:0},{text:{de:'Schreibstil & Schluss',en:'writing style & conclusion'},bucket:1}]},
  {type:'multi',q:{de:'Was gibst du einer KI NICHT? (Mehrere)',en:'What do you NOT give an AI? (Several)'},
   options:[{de:'Passwörter',en:'Passwords'},{de:'Private Daten anderer',en:'Private data of others'},
            {de:'Deine Wohnadresse',en:'Your home address'},{de:'Eine Sachfrage zum Thema',en:'A factual question on the topic'}],
   correct:[0,1,2],explain:{de:'Private/persönliche Daten schützen – Sachfragen sind okay.',en:'Protect private/personal data – factual questions are fine.'}},
  {type:'quiz',q:{de:'Was beschreibt gutes „Ko-Konstruieren" mit KI?',en:'What describes good "co-creating" with AI?'},
   options:[{de:'Idee → KI-Feedback → ich entscheide → verbessern',en:'Idea → AI feedback → I decide → improve'},
            {de:'KI macht alles allein',en:'AI does it all alone'},{de:'Ich ignoriere Feedback',en:'I ignore feedback'}],

  {type:'quiz',q:{de:'Was ist das Risiko von Überabhängigkeit?',en:'What is the risk of overreliance?'},
   options:[{de:'Man denkt selbst kaum noch nach und lernt weniger',en:'You barely think yourself and learn less'},
            {de:'Man bekommt schlechtere Noten, weil die Lehrkraft es merkt',en:'You get worse grades because the teacher notices'},{de:'Man wird abhängig vom Internet',en:'You become dependent on the internet'}],
   correct:0,explain:{de:'Eigenes Denken bleibt wichtig – sonst sinkt der Lernerfolg. Es geht nicht ums Erwischtwerden oder um die Internetverbindung.',en:'Own thinking stays important – otherwise learning drops. It is not about getting caught or about the internet connection.'}},
  {type:'quiz',q:{de:'Warum kennzeichnest du, was von der KI kam?',en:'Why do you label what came from the AI?'},
   options:[{de:'Ehrlichkeit und Sichtbarkeit deiner Eigenleistung',en:'Honesty and visibility of your own contribution'},
            {de:'Damit es länger aussieht',en:'To make it look longer'},{de:'Aus keinem Grund',en:'For no reason'}],
   correct:0,explain:{de:'Transparenz ist fair und zeigt deine Leistung.',en:'Transparency is fair and shows your work.'}},
  {type:'info',group:'k08-sara',title:{de:'Fallstudie: Saras Bio-Hausaufgabe',en:'Case study: Sara\'s biology homework'},
   body:{de:'<p>Für eine Bio-Hausaufgabe ist Stufe 2 erlaubt: „KI-gestützte Bearbeitung". Sara fragt Gemini nach einer Erklärung zur Fotosynthese und bekommt eine Antwort, die gut klingt.</p>',
         en:'<p>For a biology homework, Level 2 is allowed: "AI-assisted editing". Sara asks Gemini to explain photosynthesis and gets an answer that sounds good.</p>'}},
  {type:'quiz',group:'k08-sara',q:{de:'Sara ist unsicher, ob die Erklärung wirklich stimmt. Was macht sie am besten?',en:'Sara is unsure whether the explanation is really correct. What is best for her to do?'},
   options:[{de:'Die Erklärung mit ihrem Lehrbuch oder einer zweiten Quelle abgleichen',en:'Cross-check the explanation with her textbook or a second source'},
            {de:'Sie trotzdem übernehmen, weil sie gut klingt',en:'Use it anyway because it sounds good'},{de:'Gemini fragen, ob sie sich sicher ist',en:'Ask Gemini if it is sure'}],
   correct:0,explain:{de:'Eine unabhängige Quelle zeigt, ob die Erklärung stimmt.',en:'An independent source shows whether the explanation is correct.'}},
  {type:'multi',group:'k08-sara',q:{de:'Was wäre für Sara laut Stufe 2 in Ordnung? (Mehrere)',en:'What would be okay for Sara under Level 2? (Several)'},
   options:[{de:'Geminis Erklärung als Ausgangspunkt nutzen und in eigenen Worten aufschreiben',en:'Use Gemini\'s explanation as a starting point and write it in her own words'},
            {de:'Ihre volle Adresse in den Chat eingeben, damit die Antwort persönlicher wird',en:'Enter her full home address in the chat to make the answer more personal'},
            {de:'Den Einsatz von Gemini bei der Abgabe kennzeichnen',en:'Disclose the use of Gemini when submitting'},
            {de:'Den Text unverändert kopieren, ohne ihn zu kennzeichnen',en:'Copy the text unchanged, without disclosing it'}],
   correct:[0,2],explain:{de:'Als Ausgangspunkt nutzen und kennzeichnen ist in Ordnung – private Daten eingeben und unkenntlich gemacht kopieren sind es nicht.',en:'Using it as a starting point and disclosing it is fine – entering private data and copying it undisclosed are not.'}},
  {type:'info',group:'k08-craft',title:{de:'CRAFT-Check in der Prüfung',en:'CRAFT check in the exam'},
   body:{de:'<p>Schau dir diesen Prompt an: <em>„Erklär mir was zu Erneuerbaren Energien."</em></p>',en:'<p>Look at this prompt: <em>"Explain something about renewable energy."</em></p>'}},
  {type:'multi',group:'k08-craft',q:{de:'Welche CRAFT-Elemente fehlen in diesem Prompt am deutlichsten? (Mehrere)',en:'Which CRAFT elements are most clearly missing from this prompt? (Several)'},

            {de:'Role – keine Rolle zugewiesen',en:'Role – no role assigned'},

            {de:'Format – keine gewünschte Form genannt',en:'Format – no desired form stated'}],

   explain:{de:'C-R-A-F-T: Context, Role, Audience, Format, Task.',en:'C-R-A-F-T: Context, Role, Audience, Format, Task.'}},
  {type:'promptcheck',graded:true,minHits:4,q:{de:'Verbessere diesen Prompt mit CRAFT: „Erklär mir was zu Erneuerbaren Energien." Schreib deinen neuen Prompt hier hinein und lass ihn prüfen.',en:'Improve this prompt using CRAFT: "Explain something about renewable energy." Write your new prompt here and have it checked.'},
   placeholder:{de:'Dein verbesserter CRAFT-Prompt …',en:'Your improved CRAFT prompt …'},

 K09:[
  {type:'multi',q:{de:'Wonach bewertest du ein KI-System fair? (Mehrere)',en:'By what do you fairly evaluate an AI system? (Several)'},
   options:[{de:'Zweck und Zielgruppe',en:'Purpose and target users'},{de:'Grenzen und mögliche Fehler',en:'Limits and possible errors'},
            {de:'Wer profitiert / wird benachteiligt',en:'Who benefits / is disadvantaged'},{de:'Nur das Aussehen',en:'Only the looks'}],
   correct:[0,1,2],explain:{de:'Zweck, Grenzen, Folgen – nicht das Aussehen.',en:'Purpose, limits, impact – not the looks.'}},
  {type:'quiz',q:{de:'Dein selbst trainiertes Modell verwechselt grüne Äpfel mit Tomaten. Ursache?',en:'Your self-trained model confuses green apples with tomatoes. Cause?'},
   options:[{de:'Einseitige Daten – grüne Äpfel fehlten im Training',en:'One-sided data – green apples were missing in training'},
            {de:'Die Kamera hat die Farbe nicht richtig erkannt',en:'The camera did not detect the colour correctly'},{de:'Zufall',en:'Coincidence'}],
   correct:0,explain:{de:'Datenlücken zeigen sich direkt im Verhalten – nicht an der Kamera oder am Zufall liegt\'s.',en:'Data gaps show directly in behaviour – it is not about the camera or coincidence.'}},
  {type:'quiz',q:{de:'Warum ist KI-Desinformation eine Gefahr für die Demokratie?',en:'Why is AI disinformation a danger to democracy?'},
   options:[{de:'Überzeugende Fälschungen können Meinungen unfair beeinflussen',en:'Convincing fakes can unfairly influence opinions'},
            {de:'Sie macht Webseiten bunter',en:'It makes websites more colourful'},{de:'Sie ist immer leicht erkennbar',en:'It is always easy to spot'}],
   correct:0,explain:{de:'Manipulation durch Fälschungen untergräbt freie Meinungsbildung.',en:'Manipulation through fakes undermines free opinion forming.'}},
  {type:'quiz',q:{de:'Leitfrage beim verantwortungsvollen Mitgestalten von KI?',en:'Guiding question when shaping AI responsibly?'},
   options:[{de:'Wer profitiert – und wer wird benachteiligt?',en:'Who benefits – and who is disadvantaged?'},
            {de:'Wie sieht es am coolsten aus?',en:'How does it look coolest?'},{de:'Wie werde ich am schnellsten fertig?',en:'How do I finish fastest?'}],
   correct:0,explain:{de:'Nutzen und Schaden für Menschen abwägen ist der Kern.',en:'Weighing benefit and harm for people is the core.'}},
  {type:'quiz',q:{de:'Was macht KI grundsätzlich anders als ein Mensch?',en:'What does AI fundamentally do differently from a human?'},
   options:[{de:'Sie erzeugt Ausgaben aus Wahrscheinlichkeiten, ohne echtes Verstehen',en:'It produces outputs from probabilities, without real understanding'},
            {de:'Sie hat ein Gewissen',en:'It has a conscience'},{de:'Sie erlebt die Welt wie wir',en:'It experiences the world like us'}],
   correct:0,explain:{de:'Statistische Vorhersage statt echtem Verstehen – das bleibt der Kern.',en:'Statistical prediction instead of real understanding – that stays the core.'}},
  {type:'info',group:'k09-tool',title:{de:'Fallstudie: KI-Tool für Stipendien-Bewerbungen',en:'Case study: AI tool for scholarship applications'},
   body:{de:'<p>Eine Schule überlegt, ein KI-Tool einzusetzen, das Stipendien-Bewerbungen automatisch vorsortiert.</p>',en:'<p>A school is considering using an AI tool that automatically pre-sorts scholarship applications.</p>'}},
  {type:'quiz',group:'k09-tool',q:{de:'Was ist die wichtigste erste Frage, bevor die Schule das Tool einsetzt?',en:'What is the most important first question before the school uses the tool?'},
   options:[{de:'Wofür wurde es gemacht, und wo liegen seine Grenzen?',en:'What was it made for, and where are its limits?'},
            {de:'Wie modern sieht die Oberfläche aus?',en:'How modern does the interface look?'},{de:'Wie viele andere Schulen nutzen es schon?',en:'How many other schools already use it?'}],
   correct:0,explain:{de:'Zweck und Grenzen entscheiden, ob ein Einsatz überhaupt sinnvoll und fair ist.',en:'Purpose and limits decide whether using it is sensible and fair at all.'}},
  {type:'multi',group:'k09-tool',q:{de:'Welche Risiken sollte die Schule bedenken? (Mehrere)',en:'What risks should the school consider? (Several)'},
   options:[{de:'Bias durch einseitige Trainingsdaten (z. B. bestimmte Gruppen benachteiligt)',en:'Bias from one-sided training data (e.g. certain groups disadvantaged)'},
            {de:'Bewerbungen komplett ohne menschliche Prüfung endgültig entscheiden lassen',en:'Letting it make final decisions on applications with no human review at all'},
            {de:'Überhaupt ein Softwaretool zur Vorsortierung einzusetzen',en:'Using any software tool for pre-sorting at all'},
            {de:'Nicht offenlegen, dass ein KI-Tool beteiligt war',en:'Not disclosing that an AI tool was involved'}],
   correct:[0,1,3],explain:{de:'Bias, fehlende menschliche Kontrolle bei wichtigen Entscheidungen und fehlende Offenlegung sind die echten Risiken – ein Tool zur Vorsortierung an sich ist nicht das Problem.',en:'Bias, no human oversight for important decisions, and no disclosure are the real risks – using a pre-sorting tool itself is not the problem.'}},
  {type:'info',group:'k09-modell',title:{de:'Fallstudie: Mias Modell-Test',en:'Case study: Mia\'s model test'},
   body:{de:'<p>Mia testet ein neues KI-Modell mit einer einzigen, leichten Frage. Die Antwort stimmt – daraus schließt sie, das Modell sei für alles zuverlässig.</p>',
         en:'<p>Mia tests a new AI model with a single, easy question. The answer is correct – she concludes the model is reliable for everything.</p>'}},
  {type:'multi',group:'k09-modell',q:{de:'Was ist an Mias Vorgehen problematisch? (Mehrere)',en:'What is problematic about Mia\'s approach? (Several)'},
   options:[{de:'Sie hat nur eine einzige, leichte Frage getestet',en:'She only tested a single, easy question'},
            {de:'Sie hat aus einem Erfolg auf generelle Zuverlässigkeit geschlossen',en:'She concluded general reliability from one success'},
            {de:'Sie hat das Modell überhaupt getestet',en:'She tested the model at all'},
            {de:'Sie hat auf die Antwort gewartet, statt das Fenster zu schließen',en:'She waited for the answer instead of closing the window'}],
   correct:[0,1],explain:{de:'Testen an sich ist gut – das Problem ist die zu kleine, zu leichte Stichprobe und die voreilige generelle Schlussfolgerung.',en:'Testing itself is good – the problem is the too-small, too-easy sample and the premature general conclusion.'}},
  {type:'order',group:'k09-modell',q:{de:'Bringe die Schritte einer fairen KI-Modell-Bewertung in die richtige Reihenfolge.',en:'Put the steps of a fair AI model evaluation in the right order.'},
   items:[{text:{de:'Zweck und Zielgruppe des Modells klären',en:'Clarify the model\'s purpose and target users'}},
          {text:{de:'Mehrere unterschiedliche Testfragen ausprobieren – leicht und knifflig',en:'Try several different test questions – easy and tricky'}},
          {text:{de:'Ergebnisse verschiedener Modelle/Modi vergleichen',en:'Compare results across different models/modes'}},
          {text:{de:'Grenzen und Fehler dokumentieren',en:'Document limits and errors'}},
          {text:{de:'Erst dann über den Einsatz entscheiden',en:'Only then decide on actual use'}}],
   explain:{de:'Zweck klären, vielfältig testen, vergleichen, dokumentieren, erst dann entscheiden – eine einzelne leichte Frage reicht nicht.',en:'Clarify purpose, test broadly, compare, document, only then decide – a single easy question is not enough.'}}

function modulesOf(g){return CONTENT[g]||[];}
function gradeComplete(g){const m=modulesOf(g);return m.length>0&&m.every(x=>STATE.done[x.id]);}

   Codes (GRADE_CODES) K05-K07 uebersprungen haben koennten. */
function geminiEligible(){return['K05','K06','K07','K08'].every(g=>STATE.fuehrerschein[g]);}
function gradeProgress(g){const m=modulesOf(g);if(!m.length)return 0;return Math.round(m.filter(x=>STATE.done[x.id]).length/m.length*100);}
function isUnlocked(g){if(g==='OB')return STATE.teacher||STATE.seniorUnlocked;return STATE.teacher||STATE.unlocked.includes(g);}

/* ===== 8) Runner ===== */
let RUN=null;
/* Gruppiert zusammenhängende Aufgaben (z. B. eine Szenario-Fallstudie aus mehreren
   Teilaufgaben) über task.group, damit sie beim Mischen der Reihenfolge zusammen-
   bleiben und in sich lesbar bleiben. Aufgaben ohne group werden weiterhin einzeln
   gemischt wie bisher. */
function buildExamTasks(grade){const pool=(EXAM[grade]||[]).map(x=>({...x}));
  const groups=[],byKey={};
  pool.forEach(t=>{if(t.group&&byKey[t.group]){byKey[t.group].push(t);}else{const arr=[t];groups.push(arr);if(t.group)byKey[t.group]=arr;}});
  for(let i=groups.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[groups[i],groups[j]]=[groups[j],groups[i]];}
  return groups.flat();}
function renderRunner(grade,moduleId,exam){if(!isUnlocked(grade))return go('grades');
  const g=gradeById(grade);let tasks,label;
  if(exam){tasks=buildExamTasks(grade);label=`🏁 ${t('exam')}`;CURRENT.exam=true;CURRENT.module=null;}
  else{const m=modulesOf(grade).find(x=>x.id===moduleId);tasks=m.tasks;label=tx(m.title);CURRENT.exam=false;CURRENT.module=moduleId;}
  CURRENT.grade=grade;RUN={grade,moduleId,exam,tasks,idx:0,score:0,gradeable:0,accent:g.accent,label,scoredIdx:new Set()};
  setCrumb([grade==='OB'?tx(OB_META.title):`${t('gradeEy')} ${grade}`,`<b>${label}</b>`]);drawTask();}
/* idx>0 zeigt einen Zurück-Button, damit man z. B. die Schritte einer vorherigen
   info-Aufgabe nochmal nachlesen kann, bevor man die aktuelle Aufgabe beantwortet.
   scoreTask() verhindert per RUN.scoredIdx, dass eine beim Zurückgehen erneut
   bearbeitete Aufgabe den Punktestand doppelt zählt. */
function drawTask(){const{tasks,idx,accent,label}=RUN,task=tasks[idx],pct=Math.round(idx/tasks.length*100);
  view().innerHTML=`<section class="view runner" style="--accent:${accent}">
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="run-meta"><span>${label}</span><span>${idx+1} ${t('of')} ${tasks.length}</span></div>
    ${idx>0?`<button class="btn ghost sm" id="backBtn" type="button" style="margin-bottom:14px">← ${L()==='de'?'Zurück':'Back'}</button>`:''}
    <div class="task" id="taskCard"></div></section>`;
  if(idx>0)document.getElementById('backBtn').onclick=()=>{RUN.idx--;drawTask();};
  RENDERERS[task.type](document.getElementById('taskCard'),task);}
/* reset=true zeigt einen Zurücksetzen-Button für Zuordnungs-Aufgaben (match/sort/
   order/classify/clozedrag), damit man eigene Fehlplatzierungen vor dem Prüfen
   nochmal löschen kann, statt das ganze Modul neu starten zu müssen. */
function taskFoot(label,showStreak=true,reset=false){return `<div class="task-foot">
  ${reset?`<button class="btn ghost sm" id="resetBtn" type="button">↺ ${L()==='de'?'Zurücksetzen':'Reset'}</button>`:''}
  <span class="streakpill">${showStreak?`${t('yourStreak')} <b>🔥 ${STATE.streak}</b>`:''}</span>
  <button class="btn" id="primaryBtn">${label}</button></div>`;}
function bindPrimary(fn){document.getElementById('primaryBtn').onclick=fn;}
/* Reset-Button ruft einfach drawTask() erneut auf – das baut die Aufgabe mit
   frischem, leerem Zustand neu auf (und mischt Reihenfolgen neu), aber NUR
   solange noch nicht geprüft wurde (isLocked liefert true nach dem Check-Klick). */
function bindReset(isLocked){const b=document.getElementById('resetBtn');if(b)b.onclick=()=>{if(isLocked())return;drawTask();};}
const feedbackEl=()=>`<div class="feedback" id="fb" aria-live="polite"></div>`;
function showFeedback(ok,msg){const fb=document.getElementById('fb');fb.className='feedback show '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?t('correct'):t('wrong')}</b> ${msg||''}`;}
function scoreTask(ok,task){if(RUN.scoredIdx.has(RUN.idx))return;RUN.scoredIdx.add(RUN.idx);
  RUN.gradeable++;if(ok){RUN.score++;STATE.points+=10;STATE.streak++;STATE.bestStreak=Math.max(STATE.bestStreak,STATE.streak);}else{STATE.streak=0;pushError(task);}save();updateChrome();}
function pushError(task){const id=(RUN.moduleId||RUN.grade)+'-'+RUN.idx;if(STATE.errors.some(e=>e.id===id))return;STATE.errors.push({id,q:tx(task.q||task.title||{de:'Aufgabe',en:'Task'}),src:RUN.label});}

const RENDERERS={
 info(h,task){h.innerHTML=`<div class="ttype">ℹ️ Info</div><h3>${tx(task.title)}</h3>
   <div class="infobox">${tx(task.body)}${task.terms?`<div class="keyterms">${task.terms.map(x=>`<span class="kt">${tx(x)}</span>`).join('')}</div>`:''}</div>
   ${taskFoot(t('skipInfo')+' →',false)}`;bindPrimary(()=>advance());},
 quiz(h,task){let ch=null,locked=false;
   h.innerHTML=`<div class="ttype">❓ Quiz</div><h3>${tx(task.q)}</h3>
     <div class="opts">${task.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="mark"></span><span>${tx(o)}</span></button>`).join('')}</div>
     ${feedbackEl()}${taskFoot(t('check'))}`;
   h.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;h.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ch=+b.dataset.i;});
   bindPrimary(()=>{if(ch===null)return toast(L()==='de'?'Bitte wähle eine Antwort':'Please pick an answer');if(locked)return advance();locked=true;
     h.querySelectorAll('.opt').forEach((x,i)=>{x.classList.add('locked');

function finishRun(){const{grade,moduleId,exam,score,gradeable,accent}=RUN;

    return inner+`<div class="bchip ${STATE.fuehrerschein[g.id]?'earned':'locked'}" style="--accent2:${g.accent}"><div class="ic">🎖️</div><span>${g.id}</span></div>`;}).join('');
  const rows=Object.entries(STATE.done).map(([id,d])=>{let title=id;GRADES.forEach(g=>modulesOf(g.id).forEach(m=>{if(m.id===id)title=tx(m.title);}));
    modulesOf('OB').forEach(m=>{if(m.id===id)title=tx(m.title);});
    const pct=d.total?Math.round(d.score/d.total*100):0;return `<div class="bar-row"><span>${title}</span><div class="bar-track"><i style="width:${pct}%"></i></div><span class="pct">${pct}%</span></div>`;}).join('')||`<div class="empty">${t('noData')}</div>`;
  view().innerHTML=`<section class="view"><div class="section-head"><div class="eyebrow">${t('yourOverview')}</div><h2>${t('yourOverview')}</h2></div>
    <div id="dashExport">
      <div class="dash-id"><div class="av">${initials}</div><div class="who"><b>${STATE.name||'—'}</b><span>${t('klasse')}: ${STATE.klasse||'—'}</span></div></div>
      <div class="dash-grid">
        <div class="dcard rank-card"><div class="rank-ic">${rank.ic}</div><div style="flex:1"><div class="k" style="color:rgba(255,255,255,.7)">${t('rank')}</div><div class="v">${rank[L()]}</div><div class="rank-bar"><i style="width:${rankPct}%"></i></div></div></div>
        <div class="dcard"><div class="k">${t('points')}</div><div class="v">${STATE.points}</div></div>
        <div class="dcard"><div class="k">🔥 ${t('streak')}</div><div class="v">${STATE.bestStreak}</div></div>
        <div class="dcard"><div class="k">${t('modules')}</div><div class="v">${doneMods}<small> ${t('of')} ${totalMods}</small></div></div>
        <div class="dcard"><div class="k">🎖️ ${t('certTitle')}</div><div class="v">${lic}<small> ${t('of')} ${GRADES.length}</small></div></div>
      </div>
      <div class="panel"><h3>${t('badges')}</h3><div class="badge-row">${badgeHtml||`<div class="empty">${t('noData')}</div>`}</div></div>
      <div class="panel"><h3>${t('analytics')}</h3><div class="bars">${rows}</div></div>
    </div>
    <div class="result-actions" style="justify-content:flex-start">
      <button class="btn sm" onclick="exportPNG('dashExport','KI-Uebersicht')">⬇️ ${t('exportPng')}</button>
      <button class="btn ghost sm" onclick="go('grades')">← ${t('back')}</button></div></section>`;}
function renderErrors(){setCrumb([`<b>${t('mistakes')}</b>`]);
  const list=STATE.errors.length?`<div class="errlist">${STATE.errors.map(e=>`<div class="erritem"><span style="font-size:18px">🔁</span><div class="q">${e.q}<div class="src">${e.src}</div></div></div>`).join('')}</div>`:`<div class="empty">${t('noMistakes')}</div>`;
  view().innerHTML=`<section class="view"><div class="section-head"><div class="eyebrow">🔁</div><h2>${t('mistakes')}</h2></div>${list}
    <div style="margin-top:20px"><button class="btn ghost sm" onclick="go('grades')">← ${t('back')}</button></div></section>`;}
/* ===== 10) Zertifikat (Name + Klasse) ===== */
function renderCert(grade){const g=gradeById(grade),fs=STATE.fuehrerschein[grade];if(!fs)return go('overview',{grade});
  const d=new Date(fs.ts).toLocaleDateString(L()==='de'?'de-DE':'en-GB');setCrumb([`${t('gradeEy')} ${grade}`,`<b>${t('certTitle')}</b>`]);
  view().innerHTML=`<section class="view cert-wrap"><div class="cert" id="certCard" style="--accent:${g.accent}">
      <div class="cert-head"><img class="cert-logo-img" src="gsis-logo.png" alt="GSIS" style="height:46px" onerror="this.style.display='none'">
        <div class="cert-school">German Swiss International School<small>German International Stream</small></div></div>
      <h2>${t('certTitle')}</h2><div class="cert-seal"><span>🎖️</span></div>
      <div class="name">${STATE.name||'—'}</div><div class="klasse">${t('klasse')}: ${STATE.klasse||'—'}</div>
      <div class="sub">${t('awarded')} · ${t('forGrade')} <b>${tx(g.title)} (${grade})</b></div>
      <div class="cert-strands"><span class="strand-chip">🧩 ${tx(KOMP.V)}</span><span class="strand-chip">🛠️ ${tx(KOMP.A)}</span><span class="strand-chip">🔍 ${tx(KOMP.R)}</span><span class="strand-chip">✨ ${tx(KOMP.M)}</span></div>
      <div class="cert-foot"><div>${t('date')}: <b style="color:var(--ink)">${d}</b><br>${t('niveau')} ${g.niveau} · ${fs.score}%</div><div class="sig">${t('signature')}</div></div>
    </div>
    <div class="result-actions" style="justify-content:center;margin-top:20px">
      <button class="btn sm" onclick="exportPNG('certCard','KI-Fuehrerschein-${grade}')">⬇️ ${t('exportPng')}</button>
      <button class="btn ghost sm" onclick="window.print()">🖨️ ${t('printPdf')}</button>
      <button class="btn ghost sm" onclick="go('overview',{grade:'${grade}'})">← ${t('back')}</button></div></section>`;}
function renderGeminiCert(){if(!geminiEligible())return go('overview',{grade:'K08'});
  const d=new Date().toLocaleDateString(L()==='de'?'de-DE':'en-GB');setCrumb([`${t('gradeEy')} K08`,`<b>${t('geminiCertTitle')}</b>`]);
  const mailSubject=encodeURIComponent((L()==='de'?'Gemini-Berechtigung – ':'Gemini authorisation – ')+(STATE.name||''));
  view().innerHTML=`<section class="view cert-wrap"><div class="cert" id="geminiCertCard" style="--accent:var(--k08)">
      <div class="cert-head"><img class="cert-logo-img" src="gsis-logo.png" alt="GSIS" style="height:46px" onerror="this.style.display='none'">
        <div class="cert-school">German Swiss International School<small>German International Stream</small></div></div>
      <h2>${t('geminiCertTitle')}</h2><div class="cert-seal"><span>✨</span></div>
      <div class="name">${STATE.name||'—'}</div><div class="klasse">${t('klasse')}: ${STATE.klasse||'—'}</div>
      <div class="sub">${t('geminiCertLead')}</div>
      <div class="cert-foot"><div>${t('date')}: <b style="color:var(--ink)">${d}</b></div><div class="sig">${t('signature')}</div></div>
    </div>
    <div class="panel" style="margin-top:20px"><h3>${t('geminiCertHowToTitle')}</h3>
      <ol style="padding-left:20px;font-size:14px;line-height:1.8;color:var(--ink)">
        <li>${t('geminiStep1')}</li><li>${t('geminiStep2')}</li><li>${t('geminiStep3')}</li></ol></div>
    <div class="result-actions" style="justify-content:center;margin-top:20px">
      <button class="btn sm" onclick="window.print()">🖨️ ${t('printPdf')}</button>
      <a class="btn ghost sm" style="text-decoration:none" href="mailto:${GEMINI_CERT_EMAIL}?subject=${mailSubject}">✉️ ${t('openMail')}</a>
      <button class="btn ghost sm" onclick="go('overview',{grade:'K08'})">← ${t('back')}</button></div></section>`;}
function exportPNG(id,fn){const el=document.getElementById(id);if(!el||typeof html2canvas==='undefined'){toast(L()==='de'?'Export nicht verfügbar':'Export unavailable');return;}
  toast(L()==='de'?'Bild wird erstellt …':'Creating image …');
  html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(c=>{const a=document.createElement('a');a.download=fn+'.png';a.href=c.toDataURL('image/png');a.click();}).catch(()=>toast(L()==='de'?'Export fehlgeschlagen':'Export failed'));}
/* ===== 11) Modals ===== */
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function openName(after){modal(`<h3>${t('nameTitle')}</h3><p>${t('nameLead')}</p>
   <label class="flabel">${t('nameLabel')}</label><input class="field" id="nameIn" placeholder="${t('namePh')}" value="${STATE.name||''}">
   <label class="flabel">${t('klasseLabel')}</label><input class="field" id="klasseIn" placeholder="${t('klassePh')}" value="${STATE.klasse||''}">
   <p style="font-size:12.5px;color:var(--muted);margin:-6px 0 14px">🔒 ${t('privacyNote')} <button class="footlink" onclick="openPrivacy()">${t('privacy')}</button></p>
   <div class="modal-actions"><button class="btn" id="nameSave">${t('save')}</button></div>`);
  document.getElementById('nameIn').focus();
  document.getElementById('nameSave').onclick=()=>{const v=document.getElementById('nameIn').value.trim();STATE.klasse=document.getElementById('klasseIn').value.trim();if(v)STATE.name=v;save();closeModal();updateChrome();if(after)after();};}
function openSenior(){modal(`<h3>${t('obCodeTitle')}</h3><p>${t('obCodeLead')}</p><input class="field" id="obcode" type="password" placeholder="${t('obCodePh')}">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button><button class="btn" id="obUnlockBtn">${t('unlock')}</button></div>`);
  document.getElementById('obUnlockBtn').onclick=()=>{if(document.getElementById('obcode').value.trim()===SENIOR_CODE){STATE.seniorUnlocked=true;save();closeModal();go('senior');}else toast(L()==='de'?'Code falsch':'Wrong code');};}
function openGradeCode(gradeId){modal(`<h3>${t('gradeCodeTitle')} ${gradeId}</h3><p>${t('gradeCodeLead')}</p><input class="field" id="gcode" type="password" placeholder="${t('obCodePh')}">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button><button class="btn" id="gcodeBtn">${t('unlock')}</button></div>`);
  document.getElementById('gcodeBtn').onclick=()=>{if(document.getElementById('gcode').value.trim()===GRADE_CODES[gradeId]){
    if(!STATE.unlocked.includes(gradeId))STATE.unlocked.push(gradeId);save();closeModal();go('overview',{grade:gradeId});
  }else toast(L()==='de'?'Code falsch':'Wrong code');};}
function openImpressum(){modal(`<h3>${t('impressum')}</h3>
   <div style="max-height:60vh;overflow:auto;font-size:14px;line-height:1.6">${tx({
     de:`<p><strong>Herausgeber:in</strong><br>Sebastian Ghofranifar<br>Koordinator digitale Unterrichtsentwicklung<br>German Swiss International School (GSIS), Hongkong<br>E-Mail: <a href="mailto:sghofranifar@gsis.edu.hk">sghofranifar@gsis.edu.hk</a></p>
       <p><strong>Verantwortliche Institution</strong><br>German Swiss International School (GSIS), Hongkong</p>
       <p><strong>Lizenz</strong><br>Diese App steht unter <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.de" target="_blank" rel="noopener">CC BY-NC 4.0</a> (Namensnennung – nicht kommerziell). Weitergabe und Bearbeitung sind unter Nennung der Urheber:innen für nicht-kommerzielle Zwecke erlaubt.</p>
       <p style="font-size:12.5px;color:var(--muted)">Ausnahme: Das CRAFT-Prompting-Framework in Klasse 8 basiert auf einem Werk von Vera Cubero (übersetzt/gekürzt von Joscha Falck) unter <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.de" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> (mit „Share Alike"-Pflicht) – für diesen Abschnitt gelten dessen Lizenzbedingungen zusätzlich.</p>`,
     en:`<p><strong>Publisher</strong><br>Sebastian Ghofranifar<br>Coordinator of Digital Teaching Development<br>German Swiss International School (GSIS), Hong Kong<br>Email: <a href="mailto:sghofranifar@gsis.edu.hk">sghofranifar@gsis.edu.hk</a></p>
       <p><strong>Responsible institution</strong><br>German Swiss International School (GSIS), Hong Kong</p>
       <p><strong>Licence</strong><br>This app is licensed under <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a> (Attribution – NonCommercial). Sharing and adapting is allowed for non-commercial purposes with attribution.</p>
       <p style="font-size:12.5px;color:var(--muted)">Exception: the CRAFT prompting framework in Grade 8 is based on a work by Vera Cubero (translated/shortened by Joscha Falck) under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> (with a "Share Alike" requirement) – that section is additionally subject to those licence terms.</p>`})}</div>
   <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);}
function openPrivacy(){modal(`<h3>${t('privacy')}</h3>
   <div style="max-height:60vh;overflow:auto;font-size:14px;line-height:1.6">${tx({
     de:`<p>Diese App läuft komplett in deinem Browser – es gibt keinen Server, der deine Eingaben empfängt.</p>
       <p><strong>Was gespeichert wird:</strong> Dein Name, deine Klasse, deine Antworten, Punkte und dein Fortschritt werden ausschließlich lokal auf diesem Gerät gespeichert (im „localStorage" deines Browsers).</p>
       <p><strong>Was NICHT passiert:</strong> Diese Daten werden nicht automatisch an einen Server, an die Schule oder an Dritte gesendet. Sie bleiben, bis du sie selbst löschst (z. B. über „Fortschritt zurücksetzen" oder Löschen der Browserdaten) oder aktiv teilst.</p>
       <p><strong>Wenn du sie teilst:</strong> Über den Lehrkraft-Bereich kannst du deinen Fortschritt als Code exportieren. Das passiert nur, wenn du selbst auf „Fortschritt exportieren" tippst und den Code z. B. weitergibst – die App selbst verschickt nichts von sich aus.</p>
       <p><strong>Technischer Hinweis:</strong> Für Schriftarten (Google Fonts) und den Bild-Export (html2canvas) lädt die App Ressourcen von externen Anbietern. Dabei können – wie bei den meisten Webseiten – technische Angaben wie deine IP-Adresse an diese Anbieter übertragen werden. Deine Antworten, dein Name oder dein Fortschritt werden dabei nicht übertragen.</p>`,
     en:`<p>This app runs entirely in your browser – there is no server that receives your input.</p>
       <p><strong>What is stored:</strong> Your name, class, answers, points and progress are stored only locally on this device (in your browser's "localStorage").</p>
       <p><strong>What does NOT happen:</strong> This data is not automatically sent to any server, to the school, or to third parties. It stays until you delete it yourself (e.g. via "Reset progress" or clearing browser data) or actively share it.</p>
       <p><strong>If you share it:</strong> The teacher area lets you export your progress as a code. That only happens when you tap "Export progress" yourself and pass the code on – the app itself never sends anything on its own.</p>
       <p><strong>Technical note:</strong> For fonts (Google Fonts) and the image export (html2canvas), the app loads resources from external providers. As with most websites, technical details such as your IP address may be transmitted to these providers. Your answers, name or progress are not transmitted in this process.</p>`})}</div>
   <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);}
function openTeacher(){if(STATE.teacher)return teacherPanel();
  modal(`<h3>${t('teacherTitle')}</h3><p>${t('teacherLead')}</p><input class="field" id="tcode" type="password" placeholder="${t('codePh')}">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button><button class="btn" id="tUnlock">${t('unlock')}</button></div>`);
  document.getElementById('tUnlock').onclick=()=>{if(document.getElementById('tcode').value.trim()===TEACHER_CODE){STATE.teacher=true;save();teacherPanel();toast(t('unlockAll'));}else toast(L()==='de'?'Code falsch':'Wrong code');};}
function teacherPanel(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(STATE))));
  modal(`<h3>${t('teacherTitle')} 🔑</h3><p>${L()==='de'?'Alle Jahrgänge sind freigeschaltet.':'All grades unlocked.'}</p>
    <div class="t-row"><button class="btn sm" onclick="go('dashboard');closeModal()">📊 ${t('overview')}</button><button class="btn sm ghost" id="expBtn">⬇️ ${t('exportProg')}</button></div>
    <div class="codebox">${code}</div><input class="field" id="impCode" placeholder="${t('pastePh')}">
    <div class="t-row"><button class="btn sm" onclick="importProg()">⬆️ ${t('importProg')}</button>
      <button class="btn sm ghost" onclick="resetProg()" style="border-color:var(--bad);color:var(--bad)">🗑️ ${t('resetProg')}</button></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);
  document.getElementById('expBtn').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast(L()==='de'?'Code kopiert':'Code copied'),()=>{});};}
function importProg(){try{const v=document.getElementById('impCode').value.trim();if(!v)return;const data=JSON.parse(decodeURIComponent(escape(atob(v))));STATE=Object.assign({},DEFAULT_STATE,data);save();closeModal();updateChrome();go('grades');toast(L()==='de'?'Fortschritt geladen':'Progress loaded');}catch(e){toast(L()==='de'?'Code ungültig':'Invalid code');}}
function resetProg(){if(!confirm(t('resetConfirm')))return;STATE=JSON.parse(JSON.stringify(DEFAULT_STATE));save();closeModal();updateChrome();go('landing');}
/* ===== 12) Sprache + Toast + Init ===== */
function setLang(l){STATE.lang=l;save();updateChrome();rerender();}
function rerender(){const v=view();
  if(RUN&&document.querySelector('.runner'))drawTask();
  else if(document.querySelector('.cert-wrap'))renderCert(CURRENT.grade);
  else if(v.querySelector('.hero'))renderLanding();
  else if(v.querySelector('.grades'))renderGrades();
  else if(v.querySelector('.modlist'))renderOverview(CURRENT.grade);
  else if(v.querySelector('.dash-grid'))renderDashboard();
  else if(v.querySelector('.errlist'))renderErrors();
  else renderGrades();updateChrome();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
(function init(){updateChrome();if(STATE.name)go('grades');else renderLanding();})();
</script>
