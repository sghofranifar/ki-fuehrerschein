<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI-Führerschein · GSIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gsis-green:#008445; --gsis-green-deep:#006B37;
  --ink:#16181D; --muted:#616B78; --bg:#F5F6F8; --card:#FFFFFF;
  --line:#E5E8ED; --line-strong:#CDD3DB;
  --good:#1F9D6B; --good-bg:#E7F6EF; --bad:#D64545; --bad-bg:#FBEAEA; --gold:#C9A227;
  --k05:#1FA37A; --k06:#2F7DC2; --k07:#7A5CC0; --k08:#D98324; --k09:#C0563E; --ob:#3B4B8C;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,24,33,.04),0 8px 24px rgba(20,24,33,.06);
  --shadow-lg:0 12px 40px rgba(20,24,33,.12);
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --maxw:980px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--gsis-green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;line-height:1.15}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-mark{height:34px;flex:none;display:flex;align-items:center}
.logo-mark img{height:100%;width:auto;display:block}
.brand-txt{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.1}
.brand-txt small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.crumb{color:var(--muted);font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink);position:relative}
.iconbtn:hover{border-color:var(--line-strong)}
.iconbtn .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--gsis-green);color:#fff;border-radius:9px;font-size:11px;display:grid;place-items:center;font-weight:700}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px}
.lang-toggle button{padding:0 11px;font-size:12px;font-weight:700;color:var(--muted);background:var(--card)}
.lang-toggle button.on{background:var(--ink);color:#fff}
@media(max-width:680px){.nav-actions .label,.crumb{display:none}.nav .wrap{padding:0 12px}.nav-inner{gap:6px}.nav-actions{gap:6px}.brand{gap:6px}.logo-mark{height:18px}.brand-txt{font-size:14px}.brand-txt small{display:none}.iconbtn{padding:0 8px}.lang-toggle button{padding:0 8px}}
main{flex:1;padding:34px 0 70px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gsis-green)}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 26px;border-radius:12px;background:var(--gsis-green);color:#fff;font-family:var(--font-display);font-weight:600;font-size:16px;transition:transform .12s,background .12s}
.btn:hover{background:var(--gsis-green-deep)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn.sm{height:42px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.hero{padding:40px 0 10px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:700;margin:14px 0 16px}
.hero h1 .hl{color:var(--gsis-green)}
.hero .lead{font-size:18px;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.seal{width:min(340px,80%);aspect-ratio:1;margin:0 auto;position:relative;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#fff 0 38%,transparent 38%),conic-gradient(from 0deg,var(--gsis-green),#13A05E 25%,var(--gsis-green) 50%,#13A05E 75%,var(--gsis-green));box-shadow:var(--shadow-lg)}
.seal::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
.seal-core{width:64%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 6px rgba(0,132,69,.1)}
.seal-core .ki{font-family:var(--font-display);font-weight:700;font-size:46px;color:var(--gsis-green);line-height:1}
.seal-core small{display:block;font-family:var(--font-display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hero-strands{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.strand-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.section-head{margin-bottom:22px}
.section-head h2{font-size:clamp(24px,3.5vw,32px);margin:8px 0 6px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:182px;border-top:4px solid var(--accent,var(--gsis-green))}
.gcard.open:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.gcard.locked{opacity:.72;cursor:not-allowed}
.gcard-top{display:flex;align-items:center;justify-content:space-between}
.gbadge{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--accent)}
.glevel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:4px 9px;border-radius:20px}
.gcard h3{font-size:18px}
.gcard p{font-size:13.5px;color:var(--muted);flex:1}
.gprog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.gprog>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .5s}
.gmeta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.lock-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.seal-mini{font-size:20px}
.ov-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.ov-title h2{font-size:clamp(24px,3.5vw,32px)}
.ov-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;min-width:92px}
.stat b{display:block;font-family:var(--font-display);font-size:22px}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.modlist{display:flex;flex-direction:column;gap:12px}
.mod{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .12s,transform .12s;text-align:left;width:100%}
.mod:hover{border-color:var(--accent);transform:translateX(2px)}
.mod.done{border-color:var(--good)}
.mod-ic{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none;border:1px solid var(--line)}
.mod.done .mod-ic{background:var(--good-bg);border-color:transparent}
.mod-body{flex:1;min-width:0}
.mod-body h4{font-size:16px;font-family:var(--font-display);font-weight:600}
.mod-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.komp{background:rgba(0,132,69,.08);color:var(--gsis-green)}
.mod-right{display:flex;align-items:center;gap:10px;flex:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:#fff;font-size:14px}
.mod.done .check{background:var(--good);border-color:var(--good)}
.exam-card{margin-top:18px;border:2px dashed var(--accent);border-radius:16px;padding:20px;text-align:center}
.exam-card h3{font-size:20px;margin-bottom:6px}
.exam-card p{color:var(--muted);font-size:14px;margin-bottom:14px}
.runner{max-width:720px;margin:0 auto}
.progressbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.progressbar>i{display:block;height:100%;background:var(--accent,var(--gsis-green));transition:width .35s}
.run-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:24px}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.task .ttype{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent,var(--gsis-green))}
.task h3{font-size:21px;margin:8px 0 16px}
.infobox{background:var(--bg);border-radius:12px;padding:18px;font-size:15.5px;border:1px solid var(--line)}
.infobox p{margin-bottom:10px}.infobox p:last-child{margin-bottom:0}
.keyterms{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kt{font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;font-weight:500;text-align:left;transition:.12s}
.opt:hover:not(.locked){border-color:var(--accent)}
.opt .mark{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.opt.sel{border-color:var(--accent)}.opt.sel .mark{background:var(--accent);border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}.opt.correct .mark{background:var(--good);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .mark{background:var(--bad);border-color:var(--bad)}
.opt.locked{cursor:default}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match-col h5{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:700}
.mitem{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-size:14.5px;font-weight:500;text-align:left;margin-bottom:9px;transition:.12s}
.mitem:hover:not(.matched):not(.locked){border-color:var(--accent)}
.mitem.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,132,69,.12)}
.mitem.locked{cursor:default}
.mitem .pairnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;margin-right:8px;vertical-align:middle}
.mitem.ok{border-color:var(--good);background:var(--good-bg)}.mitem.no{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;min-height:20px}
.chip{padding:10px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-size:14px;font-weight:500;transition:.12s}
.chip:hover:not(.placed){border-color:var(--accent)}
.chip.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,132,69,.12)}
.chip.ok{border-color:var(--good);background:var(--good-bg)}.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bucket{border:1.5px dashed var(--line-strong);border-radius:14px;padding:14px;min-height:120px;background:var(--bg)}
.bucket.target{border-color:var(--accent);background:rgba(0,132,69,.04)}
.bucket h5{font-size:14px;font-weight:700;margin-bottom:10px;text-align:center}
.bucket .drop{display:flex;flex-wrap:wrap;gap:8px}
.cloze{font-size:17px;line-height:2.1}
.cloze select{font-family:inherit;font-size:15px;padding:6px 8px;border:1.5px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink);margin:0 3px}
.cloze select.ok{border-color:var(--good);background:var(--good-bg)}.cloze select.no{border-color:var(--bad);background:var(--bad-bg)}
.reflect textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:inherit;font-size:15px;resize:vertical;color:var(--ink)}
.reflect textarea:focus{border-color:var(--accent);outline:none}
.reflect .hint{font-size:12px;color:var(--muted);margin-top:8px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cl-card{border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;background:var(--card);transition:.12s}
.cl-card.ok{border-color:var(--good);background:var(--good-bg)}
.cl-card.no{border-color:var(--bad);background:var(--bad-bg)}
.cl-ic{width:46px;height:46px;margin:0 auto 8px;color:var(--ink)}
.cl-ic svg{width:100%;height:100%}
.cl-label{font-size:13.5px;font-weight:600;margin-bottom:10px;min-height:34px;display:flex;align-items:center;justify-content:center}
.cl-choices{display:flex;gap:6px;justify-content:center}
.cl-choices button{flex:1;font-size:12px;font-weight:700;padding:7px 4px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.cl-choices button.sel{color:#fff}
.cl-choices button.sel.ai{background:var(--gsis-green);border-color:var(--gsis-green)}
.cl-choices button.sel.no{background:var(--muted);border-color:var(--muted)}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:14.5px;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--good-bg);color:#13724e}
.feedback.bad{background:var(--bad-bg);color:#a82f2f}
.task-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.streakpill{font-size:13px;font-weight:600;color:var(--muted)}.streakpill b{color:var(--gsis-green)}
.result{max-width:560px;margin:10px auto;text-align:center}
.badge-pop{width:130px;height:130px;margin:8px auto 18px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0 40%,transparent 40%),var(--accent);display:grid;place-items:center;box-shadow:var(--shadow-lg);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.badge-pop span{font-size:54px}
.result h2{font-size:28px;margin-bottom:8px}
.result .scoreline{font-size:16px;color:var(--muted);margin-bottom:6px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.dash-id{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dash-id .av{width:46px;height:46px;border-radius:50%;background:var(--gsis-green);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;flex:none}
.dash-id .who b{font-family:var(--font-display);font-size:18px}
.dash-id .who span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.dcard .k{font-size:12px;color:var(--muted);font-weight:600}
.dcard .v{font-family:var(--font-display);font-size:30px;font-weight:700;margin-top:4px}
.dcard .v small{font-size:14px;color:var(--muted);font-weight:600}
.rank-card{grid-column:1/-1;display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--ink),#2a2f3c);color:#fff}
.rank-card .v{color:#fff}.rank-ic{font-size:40px}
.rank-bar{flex:1;height:10px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin-top:8px}
.rank-bar>i{display:block;height:100%;background:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h3{font-size:18px;margin-bottom:14px}
.badge-row{display:flex;flex-wrap:wrap;gap:12px}
.bchip{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center}
.bchip .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--accent2,var(--bg));border:1px solid var(--line)}
.bchip.earned .ic{background:var(--accent2);color:#fff;border-color:transparent}
.bchip.locked .ic{opacity:.4;filter:grayscale(1)}
.bchip span{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:140px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:14px;background:var(--line);border-radius:8px;overflow:hidden}
.bar-track>i{display:block;height:100%;border-radius:8px;background:var(--accent,var(--gsis-green))}
.bar-row .pct{font-weight:700;text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
.errlist{display:flex;flex-direction:column;gap:10px}
.erritem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px}
.erritem .q{flex:1;font-size:14px}.erritem .src{font-size:11px;color:var(--muted);font-weight:600}
.cert-wrap{max-width:640px;margin:0 auto}
.cert{background:#fff;border-radius:18px;padding:38px 34px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid var(--gsis-green);border-radius:12px;opacity:.18;pointer-events:none}
.cert-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cert-head .logo-mark{width:44px;height:44px}
.cert-school{font-family:var(--font-display);font-weight:600;font-size:13px;text-align:right;line-height:1.3}
.cert-school small{color:var(--muted);display:block;font-weight:500}
.cert h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gsis-green);text-align:center}
.cert .name{font-family:var(--font-display);font-size:34px;font-weight:700;text-align:center;margin:14px 0 2px}
.cert .klasse{text-align:center;font-size:15px;font-weight:600;color:var(--gsis-green);margin-bottom:6px}
.cert .sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:22px}
.cert .sub b{color:var(--ink)}
.cert-seal{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 50% 36%,#fff 0 38%,transparent 38%),var(--gsis-green);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,132,69,.3)}
.cert-seal span{font-size:38px}
.cert-strands{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:20px}

    {type:'sort',q:{de:'Eher Mensch oder eher KI?',en:'More human or more AI?'},
     buckets:[{de:'eher Mensch 🧑',en:'more human 🧑'},{de:'eher KI 🤖',en:'more AI 🤖'}],
     items:[{text:{de:'kreativ etwas ganz Neues erfinden',en:'inventing something truly new'},bucket:0},
            {text:{de:'in Sekunden 1000 Bilder durchsuchen',en:'searching 1000 images in seconds'},bucket:1},
            {text:{de:'eine Freundin wirklich trösten',en:'truly comforting a friend'},bucket:0},
            {text:{de:'ohne Pause immer gleich arbeiten',en:'working the same way without breaks'},bucket:1}]},
    {type:'quiz',q:{de:'Ein Chatbot schreibt: „Ich bin dein bester Freund." Was stimmt?',en:'A chatbot writes: "I am your best friend." What is true?'},
     options:[{de:'Die KI hat keine echten Gefühle und ist kein Freund',en:'The AI has no real feelings and is not a friend'},
              {de:'Die KI mag mich wirklich und denkt an mich',en:'The AI really likes me and thinks about me'},
              {de:'Ich sollte ihr meine Geheimnisse erzählen',en:'I should tell it my secrets'}],
     correct:0,explain:{de:'Der Chatbot klingt nett, fühlt aber nichts. Geheimnisse und Sorgen gehören zu echten Menschen.',en:'The chatbot sounds nice but feels nothing. Secrets and worries belong with real people.'}},
    {type:'quiz',q:{de:'Du bist richtig traurig. Wer hilft am besten?',en:'You feel really sad. Who helps best?'},
     options:[{de:'Eine vertraute Person: Familie, Freund:in, Lehrkraft',en:'A trusted person: family, friend, teacher'},
              {de:'Nur der Chatbot, ganz allein',en:'Only the chatbot, all alone'},
              {de:'Niemand – das muss ich allein schaffen',en:'Nobody – I must manage alone'}],
     correct:0,explain:{de:'Bei echten Gefühlen sind echte Menschen wichtig. Du musst nichts allein schaffen.',en:'For real feelings, real people matter. You do not have to manage alone.'}}
  ]},
  {id:'K05-M4',icon:'🌱',komp:'R',niveau:'I',title:{de:'KI braucht Energie',en:'AI needs energy'},tasks:[
    {type:'info',title:{de:'KI und die Umwelt',en:'AI and the environment'},
     body:{de:'<p>KI läuft auf vielen Computern in großen <strong>Rechenzentren</strong>. Die brauchen viel <strong>Strom</strong> und <strong>Wasser</strong> zum Kühlen.</p><p>Darum ist eine gute Frage: <strong>Brauche ich hier wirklich KI – oder geht es auch einfacher?</strong></p>',
           en:'<p>AI runs on many computers in large <strong>data centres</strong>. They need a lot of <strong>electricity</strong> and <strong>water</strong> for cooling.</p><p>So a good question is: <strong>Do I really need AI here – or is there a simpler way?</strong></p>'}},
    {type:'quiz',q:{de:'Warum hat KI mit der Umwelt zu tun?',en:'Why does AI relate to the environment?'},
     options:[{de:'Rechenzentren brauchen viel Strom und Wasser',en:'Data centres need lots of electricity and water'},
              {de:'KI besteht aus Plastik, das im Meer landet',en:'AI is made of plastic that ends up in the sea'},
              {de:'KI atmet wie Menschen und Tiere',en:'AI breathes like humans and animals'}],
     correct:0,explain:{de:'Der Stromhunger der Rechenzentren ist der Punkt – nicht Plastik oder Atmen.',en:'The electricity demand of data centres is the point – not plastic or breathing.'}},
    {type:'sort',q:{de:'Wann lohnt sich KI – und wann geht es einfach so?',en:'When is AI worth it – and when is it fine without?'},
     buckets:[{de:'KI kann sinnvoll sein',en:'AI can make sense'},{de:'geht gut ohne KI',en:'fine without AI'}],

            {text:{de:'2 + 2 ausrechnen',en:'working out 2 + 2'},bucket:1},
            {text:{de:'einen langen Text in viele Sprachen übersetzen',en:'translating a long text into many languages'},bucket:0},
            {text:{de:'deiner Freundin „Hallo" schreiben',en:'writing "hi" to your friend'},bucket:1}]},
    {type:'reflect',q:{de:'Nenne eine Sache, bei der du KI NICHT brauchst und die auch ohne gut klappt.',en:'Name one thing where you do NOT need AI and that works fine without it.'},

 K06:[
  {id:'K06-M1',icon:'🔄',komp:'V',niveau:'I',title:{de:'Auffrischung Klasse 5',en:'Refresher Grade 5'},tasks:[
    {type:'quiz',q:{de:'Was stimmt über KI?',en:'What is true about AI?'},
     options:[{de:'Sie ahmt schlaues Verhalten nach und kann Fehler machen',en:'It imitates smart behaviour and can make mistakes'},
              {de:'Sie weiß immer die Wahrheit',en:'It always knows the truth'},{de:'Sie hat echte Gefühle',en:'It has real feelings'}],
     correct:0,explain:{de:'KI ahmt nach, irrt sich manchmal und fühlt nichts.',en:'AI imitates, sometimes errs and feels nothing.'}},
    {type:'sort',q:{de:'Stärke von Mensch oder KI?',en:'Strength of human or AI?'},
     buckets:[{de:'Mensch',en:'Human'},{de:'KI',en:'AI'}],
     items:[{text:{de:'Mitgefühl zeigen',en:'showing compassion'},bucket:0},
            {text:{de:'riesige Datenmengen durchsuchen',en:'searching huge amounts of data'},bucket:1},
            {text:{de:'eine eigene Idee entwickeln',en:'developing an own idea'},bucket:0}]}
  ]},
  {id:'K06-M2',icon:'⚙️',komp:'V',niveau:'I→II',title:{de:'Wie „lernt" eine KI?',en:'How does AI "learn"?'},tasks:[
    {type:'info',title:{de:'Regeln oder Beispiele',en:'Rules or examples'},
     body:{de:'<p>Manche Technik folgt <strong>festen Regeln</strong> (z. B. ein Taschenrechner). KI lernt anders: Sie bekommt <strong>viele Beispiele</strong> und erkennt darin <strong>Muster</strong>.</p><p>Gute Beispiele → bessere KI. Schlechte oder einseitige Beispiele → schlechtere KI.</p>',
           en:'<p>Some technology follows <strong>fixed rules</strong> (e.g. a calculator). AI learns differently: it gets <strong>many examples</strong> and finds <strong>patterns</strong> in them.</p><p>Good examples → better AI. Poor or one-sided examples → worse AI.</p>'}},
    {type:'quiz',q:{de:'Worin unterscheidet sich KI von einem Taschenrechner?',en:'How does AI differ from a calculator?'},
     options:[{de:'KI lernt aus Beispielen, der Rechner folgt festen Regeln',en:'AI learns from examples, the calculator follows fixed rules'},
              {de:'KI ist immer schneller',en:'AI is always faster'},{de:'Es gibt keinen Unterschied',en:'There is no difference'}],
     correct:0,explain:{de:'Der Kern: Regeln (Rechner) vs. Muster aus Beispielen lernen (KI). Schneller ist KI dabei nicht automatisch – der Unterschied liegt darin, wie sie zur Antwort kommt.',en:'The core: rules (calculator) vs learning patterns from examples (AI). AI is not automatically faster – the difference is in how it arrives at an answer.'}},
    {type:'quiz',q:{de:'Eine KI erkennt Katzen schlecht, weil sie nur Hunde-Bilder zum Üben hatte. Warum?',en:'An AI recognises cats poorly because it only had dog images to train on. Why?'},
     options:[{de:'Die Beispiele waren einseitig – sie hat Katzen kaum gesehen',en:'The examples were one-sided – it barely saw cats'},
              {de:'Katzen sind zu schnell für KI',en:'Cats are too fast for AI'},{de:'KI mag keine Katzen',en:'AI dislikes cats'}],
     correct:0,explain:{de:'KI ist nur so gut wie ihre Beispiele. Fehlen Katzen, kann sie sie kaum erkennen.',en:'AI is only as good as its examples. Without cats, it can barely recognise them.'}}
  ]},
  {id:'K06-M3',icon:'📱',komp:'R',niveau:'II',title:{de:'Empfehlungen & „Für dich"',en:'Recommendations & "For you"'},tasks:[
    {type:'info',title:{de:'Warum dir Apps Dinge vorschlagen',en:'Why apps suggest things to you'},
     body:{de:'<p>Viele Apps nutzen KI, die <strong>vorhersagt</strong>, was dir gefällt – auf Basis dessen, was du schon angeschaut hast.</p><p>Das ist praktisch, kann dich aber in eine <strong>Blase</strong> bringen: Du siehst immer mehr vom Gleichen und kaum Neues.</p>',
           en:'<p>Many apps use AI that <strong>predicts</strong> what you like – based on what you already watched.</p><p>Handy, but it can put you in a <strong>bubble</strong>: you see more of the same and little that is new.</p>'}},
    {type:'quiz',q:{de:'Eine App zeigt dir immer ähnliche Videos. Was ist ein Nachteil?',en:'An app keeps showing you similar videos. What is a drawback?'},
     options:[{de:'Du entdeckst kaum noch etwas Neues',en:'You barely discover anything new'},
              {de:'Du bekommst weniger Werbung, weil die App genau weiß, was dir gefällt',en:'You get less advertising because the app knows exactly what you like'},{de:'Die App braucht dann weniger Internet',en:'The app then needs less internet data'}],
     correct:0,explain:{de:'Empfehlungen können einengen – man bleibt in der „Blase". Das hat nichts mit Werbung oder Datenverbrauch zu tun.',en:'Recommendations can narrow things – you stay in the "bubble". This has nothing to do with ads or data usage.'}},
    {type:'multi',q:{de:'Wie behältst du den Überblick? (Mehrere)',en:'How do you stay in control? (Several)'},
     options:[{de:'Bewusst auch andere Themen suchen',en:'Deliberately search other topics too'},
              {de:'Mir klarmachen, dass eine KI die Vorschläge macht',en:'Remind myself an AI makes the suggestions'},
              {de:'Auch Quellen außerhalb der App nutzen',en:'Use sources outside the app too'},
              {de:'Einfach immer nur dem ersten Vorschlag folgen',en:'Just always follow the first suggestion'}],
     correct:[0,1,2],explain:{de:'Aktiv breit suchen und die KI-Rolle kennen hilft – blind folgen nicht.',en:'Actively broadening and knowing the AI role helps – blindly following does not.'}}
  ]},
  {id:'K06-M4',icon:'💬',komp:'A',niveau:'II',title:{de:'Gute Prompts schreiben',en:'Writing good prompts'},tasks:[
    {type:'info',title:{de:'Klar fragen, bessere Antwort',en:'Ask clearly, get a better answer'},
     body:{de:'<p>Ein <strong>Prompt</strong> ist deine Eingabe an die KI. Klar + mit <strong>Kontext</strong> = bessere Antwort.</p><p>Vergleiche: „Schreib was über Hunde" vs. „Erkläre einem 10-Jährigen in 3 Sätzen, warum Hunde gut hören."</p>',
           en:'<p>A <strong>prompt</strong> is your input to the AI. Clear + with <strong>context</strong> = better answer.</p><p>Compare: "Write about dogs" vs "Explain to a 10-year-old in 3 sentences why dogs hear well."</p>'}},
    {type:'quiz',q:{de:'Welcher Prompt ist besser?',en:'Which prompt is better?'},
     options:[{de:'„Erkläre mir in 3 einfachen Sätzen, wie Regen entsteht."',en:'"Explain to me in 3 simple sentences how rain forms."'},
              {de:'„Wetter."',en:'"Weather."'},{de:'„Schreib irgendwas."',en:'"Write something."'}],
     correct:0,explain:{de:'Konkret, mit Format und Kontext – das führt zu nützlichen Antworten.',en:'Specific, with format and context – that leads to useful answers.'}},
    {type:'cloze',q:{de:'Was macht einen guten Prompt aus?',en:'What makes a good prompt?'},
     segments:[{de:'Ein guter Prompt ist ',en:'A good prompt is '},{blank:0},{de:' und gibt ',en:' and gives '},{blank:1},{de:'.',en:'.'}],
     blanks:[{options:[{de:'klar',en:'clear'},{de:'geheim',en:'secret'}],correct:0},
             {options:[{de:'Kontext',en:'context'},{de:'Geld',en:'money'}],correct:0}],
     explain:{de:'Klare Formulierung plus Kontext helfen der KI, deine Absicht zu verstehen – das führt zu besseren Antworten.',en:'Clear wording plus context help the AI understand your intent – that leads to better answers.'}},
    {type:'quiz',q:{de:'Die KI antwortet daneben. Was tust du zuerst?',en:'The AI answers off-target. What do you do first?'},
     options:[{de:'Den Prompt genauer und klarer formulieren',en:'Make the prompt more precise and clear'},
              {de:'Die App löschen',en:'Delete the app'},{de:'Die Antwort einfach übernehmen',en:'Just use the answer anyway'}],
     correct:0,explain:{de:'Erst den Prompt verbessern – oft liegt es an der Frage, nicht an dir.',en:'Improve the prompt first – often it is the question, not you.'}}
  ]}
 ],
 K07:[
  {id:'K07-M1',icon:'🔄',komp:'V',niveau:'II',title:{de:'Auffrischung Klasse 6',en:'Refresher Grade 6'},tasks:[
    {type:'quiz',q:{de:'Warum erkennt eine KI manche Dinge schlecht?',en:'Why does an AI recognise some things poorly?'},
     options:[{de:'Ihre Trainingsbeispiele waren einseitig',en:'Its training examples were one-sided'},
              {de:'Der Computer dahinter ist nicht schnell genug',en:'The computer behind it is not fast enough'},{de:'Sie ist noch neu und existiert noch nicht lange',en:'It is still new and has not existed for long'}],
     correct:0,explain:{de:'Einseitige Beispiele → einseitige KI. Es liegt nicht an der Rechenleistung oder daran, wie neu die KI ist.',en:'One-sided examples → one-sided AI. It is not about computing power or how new the AI is.'}},
    {type:'quiz',q:{de:'Was macht einen guten Prompt aus?',en:'What makes a good prompt?'},
     options:[{de:'Klar, konkret und mit Kontext',en:'Clear, specific and with context'},
              {de:'So kurz wie möglich, egal wie unklar',en:'As short as possible, no matter how unclear'},
              {de:'Möglichst viele schwierige Wörter',en:'As many difficult words as possible'}],
     correct:0,explain:{de:'Klarheit und Kontext schlagen Kürze um jeden Preis.',en:'Clarity and context beat shortness at all cost.'}}
  ]},
  {id:'K07-M2',icon:'⚖️',komp:'R',niveau:'II',title:{de:'Bias & Fairness',en:'Bias & fairness'},tasks:[
    {type:'info',title:{de:'Wenn KI unfair wird',en:'When AI becomes unfair'},
     body:{de:'<p>KI lernt aus Daten aus der echten Welt. Sind die Daten <strong>einseitig</strong>, übernimmt die KI diese Einseitigkeit – das nennt man <strong>Bias</strong>.</p><p>Beispiel: Eine Gesichtserkennung funktioniert schlechter bei Gruppen, die in den Trainingsdaten kaum vorkamen. Das kann <strong>unfaire Folgen</strong> haben.</p>',
           en:'<p>AI learns from real-world data. If the data is <strong>one-sided</strong>, the AI adopts that bias – this is called <strong>bias</strong>.</p><p>Example: face recognition works worse for groups barely present in the training data. This can have <strong>unfair consequences</strong>.</p>'}},
    {type:'quiz',q:{de:'Woher kommt Bias in einer KI vor allem?',en:'Where does bias in an AI mainly come from?'},
     options:[{de:'Aus einseitigen Trainingsdaten und Entscheidungen von Menschen',en:'From one-sided training data and human decisions'},
              {de:'Daraus, dass KI selbst Meinungen hat',en:'From AI having opinions of its own'},
              {de:'Aus zu schnellem Internet',en:'From internet that is too fast'}],
     correct:0,explain:{de:'Bias steckt in den Daten und im Design – nicht in „Meinungen" der KI und auch nicht an der Geschwindigkeit des Internets.',en:'Bias sits in the data and design – not in AI "opinions", and not in how fast the internet is.'}},
    {type:'quiz',q:{de:'Eine Bewerbungs-KI bevorzugt Männer, weil sie aus alten Daten lernte. Das ist …',en:'A hiring AI favours men because it learned from old data. That is …'},
     options:[{de:'… ein Bias mit unfairen Folgen für eine Gruppe',en:'… a bias with unfair consequences for a group'},
              {de:'… reiner Zufall ohne Bedeutung',en:'… pure chance without meaning'},
              {de:'… ein Zeichen, dass die KI klug ist',en:'… a sign the AI is clever'}],
     correct:0,explain:{de:'Alte, einseitige Daten führen zu unfairer Behandlung – ein klassischer Bias.',en:'Old, one-sided data leads to unfair treatment – a classic bias.'}},
    {type:'reflect',q:{de:'Wo könnte unfaire KI im Alltag Probleme machen? Nenne ein Beispiel.',en:'Where could unfair AI cause problems in daily life? Name one example.'},
     placeholder:{de:'z. B. Empfehlungen, Bewerbungen, Erkennung …',en:'e.g. recommendations, job applications, recognition …'}}
  ]},
  {id:'K07-M3',icon:'🕵️',komp:'R',niveau:'II',title:{de:'Halluzinationen & Desinformation',en:'Hallucinations & disinformation'},tasks:[
    {type:'info',title:{de:'Wenn KI etwas erfindet',en:'When AI makes things up'},
     body:{de:'<p>Eine <strong>Halluzination</strong> ist eine erfundene KI-Antwort, die echt klingt. Dazu kommt <strong>Desinformation</strong>: absichtlich falsche Inhalte, z. B. <strong>Deepfakes</strong>.</p><p>Schutz: gegen <strong>vertrauenswürdige Quellen</strong> prüfen. Und: selbst <strong>keine</strong> Fälschungen erstellen, die anderen schaden.</p>',
           en:'<p>A <strong>hallucination</strong> is a made-up AI answer that sounds real. On top of that: <strong>disinformation</strong> – deliberately false content, e.g. <strong>deepfakes</strong>.</p><p>Protection: check against <strong>trusted sources</strong>. And: do not create fakes yourself that harm others.</p>'}},
    {type:'quiz',q:{de:'Was ist eine „Halluzination" bei KI?',en:'What is an AI "hallucination"?'},
     options:[{de:'Eine erfundene Antwort, die echt klingt',en:'A made-up answer that sounds real'},
              {de:'Ein Bild, das flackert',en:'An image that flickers'},{de:'Ein Computervirus',en:'A computer virus'}],
     correct:0,explain:{de:'Klingt überzeugend, ist aber frei erfunden – deshalb prüfen.',en:'Sounds convincing but is invented – so check.'}},
    {type:'quiz',q:{de:'Wie prüfst du eine überraschende KI-Behauptung am besten?',en:'How do you best check a surprising AI claim?'},
     options:[{de:'Gegen mehrere vertrauenswürdige Quellen abgleichen',en:'Cross-check against several trusted sources'},
              {de:'Die KI nochmal genau dasselbe fragen',en:'Ask the AI the exact same thing again'},
              {de:'Glauben, weil es sicher klingt',en:'Believe it because it sounds confident'}],
     correct:0,explain:{de:'Mehrere unabhängige Quellen schlagen eine selbstsichere KI-Stimme.',en:'Several independent sources beat a confident AI voice.'}},
    {type:'quiz',q:{de:'Ein Freund will mit KI ein gefälschtes Video einer Mitschülerin machen. Richtig ist:',en:'A friend wants to make a fake video of a classmate with AI. The right move is:'},
     options:[{de:'Nicht mitmachen – das schadet ihr und ist nicht okay',en:'Do not join – it harms her and is not okay'},
              {de:'Mitmachen, ist ja nur Spaß',en:'Join in, it is just fun'},{de:'Heimlich teilen',en:'Share it secretly'}],
     correct:0,explain:{de:'Deepfakes von echten Personen können verletzen – das macht man nicht.',en:'Deepfakes of real people can hurt – you do not do that.'}}
  ]},
  {id:'K07-M4',icon:'🎨',komp:'A',niveau:'II',title:{de:'Mit KI gestalten & Quellen',en:'Creating with AI & sources'},tasks:[
    {type:'info',title:{de:'KI als Ideen-Partner – ehrlich bleiben',en:'AI as an idea partner – stay honest'},
     body:{de:'<p>KI kann beim <strong>Ideen sammeln</strong> helfen. Gut ist: <strong>erst selbst denken</strong>, dann mit KI vergleichen.</p><p>Wenn du KI nutzt, <strong>kennzeichne es ehrlich</strong> – z. B.: <em>„Erstellt mit Hilfe von [KI-Tool]. Prompt: …"</em></p>',
           en:'<p>AI can help <strong>brainstorm</strong>. Best practice: <strong>think for yourself first</strong>, then compare with AI.</p><p>If you use AI, <strong>label it honestly</strong> – e.g.: <em>"Created with help of [AI tool]. Prompt: …"</em></p>'}},
    {type:'quiz',q:{de:'Du sammelst Ideen für ein Plakat. Wie nutzt du KI sinnvoll?',en:'You brainstorm ideas for a poster. How do you use AI well?'},
     options:[{de:'Erst eigene Ideen, dann mit KI-Vorschlägen vergleichen',en:'Own ideas first, then compare with AI suggestions'},
              {de:'Nur die KI machen lassen, ohne eigenes Denken',en:'Let the AI do it all, no own thinking'},
              {de:'KI nutzen und so tun, als wäre alles von mir',en:'Use AI and pretend it was all me'}],
     correct:0,explain:{de:'Eigenes Denken zuerst, KI als Partner, ehrlich kennzeichnen.',en:'Own thinking first, AI as partner, label honestly.'}},
    {type:'quiz',q:{de:'Du hast ein KI-Bild für dein Referat benutzt. Was ist fair?',en:'You used an AI image for your talk. What is fair?'},
     options:[{de:'KI-Einsatz kennzeichnen',en:'Mark that AI was used'},
              {de:'So tun, als hättest du es selbst gemalt',en:'Pretend you painted it yourself'},
              {de:'Behaupten, es sei ein Foto',en:'Claim it is a photo'}],
     correct:0,explain:{de:'Ehrliche Kennzeichnung schützt dich und ist fair gegenüber anderen.',en:'Honest labelling protects you and is fair to others.'}},
    {type:'match',q:{de:'Ordne zu: Was gehört zur ehrlichen KI-Nutzung?',en:'Match: what belongs to honest AI use?'},
     pairs:[{left:{de:'Kennzeichnen',en:'Label'},right:{de:'angeben, welches Tool & welcher Prompt',en:'state which tool & prompt'}},
            {left:{de:'Prüfen',en:'Check'},right:{de:'Inhalte gegen Quellen abgleichen',en:'cross-check content with sources'}},
            {left:{de:'Eigenleistung',en:'Own work'},right:{de:'erst selbst denken, dann KI nutzen',en:'think first, then use AI'}}]}
  ]}
 ],
 K08:[
  {id:'K08-M1',icon:'🔄',komp:'V',niveau:'II',title:{de:'Auffrischung Klasse 7',en:'Refresher Grade 7'},tasks:[
    {type:'quiz',q:{de:'Was ist Bias bei KI?',en:'What is bias in AI?'},
     options:[{de:'Eine systematische Einseitigkeit aus Daten oder Design',en:'A systematic one-sidedness from data or design'},
              {de:'Ein technischer Defekt am Bildschirm',en:'A technical screen defect'},{de:'Eine Meinung der KI',en:'An opinion of the AI'}],
     correct:0,explain:{de:'Bias = systematische Einseitigkeit, meist aus den Daten.',en:'Bias = systematic one-sidedness, mostly from the data.'}},
    {type:'quiz',q:{de:'Wie nutzt du KI ehrlich beim Gestalten?',en:'How do you use AI honestly when creating?'},
     options:[{de:'Einsatz kennzeichnen und prüfen',en:'Label the use and check'},
              {de:'Als komplett eigene Arbeit ausgeben',en:'Pass it off as fully my own work'},{de:'Quellen verschweigen',en:'Hide the sources'}],
     correct:0,explain:{de:'Kennzeichnen + prüfen = ehrliche Nutzung.',en:'Label + check = honest use.'}}
  ]},
  {id:'K08-M2',icon:'🧩',komp:'A',niveau:'II→III',title:{de:'Aufgaben teilen: Mensch oder KI?',en:'Dividing tasks: human or AI?'},tasks:[
    {type:'info',title:{de:'Klug aufteilen',en:'Divide wisely'},
     body:{de:'<p>Eine große Aufgabe besteht aus Schritten. Frage bei jedem Schritt: <strong>Was kann KI gut – und wo braucht es meine eigene Stimme und mein Urteil?</strong></p><p>Beispiel Aufsatz: KI kann beim <em>Brainstorming</em> helfen, aber <strong>Meinung, Argumente und Schreibstil</strong> bleiben bei dir.</p>',
           en:'<p>A big task has steps. For each step ask: <strong>What is AI good at – and where do I need my own voice and judgement?</strong></p><p>Essay example: AI can help <em>brainstorm</em>, but <strong>opinion, arguments and style</strong> stay with you.</p>'}},
    {type:'sort',q:{de:'Aufsatz schreiben: eher KI oder eher du selbst?',en:'Writing an essay: more AI or more you?'},
     buckets:[{de:'KI kann unterstützen',en:'AI can support'},{de:'lieber selbst',en:'better yourself'}],
     items:[{text:{de:'erste Ideen sammeln',en:'gathering first ideas'},bucket:0},
            {text:{de:'deine eigene Meinung formulieren',en:'forming your own opinion'},bucket:1},
            {text:{de:'Rechtschreibung gegenlesen',en:'proofreading spelling'},bucket:0},
            {text:{de:'die Hauptargumente auswählen',en:'choosing the main arguments'},bucket:1}]},
    {type:'quiz',q:{de:'Wofür sollte beim Aufsatz deine eigene Stimme entscheiden?',en:'What in the essay should your own voice decide?'},
     options:[{de:'Meinung, Argumente und Schreibstil',en:'Opinion, arguments and writing style'},

  {id:'K08-M4',icon:'🛡️',komp:'R',niveau:'III',title:{de:'Grenzen, Risiken & Datenschutz',en:'Limits, risks & data protection'},tasks:[
    {type:'info',title:{de:'Sicher und überlegt',en:'Safe and considered'},

  {id:'K09-M2',icon:'🔬',komp:'R',niveau:'III',title:{de:'KI bewerten & vergleichen',en:'Evaluating & comparing AI'},tasks:[
    {type:'info',title:{de:'Nicht jede KI passt zu jeder Aufgabe',en:'Not every AI fits every task'},
     body:{de:'<p>Bewerte ein KI-System nach: <strong>Zweck</strong> (wofür gemacht?), <strong>Nutzer</strong> (für wen?), <strong>Grenzen</strong> (was kann es nicht?) und <strong>Folgen</strong> (wer profitiert, wer nicht?).</p><p>Oft lohnt sich der <strong>Vergleich</strong> mehrerer Werkzeuge – oder die Entscheidung, gar keine KI zu nutzen.</p>',
           en:'<p>Evaluate an AI system by: <strong>purpose</strong> (made for what?), <strong>users</strong> (for whom?), <strong>limits</strong> (what can it not do?) and <strong>impact</strong> (who benefits, who not?).</p><p>Often it pays to <strong>compare</strong> several tools – or decide to use no AI at all.</p>'}},
    {type:'quiz',q:{de:'Welche Frage hilft am besten, ein KI-Tool zu bewerten?',en:'Which question best helps to evaluate an AI tool?'},

              {de:'Welche Farbe hat das Logo?',en:'What colour is the logo?'},{de:'Wie viele nutzen es?',en:'How many people use it?'}],

    {type:'multi',q:{de:'Wonach beurteilst du ein KI-System fair? (Mehrere)',en:'By what do you judge an AI system fairly? (Several)'},

  {id:'K09-M3',icon:'🧪',komp:'M',niveau:'III',title:{de:'KI mitgestalten — Daten & Bias',en:'Shaping AI — data & bias'},tasks:[
    {type:'info',title:{de:'Daten formen das Verhalten',en:'Data shapes behaviour'},
     body:{de:'<p>Wer eine KI baut, wählt <strong>Daten</strong> aus – und diese Auswahl prägt, wie die KI sich verhält. Einseitige Daten → einseitige KI.</p><p>Mitgestalten heißt: bewusst auf <strong>ausgewogene Daten</strong> achten und das Ergebnis <strong>testen</strong>.</p>',
           en:'<p>Whoever builds an AI selects <strong>data</strong> – and that selection shapes how the AI behaves. One-sided data → one-sided AI.</p><p>Shaping means: deliberately aim for <strong>balanced data</strong> and <strong>test</strong> the result.</p>'}},
    {type:'quiz',q:{de:'Du trainierst eine KI, die Äpfel und Tomaten erkennt. Was ist wichtig?',en:'You train an AI to recognise apples and tomatoes. What matters?'},

    {type:'quiz',q:{de:'Dein Modell verwechselt grüne Äpfel mit Tomaten. Beste Erklärung?',en:'Your model confuses green apples with tomatoes. Best explanation?'},

     correct:0,explain:{de:'Lücken in den Daten zeigen sich direkt im Verhalten der KI – nicht die „Ähnlichkeit" der Früchte allein entscheidet.',en:'Gaps in the data show up directly in the AI behaviour – it is not just how similar the fruits look.'},prod:true}
  ]},
  {id:'K09-M4',icon:'🌍',komp:'M',niveau:'III',title:{de:'Ethik, Gesellschaft & dein Projekt',en:'Ethics, society & your project'},tasks:[
    {type:'info',title:{de:'KI verantwortungsvoll mitgestalten',en:'Shaping AI responsibly'},
     body:{de:'<p>KI wirkt auf <strong>Gesellschaft</strong>: Sie kann informieren – oder mit Desinformation der <strong>Demokratie</strong> schaden. Frage immer: <strong>Wer profitiert, wer wird benachteiligt?</strong></p><p>Zum Abschluss entwickelst du eine Idee, wie KI <strong>für den Menschen</strong> verbessert werden könnte, und reflektierst deinen KI-Einsatz.</p>',

 {id:'OB-1',icon:'🔎',komp:'V',title:{de:'KI als Recherche- und Antwortmaschine',en:'AI as a research and answer engine'},tasks:[
   {type:'info',title:{de:'Chatbot oder Antwortmaschine?',en:'Chatbot or answer engine?'},
    body:{de:'<p>Klassische Chatbots wie ChatGPT oder Gemini erzeugen Text aus Wahrscheinlichkeiten – ohne automatisch Belege zu liefern. <strong>KI-Antwortmaschinen</strong> wie <strong>Perplexity</strong> kombinieren das mit einer Websuche und geben zu jeder Aussage <strong>Quellenlinks</strong> an.</p><p>Das ist praktisch für den Einstieg in ein Thema – ersetzt aber nicht das genaue Lesen und Bewerten der Originalquelle.</p>',
          en:'<p>Classic chatbots such as ChatGPT or Gemini generate text from probabilities – without automatically providing evidence. <strong>AI answer engines</strong> such as <strong>Perplexity</strong> combine this with a web search and give <strong>source links</strong> for each claim.</p><p>That is useful to get started on a topic – but it does not replace actually reading and evaluating the original source.</p>'},
    terms:[{de:'Antwortmaschine',en:'Answer engine'},{de:'Quellenlink',en:'Source link'},{de:'Wissenschaftliches Arbeiten',en:'Academic work'}]},

    body:{de:'<p>KI kann in mehreren Phasen einer wissenschaftlichen Arbeit unterstützen: beim <strong>Brainstorming</strong> möglicher Themen, beim <strong>Einstieg in die Recherche</strong> und bei <strong>Gliederungsvorschlägen</strong>.</p><p>Nicht abnehmen kann sie dir: die <strong>eigene Fragestellung</strong> schärfen, Quellen <strong>kritisch bewerten</strong> und deine <strong>Argumentation</strong> entwickeln – das bleibt deine Eigenleistung.</p>',
          en:'<p>AI can support several phases of an academic paper: <strong>brainstorming</strong> possible topics, an <strong>entry point into research</strong>, and suggesting an <strong>outline</strong>.</p><p>What it cannot do for you: sharpening your <strong>own research question</strong>, <strong>critically evaluating</strong> sources, and developing your <strong>argument</strong> – that stays your own work.</p>'}},

 {id:'OB-3',icon:'📋',komp:'R',title:{de:'Spielregeln – KI bei Hausaufgaben, Prüfungen & Qualifikationsphase',en:'Ground rules – AI in homework, exams & the qualification phase'},tasks:[
   {type:'info',title:{de:'Regeln kennen, bevor du KI einsetzt',en:'Know the rules before you use AI'},
    body:{de:'<p>Ob und wie du KI nutzen darfst, hängt vom <strong>Format</strong> ab: Hausaufgabe, Klassenarbeit, Facharbeit, Abiturprüfung im 4./5. Fach oder ein bewertetes Lernprodukt in der Qualifikationsphase – überall gelten <strong>unterschiedliche Regeln</strong>.</p><p><strong>[Platzhalter – von der Schule zu ergänzen]:</strong> Hier trägt eure Schule die aktuell gültigen Regelungen für Hausaufgaben, die Abiturprüfung im 4./5. Fach im DIA sowie für Lernprodukte in der Qualifikationsphase ein.</p><p>Grundregel, die immer gilt: <strong>im Zweifel vorher fragen</strong> – nicht nachträglich rechtfertigen.</p>',
          en:'<p>Whether and how you may use AI depends on the <strong>format</strong>: homework, class test, extended essay, the Abitur exam in the 4th/5th subject, or a graded learning product in the qualification phase – <strong>different rules</strong> apply everywhere.</p><p><strong>[Placeholder – to be completed by the school]:</strong> Your school fills in the currently valid rules here for homework, the Abitur exam in the 4th/5th DIA subject, and learning products in the qualification phase.</p><p>The rule that always applies: <strong>when in doubt, ask first</strong> – do not justify it afterwards.</p>'}},
   {type:'quiz',q:{de:'Warum können sich die Regeln zum KI-Einsatz zwischen Hausaufgabe und Abiturprüfung unterscheiden?',en:'Why can the rules for AI use differ between homework and the Abitur exam?'},
    options:[{de:'Weil bei Prüfungen die eigene, unter Aufsicht erbrachte Leistung bewertet wird, bei Hausaufgaben eher der Lernprozess',en:'Because exams assess your own performance under supervision, while homework is more about the learning process'},

 {id:'OB-4',icon:'✍️',komp:'M',title:{de:'Eigenständiges Arbeiten mit KI-Unterstützung',en:'Working independently with AI support'},tasks:[
   {type:'info',title:{de:'Was „geistige Eigenleistung" bedeutet',en:'What "own intellectual work" means'},
    body:{de:'<p>Eine KI-unterstützte Arbeit bleibt deine eigene, wenn <strong>die Fragestellung, die Bewertung der Ergebnisse und die endgültige Argumentation von dir stammen</strong>. KI darf <strong>Sparringspartner</strong> sein – nicht Autor:in.</p><p>Wichtig: <strong>Dokumentiere</strong>, wo und wie du KI genutzt hast. Das schützt dich und zeigt Transparenz.</p>',
          en:'<p>An AI-supported piece of work remains your own if <strong>the research question, the evaluation of results and the final argument come from you</strong>. AI may be a <strong>sparring partner</strong> – not the author.</p><p>Important: <strong>document</strong> where and how you used AI. That protects you and shows transparency.</p>'}},

 {id:'OB-5',icon:'🧐',komp:'R',title:{de:'Quellenkritik & Plagiatsproblematik',en:'Source criticism & plagiarism issues'},tasks:[
   {type:'info',title:{de:'Wenn KI Quellen erfindet',en:'When AI invents sources'},
    body:{de:'<p>KI-Systeme können <strong>Zitate, Studien oder Quellenangaben erfinden</strong>, die überzeugend klingen, aber nicht existieren. Jede von einer KI genannte Quelle musst du <strong>selbst suchen und verifizieren</strong>, bevor du sie verwendest.</p><p><strong>Plagiat</strong> bedeutet, fremde (auch KI-generierte) Formulierungen oder Ideen als eigene auszugeben. Nutzt du KI-Text, musst du das <strong>kenntlich machen</strong> – genau wie ein Zitat.</p>',
          en:'<p>AI systems can <strong>invent quotes, studies or references</strong> that sound convincing but do not exist. Every source an AI names must be <strong>found and verified by you</strong> before you use it.</p><p><strong>Plagiarism</strong> means presenting someone else\'s (including AI-generated) wording or ideas as your own. If you use AI text, you must <strong>mark it as such</strong> – just like a quotation.</p>'}},
   {type:'quiz',q:{de:'Eine KI nennt dir eine Studie mit Autor:in, Jahr und Titel als Beleg. Was tust du?',en:'An AI gives you a study with author, year and title as evidence. What do you do?'},
    options:[{de:'Ich suche die Studie eigenständig und prüfe, ob sie wirklich existiert',en:'I look up the study myself and check whether it really exists'},
             {de:'Ich übernehme den Beleg, die Angaben klingen genau genug',en:'I use the reference as is, the details sound precise enough'},
             {de:'Ich frage die KI nochmal, ob sie sich sicher ist',en:'I ask the AI again whether it is sure'}],
    correct:0,explain:{de:'KI kann täuschend genaue, aber frei erfundene Quellen nennen. Nur eine eigenständige Prüfung schützt dich vor einem Fake-Beleg.',en:'AI can name deceptively precise but entirely invented sources. Only checking it yourself protects you from a fake reference.'}},
   {type:'multi',q:{de:'Was zählt im KI-Kontext als Plagiat? (Mehrere)',en:'What counts as plagiarism in an AI context? (Several)'},
    options:[{de:'KI-generierten Text unverändert ohne Kennzeichnung abgeben',en:'Submitting AI-generated text unchanged without labelling it'},

function modulesOf(g){return CONTENT[g]||[];}
function gradeComplete(g){const m=modulesOf(g);return m.length>0&&m.every(x=>STATE.done[x.id]);}
function gradeProgress(g){const m=modulesOf(g);if(!m.length)return 0;return Math.round(m.filter(x=>STATE.done[x.id]).length/m.length*100);}
function isUnlocked(g){if(g==='OB')return STATE.teacher||STATE.seniorUnlocked;return STATE.teacher||STATE.unlocked.includes(g);}

function exportPNG(id,fn){const el=document.getElementById(id);if(!el||typeof html2canvas==='undefined'){toast(L()==='de'?'Export nicht verfügbar':'Export unavailable');return;}
  toast(L()==='de'?'Bild wird erstellt …':'Creating image …');
  html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(c=>{const a=document.createElement('a');a.download=fn+'.png';a.href=c.toDataURL('image/png');a.click();}).catch(()=>toast(L()==='de'?'Export fehlgeschlagen':'Export failed'));}
/* ===== 11) Modals ===== */
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function openName(after){modal(`<h3>${t('nameTitle')}</h3><p>${t('nameLead')}</p>
   <label class="flabel">${t('nameLabel')}</label><input class="field" id="nameIn" placeholder="${t('namePh')}" value="${STATE.name||''}">
   <label class="flabel">${t('klasseLabel')}</label><input class="field" id="klasseIn" placeholder="${t('klassePh')}" value="${STATE.klasse||''}">
   <p style="font-size:12.5px;color:var(--muted);margin:-6px 0 14px">🔒 ${t('privacyNote')} <button class="footlink" onclick="openPrivacy()">${t('privacy')}</button></p>
   <div class="modal-actions"><button class="btn" id="nameSave">${t('save')}</button></div>`);
  document.getElementById('nameIn').focus();
  document.getElementById('nameSave').onclick=()=>{const v=document.getElementById('nameIn').value.trim();STATE.klasse=document.getElementById('klasseIn').value.trim();if(v)STATE.name=v;save();closeModal();updateChrome();if(after)after();};}
function openSenior(){modal(`<h3>${t('obCodeTitle')}</h3><p>${t('obCodeLead')}</p><input class="field" id="obcode" type="password" placeholder="${t('obCodePh')}">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button><button class="btn" id="obUnlockBtn">${t('unlock')}</button></div>`);
  document.getElementById('obUnlockBtn').onclick=()=>{if(document.getElementById('obcode').value.trim()===SENIOR_CODE){STATE.seniorUnlocked=true;save();closeModal();go('senior');}else toast(L()==='de'?'Code falsch':'Wrong code');};}

function openPrivacy(){modal(`<h3>${t('privacy')}</h3>
   <div style="max-height:60vh;overflow:auto;font-size:14px;line-height:1.6">${tx({
     de:`<p>Diese App läuft komplett in deinem Browser – es gibt keinen Server, der deine Eingaben empfängt.</p>
       <p><strong>Was gespeichert wird:</strong> Dein Name, deine Klasse, deine Antworten, Punkte und dein Fortschritt werden ausschließlich lokal auf diesem Gerät gespeichert (im „localStorage" deines Browsers).</p>
       <p><strong>Was NICHT passiert:</strong> Diese Daten werden nicht automatisch an einen Server, an die Schule oder an Dritte gesendet. Sie bleiben, bis du sie selbst löschst (z. B. über „Fortschritt zurücksetzen" oder Löschen der Browserdaten) oder aktiv teilst.</p>
       <p><strong>Wenn du sie teilst:</strong> Über den Lehrkraft-Bereich kannst du deinen Fortschritt als Code exportieren. Das passiert nur, wenn du selbst auf „Fortschritt exportieren" tippst und den Code z. B. weitergibst – die App selbst verschickt nichts von sich aus.</p>
       <p><strong>Technischer Hinweis:</strong> Für Schriftarten (Google Fonts) und den Bild-Export (html2canvas) lädt die App Ressourcen von externen Anbietern. Dabei können – wie bei den meisten Webseiten – technische Angaben wie deine IP-Adresse an diese Anbieter übertragen werden. Deine Antworten, dein Name oder dein Fortschritt werden dabei nicht übertragen.</p>`,
     en:`<p>This app runs entirely in your browser – there is no server that receives your input.</p>
       <p><strong>What is stored:</strong> Your name, class, answers, points and progress are stored only locally on this device (in your browser's "localStorage").</p>
       <p><strong>What does NOT happen:</strong> This data is not automatically sent to any server, to the school, or to third parties. It stays until you delete it yourself (e.g. via "Reset progress" or clearing browser data) or actively share it.</p>
       <p><strong>If you share it:</strong> The teacher area lets you export your progress as a code. That only happens when you tap "Export progress" yourself and pass the code on – the app itself never sends anything on its own.</p>
       <p><strong>Technical note:</strong> For fonts (Google Fonts) and the image export (html2canvas), the app loads resources from external providers. As with most websites, technical details such as your IP address may be transmitted to these providers. Your answers, name or progress are not transmitted in this process.</p>`})}</div>
   <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);}
function openTeacher(){if(STATE.teacher)return teacherPanel();
  modal(`<h3>${t('teacherTitle')}</h3><p>${t('teacherLead')}</p><input class="field" id="tcode" type="password" placeholder="${t('codePh')}">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button><button class="btn" id="tUnlock">${t('unlock')}</button></div>`);
  document.getElementById('tUnlock').onclick=()=>{if(document.getElementById('tcode').value.trim()===TEACHER_CODE){STATE.teacher=true;save();teacherPanel();toast(t('unlockAll'));}else toast(L()==='de'?'Code falsch':'Wrong code');};}
function teacherPanel(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(STATE))));
  modal(`<h3>${t('teacherTitle')} 🔑</h3><p>${L()==='de'?'Alle Jahrgänge sind freigeschaltet.':'All grades unlocked.'}</p>
    <div class="t-row"><button class="btn sm" onclick="go('dashboard');closeModal()">📊 ${t('overview')}</button><button class="btn sm ghost" id="expBtn">⬇️ ${t('exportProg')}</button></div>
    <div class="codebox">${code}</div><input class="field" id="impCode" placeholder="${t('pastePh')}">
    <div class="t-row"><button class="btn sm" onclick="importProg()">⬆️ ${t('importProg')}</button>
      <button class="btn sm ghost" onclick="resetProg()" style="border-color:var(--bad);color:var(--bad)">🗑️ ${t('resetProg')}</button></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);
  document.getElementById('expBtn').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast(L()==='de'?'Code kopiert':'Code copied'),()=>{});};}
function importProg(){try{const v=document.getElementById('impCode').value.trim();if(!v)return;const data=JSON.parse(decodeURIComponent(escape(atob(v))));STATE=Object.assign({},DEFAULT_STATE,data);save();closeModal();updateChrome();go('grades');toast(L()==='de'?'Fortschritt geladen':'Progress loaded');}catch(e){toast(L()==='de'?'Code ungültig':'Invalid code');}}
function resetProg(){if(!confirm(t('resetConfirm')))return;STATE=JSON.parse(JSON.stringify(DEFAULT_STATE));save();closeModal();updateChrome();go('landing');}
/* ===== 12) Sprache + Toast + Init ===== */
function setLang(l){STATE.lang=l;save();updateChrome();rerender();}
function rerender(){const v=view();
  if(RUN&&document.querySelector('.runner'))drawTask();
  else if(document.querySelector('.cert-wrap'))renderCert(CURRENT.grade);
  else if(v.querySelector('.hero'))renderLanding();
  else if(v.querySelector('.grades'))renderGrades();
  else if(v.querySelector('.modlist'))renderOverview(CURRENT.grade);
  else if(v.querySelector('.dash-grid'))renderDashboard();
  else if(v.querySelector('.errlist'))renderErrors();
  else renderGrades();updateChrome();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
(function init(){updateChrome();if(STATE.name)go('grades');else renderLanding();})();
</script>
