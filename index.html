 K07:[
  {id:'K07-M1',icon:'🔄',komp:'V',niveau:'II',title:{de:'Auffrischung Klasse 6',en:'Refresher Grade 6'},tasks:[
    {type:'quiz',q:{de:'Warum erkennt eine KI manche Dinge schlecht?',en:'Why does an AI recognise some things poorly?'},
     options:[{de:'Ihre Trainingsbeispiele waren einseitig',en:'Its training examples were one-sided'},
              {de:'Der Computer dahinter ist nicht schnell genug',en:'The computer behind it is not fast enough'},{de:'Sie ist noch neu und existiert noch nicht lange',en:'It is still new and has not existed for long'}],
     correct:0,explain:{de:'Einseitige Beispiele → einseitige KI. Es liegt nicht an der Rechenleistung oder daran, wie neu die KI ist.',en:'One-sided examples → one-sided AI. It is not about computing power or how new the AI is.'}},
    {type:'quiz',q:{de:'Was macht einen guten Prompt aus?',en:'What makes a good prompt?'},
     options:[{de:'Klar, konkret und mit Kontext',en:'Clear, specific and with context'},
              {de:'So kurz wie möglich, egal wie unklar',en:'As short as possible, no matter how unclear'},
              {de:'Möglichst viele schwierige Wörter',en:'As many difficult words as possible'}],
     correct:0,explain:{de:'Klarheit und Kontext schlagen Kürze um jeden Preis.',en:'Clarity and context beat shortness at all cost.'}}
  ]},
  {id:'K07-M2',icon:'⚖️',komp:'R',niveau:'II',title:{de:'Bias & Fairness',en:'Bias & fairness'},tasks:[
    {type:'info',title:{de:'Wenn KI unfair wird',en:'When AI becomes unfair'},
     body:{de:'<p>KI lernt aus Daten aus der echten Welt. Sind die Daten <strong>einseitig</strong>, übernimmt die KI diese Einseitigkeit – das nennt man <strong>Bias</strong>.</p><p>Beispiel: Eine Gesichtserkennung funktioniert schlechter bei Gruppen, die in den Trainingsdaten kaum vorkamen. Das kann <strong>unfaire Folgen</strong> haben.</p>',
           en:'<p>AI learns from real-world data. If the data is <strong>one-sided</strong>, the AI adopts that bias – this is called <strong>bias</strong>.</p><p>Example: face recognition works worse for groups barely present in the training data. This can have <strong>unfair consequences</strong>.</p>'}},
    {type:'quiz',q:{de:'Woher kommt Bias in einer KI vor allem?',en:'Where does bias in an AI mainly come from?'},
     options:[{de:'Aus einseitigen Trainingsdaten und Entscheidungen von Menschen',en:'From one-sided training data and human decisions'},
              {de:'Daraus, dass KI selbst Meinungen hat',en:'From AI having opinions of its own'},
              {de:'Aus zu schnellem Internet',en:'From internet that is too fast'}],
     correct:0,explain:{de:'Bias steckt in den Daten und im Design – nicht in „Meinungen" der KI und auch nicht an der Geschwindigkeit des Internets.',en:'Bias sits in the data and design – not in AI "opinions", and not in how fast the internet is.'}},
    {type:'quiz',q:{de:'Eine Bewerbungs-KI bevorzugt Männer, weil sie aus alten Daten lernte. Das ist …',en:'A hiring AI favours men because it learned from old data. That is …'},
     options:[{de:'… ein Bias mit unfairen Folgen für eine Gruppe',en:'… a bias with unfair consequences for a group'},
              {de:'… reiner Zufall ohne Bedeutung',en:'… pure chance without meaning'},
              {de:'… ein Zeichen, dass die KI klug ist',en:'… a sign the AI is clever'}],
     correct:0,explain:{de:'Alte, einseitige Daten führen zu unfairer Behandlung – ein klassischer Bias.',en:'Old, one-sided data leads to unfair treatment – a classic bias.'}},
    {type:'reflect',q:{de:'Wo könnte unfaire KI im Alltag Probleme machen? Nenne ein Beispiel.',en:'Where could unfair AI cause problems in daily life? Name one example.'},
     placeholder:{de:'z. B. Empfehlungen, Bewerbungen, Erkennung …',en:'e.g. recommendations, job applications, recognition …'}}
  ]},
  {id:'K07-M3',icon:'🕵️',komp:'R',niveau:'II',title:{de:'Halluzinationen & Desinformation',en:'Hallucinations & disinformation'},tasks:[
    {type:'info',title:{de:'Wenn KI etwas erfindet',en:'When AI makes things up'},
     body:{de:'<p>Eine <strong>Halluzination</strong> ist eine erfundene KI-Antwort, die echt klingt. Dazu kommt <strong>Desinformation</strong>: absichtlich falsche Inhalte, z. B. <strong>Deepfakes</strong>.</p><p>Schutz: gegen <strong>vertrauenswürdige Quellen</strong> prüfen. Und: selbst <strong>keine</strong> Fälschungen erstellen, die anderen schaden.</p>',
           en:'<p>A <strong>hallucination</strong> is a made-up AI answer that sounds real. On top of that: <strong>disinformation</strong> – deliberately false content, e.g. <strong>deepfakes</strong>.</p><p>Protection: check against <strong>trusted sources</strong>. And: do not create fakes yourself that harm others.</p>'}},
    {type:'quiz',q:{de:'Was ist eine „Halluzination" bei KI?',en:'What is an AI "hallucination"?'},
     options:[{de:'Eine erfundene Antwort, die echt klingt',en:'A made-up answer that sounds real'},
              {de:'Ein Bild, das flackert',en:'An image that flickers'},{de:'Ein Computervirus',en:'A computer virus'}],
     correct:0,explain:{de:'Klingt überzeugend, ist aber frei erfunden – deshalb prüfen.',en:'Sounds convincing but is invented – so check.'}},
    {type:'quiz',q:{de:'Wie prüfst du eine überraschende KI-Behauptung am besten?',en:'How do you best check a surprising AI claim?'},
     options:[{de:'Gegen mehrere vertrauenswürdige Quellen abgleichen',en:'Cross-check against several trusted sources'},
              {de:'Die KI nochmal genau dasselbe fragen',en:'Ask the AI the exact same thing again'},
              {de:'Glauben, weil es sicher klingt',en:'Believe it because it sounds confident'}],
     correct:0,explain:{de:'Mehrere unabhängige Quellen schlagen eine selbstsichere KI-Stimme.',en:'Several independent sources beat a confident AI voice.'}},
    {type:'quiz',q:{de:'Ein Freund will mit KI ein gefälschtes Video einer Mitschülerin machen. Richtig ist:',en:'A friend wants to make a fake video of a classmate with AI. The right move is:'},
     options:[{de:'Nicht mitmachen – das schadet ihr und ist nicht okay',en:'Do not join – it harms her and is not okay'},
              {de:'Mitmachen, ist ja nur Spaß',en:'Join in, it is just fun'},{de:'Heimlich teilen',en:'Share it secretly'}],
     correct:0,explain:{de:'Deepfakes von echten Personen können verletzen – das macht man nicht.',en:'Deepfakes of real people can hurt – you do not do that.'}}
  ]},
  {id:'K07-M4',icon:'🎨',komp:'A',niveau:'II',title:{de:'Mit KI gestalten & Quellen',en:'Creating with AI & sources'},tasks:[
    {type:'info',title:{de:'KI als Ideen-Partner – ehrlich bleiben',en:'AI as an idea partner – stay honest'},
     body:{de:'<p>KI kann beim <strong>Ideen sammeln</strong> helfen. Gut ist: <strong>erst selbst denken</strong>, dann mit KI vergleichen.</p><p>Wenn du KI nutzt, <strong>kennzeichne es ehrlich</strong> – z. B.: <em>„Erstellt mit Hilfe von [KI-Tool]. Prompt: …"</em></p>',
           en:'<p>AI can help <strong>brainstorm</strong>. Best practice: <strong>think for yourself first</strong>, then compare with AI.</p><p>If you use AI, <strong>label it honestly</strong> – e.g.: <em>"Created with help of [AI tool]. Prompt: …"</em></p>'}},
    {type:'info',title:{de:'Probier\'s selbst: AutoDraw',en:'Try it yourself: AutoDraw'},
     body:{de:'<p>Öffne <a href="https://www.autodraw.com/" target="_blank" rel="noopener">autodraw.com ↗</a> und skizziere etwas Krakeliges (z. B. eine Katze oder ein Haus). Die KI schlägt dir passende, saubere Zeichnungen vor – du wählst aus und arbeitest weiter. Genau das ist <strong>kreative Zusammenarbeit</strong> zwischen Mensch und KI: Die Idee bleibt deine, die KI hilft bei der Umsetzung.</p>',
           en:'<p>Open <a href="https://www.autodraw.com/" target="_blank" rel="noopener">autodraw.com ↗</a> and sketch something rough (e.g. a cat or a house). The AI suggests matching, clean drawings – you pick one and keep working. That is exactly <strong>creative collaboration</strong> between human and AI: the idea stays yours, the AI helps with execution.</p>'}},
    {type:'reflect',q:{de:'Passten die KI-Vorschläge zu deiner Skizze? Wenn du ein AutoDraw-Bild für ein Schulplakat nutzt – wie würdest du das ehrlich kennzeichnen?',en:'Did the AI suggestions match your sketch? If you used an AutoDraw image for a school poster – how would you label that honestly?'},
     placeholder:{de:'Passend? … / Kennzeichnung: „Erstellt mit …"',en:'Matching? … / Labelling: "Created with …"'}},
    {type:'quiz',q:{de:'Du sammelst Ideen für ein Plakat. Wie nutzt du KI sinnvoll?',en:'You brainstorm ideas for a poster. How do you use AI well?'},
     options:[{de:'Erst eigene Ideen, dann mit KI-Vorschlägen vergleichen',en:'Own ideas first, then compare with AI suggestions'},
              {de:'Nur die KI machen lassen, ohne eigenes Denken',en:'Let the AI do it all, no own thinking'},
              {de:'KI nutzen und so tun, als wäre alles von mir',en:'Use AI and pretend it was all me'}],
     correct:0,explain:{de:'Eigenes Denken zuerst, KI als Partner, ehrlich kennzeichnen.',en:'Own thinking first, AI as partner, label honestly.'}},
    {type:'quiz',q:{de:'Du hast ein KI-Bild für dein Referat benutzt. Was ist fair?',en:'You used an AI image for your talk. What is fair?'},
     options:[{de:'KI-Einsatz kennzeichnen',en:'Mark that AI was used'},
              {de:'So tun, als hättest du es selbst gemalt',en:'Pretend you painted it yourself'},
              {de:'Behaupten, es sei ein Foto',en:'Claim it is a photo'}],
     correct:0,explain:{de:'Ehrliche Kennzeichnung schützt dich und ist fair gegenüber anderen.',en:'Honest labelling protects you and is fair to others.'}},
    {type:'match',q:{de:'Ordne zu: Was gehört zur ehrlichen KI-Nutzung?',en:'Match: what belongs to honest AI use?'},
     pairs:[{left:{de:'Kennzeichnen',en:'Label'},right:{de:'angeben, welches Tool & welcher Prompt',en:'state which tool & prompt'}},
            {left:{de:'Prüfen',en:'Check'},right:{de:'Inhalte gegen Quellen abgleichen',en:'cross-check content with sources'}},
            {left:{de:'Eigenleistung',en:'Own work'},right:{de:'erst selbst denken, dann KI nutzen',en:'think first, then use AI'}}]}
  ]},
  {id:'K07-M5',icon:'🔍',komp:'V',niveau:'II',title:{de:'KI erkennen: Google-Suche & KI-Übersicht',en:'Spotting AI: Google Search & AI Overview'},tasks:[
    {type:'info',title:{de:'Ist die Google-Suche schon KI?',en:'Is Google Search already AI?'},
     body:{de:'<p>Viele denken: „Google-Suche zeigt mir Webseiten." Das stimmt – aber seit 2024 steht bei vielen Suchen zusätzlich ganz oben eine <strong>KI-Übersicht</strong> (AI Overview): ein von Googles KI-Modell <strong>Gemini</strong> geschriebener Text, der mehrere Quellen zusammenfasst.</p><p>Der wichtige Unterschied: Ein <strong>klassischer Suchtreffer</strong> ist eine echte Webseite mit Autor:in, die du besuchen und prüfen kannst. Die <strong>KI-Übersicht</strong> ist neu von der KI geschriebener Text – ohne einzelne Autor:in, manchmal aus schlechten Quellen zusammengebaut.</p>',
           en:'<p>Many people think: "Google Search shows me websites." That is true – but since 2024, many searches also show an <strong>AI Overview</strong> right at the top: text written by Google\'s AI model <strong>Gemini</strong>, summarising several sources.</p><p>The key difference: a <strong>classic search result</strong> is a real webpage with an author you can visit and check. The <strong>AI Overview</strong> is freshly written by the AI – with no single author, sometimes built from bad sources.</p>'}},
    {type:'info',title:{de:'Wenn die KI-Übersicht danebenliegt',en:'When the AI Overview gets it wrong'},
     body:{de:'<p>Kurz nach dem Start der KI-Übersichten im Mai 2024 gingen mehrere falsche Antworten viral: Auf die Frage, wie Käse besser auf Pizza haftet, empfahl die KI-Übersicht, <strong>Klebstoff</strong> in die Soße zu mischen – die Quelle war ein alter Scherz-Kommentar auf Reddit. Bei einer anderen Suche riet sie, täglich <strong>einen Stein zu essen</strong> – die Quelle war ein satirischer Artikel von The Onion. Google musste die Funktion danach nachbessern.</p><p>Lehre: Die KI-Übersicht kann eine schlechte oder scherzhafte Quelle für bare Münze nehmen.</p>',
           en:'<p>Shortly after AI Overviews launched in May 2024, several wrong answers went viral: asked how to get cheese to stick to pizza better, the AI Overview recommended mixing <strong>glue</strong> into the sauce – the source was an old joke comment on Reddit. In another search it advised eating <strong>one rock a day</strong> – the source was a satirical article from The Onion. Google had to fix the feature afterwards.</p><p>Lesson: the AI Overview can take a bad or joking source at face value.</p>'}},
    {type:'info',title:{de:'Jetzt du: Finde die Antwort selbst',en:'Now you: find the answer yourself'},
     body:{de:'<p>Google die Frage: <em>„Welches Land hat weltweit die meisten Einwohner?"</em> Schau dir die KI-Übersicht (falls vorhanden) oder die oberste Antwort genau an.</p>',
           en:'<p>Google this question: <em>"Which country has the most inhabitants in the world?"</em> Look closely at the AI Overview (if there is one) or the top answer.</p>'}},
    {type:'reflect',q:{de:'Was hat die KI-Übersicht bzw. die oberste Antwort bei dir angezeigt? Schreib die Kernaussage in 1–2 Sätzen auf.',en:'What did the AI Overview or top answer show you? Write the key claim in 1–2 sentences.'},
     placeholder:{de:'Die KI-Übersicht/oberste Antwort sagte: …',en:'The AI Overview/top answer said: …'}},
    {type:'info',title:{de:'Jetzt eine unabhängige Quelle finden',en:'Now find an independent source'},
     body:{de:'<p>Suche gezielt nach einer <strong>zweiten, unabhängigen Quelle</strong> für dieselbe Frage – z. B. die <strong>UN-Bevölkerungsabteilung</strong> oder eine Enzyklopädie, nicht nochmal die KI-Übersicht selbst.</p>',
           en:'<p>Search specifically for a <strong>second, independent source</strong> for the same question – e.g. the <strong>UN Population Division</strong> or an encyclopedia, not the AI Overview again.</p>'}},
    {type:'reflect',q:{de:'Welche Quelle hast du gefunden (Name)? Bestätigt sie die KI-Übersicht – oder gibt es einen Unterschied?',en:'Which source did you find (name)? Does it confirm the AI Overview – or is there a difference?'},
     placeholder:{de:'Meine Quelle: … / Bestätigt / Unterschied, weil …',en:'My source: … / Confirms / Differs, because …'},prod:true},
    {type:'quiz',q:{de:'Was ist der wichtigste Unterschied zwischen einer klassischen Trefferliste und einer KI-Übersicht?',en:'What is the key difference between a classic results list and an AI Overview?'},
     options:[{de:'Die KI-Übersicht ist von KI geschriebener Text ohne einzelne, prüfbare Autor:in – Treffer sind echte Webseiten, die du einzeln prüfen kannst',en:'The AI Overview is AI-written text with no single, checkable author – results are real webpages you can check individually'},
              {de:'Es gibt keinen Unterschied, beides ist identisch',en:'There is no difference, both are identical'},
              {de:'Die KI-Übersicht ist immer aktueller und richtiger als jede Webseite',en:'The AI Overview is always more current and correct than any webpage'}],
     correct:0,explain:{de:'Die KI-Übersicht fasst zusammen, nennt aber keine einzelne, verantwortliche Autor:in wie ein Artikel – deshalb bleibt Prüfen gegen unabhängige Quellen wichtig.',en:'The AI Overview summarises but names no single, accountable author like an article does – so checking against independent sources stays important.'}},
    {type:'quiz',q:{de:'Stimmt die Aussage: „Gemini ist einfach nur ein anderer Name für Google"?',en:'Is this true: "Gemini is just another name for Google"?'},
     options:[{de:'Nein – Gemini ist Googles KI-Modell, das u. a. die KI-Übersicht erzeugt, aber auch als eigener Chat-Assistent existiert',en:'No – Gemini is Google\'s AI model, which powers the AI Overview among other things, but also exists as its own chat assistant'},
              {de:'Ja, das ist komplett dasselbe',en:'Yes, that is exactly the same thing'},
              {de:'Nein, Gemini hat mit Google gar nichts zu tun',en:'No, Gemini has nothing to do with Google at all'}],
     correct:0,explain:{de:'Google ist die Suchmaschine/Firma, Gemini ist das KI-Modell dahinter – es taucht in der Suche UND als eigener Assistent auf.',en:'Google is the search engine/company, Gemini is the AI model behind it – it shows up in Search AND as its own assistant.'}}
  ]}
 ],
 K08:[
  {id:'K08-M1',icon:'🔄',komp:'V',niveau:'II',title:{de:'Auffrischung Klasse 7',en:'Refresher Grade 7'},tasks:[
    {type:'quiz',q:{de:'Was ist Bias bei KI?',en:'What is bias in AI?'},
     options:[{de:'Eine systematische Einseitigkeit aus Daten oder Design',en:'A systematic one-sidedness from data or design'},
              {de:'Ein technischer Defekt am Bildschirm',en:'A technical screen defect'},{de:'Eine Meinung der KI',en:'An opinion of the AI'}],
     correct:0,explain:{de:'Bias = systematische Einseitigkeit, meist aus den Daten.',en:'Bias = systematic one-sidedness, mostly from the data.'}},
    {type:'quiz',q:{de:'Wie nutzt du KI ehrlich beim Gestalten?',en:'How do you use AI honestly when creating?'},
     options:[{de:'Einsatz kennzeichnen und prüfen',en:'Label the use and check'},
              {de:'Als komplett eigene Arbeit ausgeben',en:'Pass it off as fully my own work'},{de:'Quellen verschweigen',en:'Hide the sources'}],
     correct:0,explain:{de:'Kennzeichnen + prüfen = ehrliche Nutzung.',en:'Label + check = honest use.'}}
  ]},
  {id:'K08-M7',icon:'🎯',komp:'A',niveau:'III',title:{de:'Prompt Engineering mit CRAFT',en:'Prompt engineering with CRAFT'},tasks:[
    {type:'info',title:{de:'Das CRAFT-Framework',en:'The CRAFT framework'},
     body:{de:'<p>In Klasse 6 hast du schon gelernt: klar und mit Kontext prompten wirkt besser. <strong>CRAFT</strong> gibt dir dafür fünf konkrete Stellschrauben:</p>'+
       '<div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">C</span><div><strong>Context</strong> – gib zusätzliche Hintergrundinfos, damit die KI versteht, worum es geht.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">R</span><div><strong>Role</strong> – weise der KI eine Rolle zu, für eine passendere Antwort.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">A</span><div><strong>Audience</strong> – nenne das Zielpublikum, damit Niveau und Ton passen.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">F</span><div><strong>Format</strong> – sag, in welcher Form die Antwort kommen soll (Liste, Tabelle, kurzer Text …).</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">T</span><div><strong>Task</strong> – gib eine klare Aufgabe mit Aktionswort (z. B. „vergleiche", „fasse zusammen").</div></div>'+
       '</div><p style="margin-top:12px;font-size:12px;color:var(--muted)">CRAFT-Framework nach Vera Cubero, übersetzt/gekürzt von <a href="https://joschafalck.de/prompting-verstehen/" target="_blank" rel="noopener">Joscha Falck</a> · Lizenz CC BY-NC-SA 4.0.</p>',
           en:'<p>In Grade 6 you already learned: clear prompts with context work better. <strong>CRAFT</strong> gives you five concrete levers for that:</p>'+
       '<div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">C</span><div><strong>Context</strong> – give extra background so the AI understands what it is about.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">R</span><div><strong>Role</strong> – assign the AI a role for a more fitting answer.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">A</span><div><strong>Audience</strong> – name the target audience so level and tone fit.</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">F</span><div><strong>Format</strong> – say what form the answer should take (list, table, short text …).</div></div>'+
       '<div style="display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff"><span style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--k08);flex:none;width:30px">T</span><div><strong>Task</strong> – give a clear task with an action verb (e.g. "compare", "summarise").</div></div>'+
       '</div><p style="margin-top:12px;font-size:12px;color:var(--muted)">CRAFT framework by Vera Cubero, translated/shortened by <a href="https://joschafalck.de/prompting-verstehen/" target="_blank" rel="noopener">Joscha Falck</a> · Licence CC BY-NC-SA 4.0.</p>'}},
    {type:'quiz',q:{de:'Warum hilft es, der KI beim Prompten eine Rolle zuzuweisen (R in CRAFT)?',en:'Why does it help to assign the AI a role when prompting (R in CRAFT)?'},
     options:[{de:'Sie passt Fachlichkeit und Perspektive der Antwort an diese Rolle an',en:'It adapts the expertise and perspective of the answer to that role'},
              {de:'Sie wird dadurch automatisch schneller',en:'It automatically becomes faster because of it'},
              {de:'Ohne Rollenangabe antwortet sie gar nicht',en:'Without a role it will not answer at all'}],
     correct:0,explain:{de:'Eine Rolle lenkt Blickwinkel und Sprachstil der Antwort – schneller wird die KI dadurch nicht, und auch ohne Rolle antwortet sie.',en:'A role steers the perspective and language style of the answer – it does not make the AI faster, and it still answers without one.'}},
    {type:'match',q:{de:'Ordne jeden Buchstaben von CRAFT seiner Bedeutung zu.',en:'Match each letter of CRAFT to its meaning.'},
     pairs:[{left:{de:'C',en:'C'},right:{de:'zusätzliche Hintergrundinfos geben',en:'giving extra background information'}},
            {left:{de:'R',en:'R'},right:{de:'der KI eine Rolle zuweisen',en:'assigning the AI a role'}},
            {left:{de:'A',en:'A'},right:{de:'das Zielpublikum angeben',en:'naming the target audience'}},
            {left:{de:'F',en:'F'},right:{de:'das gewünschte Format nennen',en:'stating the desired format'}},
            {left:{de:'T',en:'T'},right:{de:'eine klare Aufgabe mit Aktionswort stellen',en:'giving a clear task with an action verb'}}]},
    {type:'info',title:{de:'Ein schlechter Prompt – und warum',en:'A bad prompt – and why'},
     body:{de:'<p>Schau dir diesen Prompt an: <em>„Schreib was über den Klimawandel."</em></p><p>Das Problem: <strong>kein Kontext</strong> (welcher Aspekt?), <strong>keine Rolle</strong> (aus wessen Sicht?), <strong>kein Publikum</strong> (für wen?), <strong>kein Format</strong> (wie lang, welche Form?) und <strong>keine klare Aufgabe</strong> (nur „schreib was" statt eines echten Aktionsworts).</p><p>Genau hier hilft CRAFT.</p>',
           en:'<p>Look at this prompt: <em>"Write something about climate change."</em></p><p>The problem: <strong>no context</strong> (which aspect?), <strong>no role</strong> (from whose perspective?), <strong>no audience</strong> (for whom?), <strong>no format</strong> (how long, what form?) and <strong>no clear task</strong> (just "write something" instead of a real action verb).</p><p>This is exactly where CRAFT helps.</p>'}},
    {type:'reflect',q:{de:'Verbessere den Prompt „Schreib was über den Klimawandel." mit CRAFT. Trage für jeden Buchstaben eine Idee ein und formuliere daraus deinen vollständigen neuen Prompt.',en:'Improve the prompt "Write something about climate change." using CRAFT. Fill in an idea for each letter, then write your complete new prompt.'},
     placeholder:{de:'C (Kontext): … / R (Rolle): … / A (Publikum): … / F (Format): … / T (Aufgabe): … / Mein neuer Prompt: …',en:'C (Context): … / R (Role): … / A (Audience): … / F (Format): … / T (Task): … / My new prompt: …'},prod:true},
    {type:'promptcheck',q:{de:'Prompt-Check: Teste deinen neuen Prompt',en:'Prompt check: test your new prompt'},
     body:{de:'<p>Kopiere deinen neuen Prompt aus der letzten Aufgabe hier hinein (oder schreib ihn neu). Der Check sucht <strong>lokal, ohne KI</strong> nach typischen Signalwörtern für die 5 CRAFT-Buchstaben.</p>',
           en:'<p>Paste your new prompt from the last task in here (or write it fresh). The check looks <strong>locally, without AI,</strong> for typical signal words for the 5 CRAFT letters.</p>'},
     placeholder:{de:'Dein CRAFT-Prompt …',en:'Your CRAFT prompt …'}},
    {type:'info',title:{de:'Jetzt live testen',en:'Now test it live'},
     body:{de:'<p>Gib deinen CRAFT-Prompt bei <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> ein. Probiere danach zum Vergleich den ursprünglichen, schlechten Prompt „Schreib was über den Klimawandel." aus.</p>',
           en:'<p>Enter your CRAFT prompt at <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>. For comparison, then also try the original, bad prompt "Write something about climate change."</p>'}},
    {type:'reflect',q:{de:'Was war der wichtigste Unterschied zwischen den beiden Antworten? War dein CRAFT-Prompt wirklich hilfreicher – oder überraschend nicht?',en:'What was the biggest difference between the two answers? Was your CRAFT prompt really more helpful – or surprisingly not?'},
     placeholder:{de:'Antwort auf CRAFT-Prompt: … / Antwort auf schlechten Prompt: … / Unterschied: …',en:'Answer to CRAFT prompt: … / Answer to bad prompt: … / Difference: …'},prod:true}
  ]},
  {id:'K08-M2',icon:'🧩',komp:'A',niveau:'II→III',title:{de:'Aufgaben teilen: Mensch oder KI?',en:'Dividing tasks: human or AI?'},tasks:[
    {type:'info',title:{de:'Klug aufteilen',en:'Divide wisely'},
     body:{de:'<p>Eine große Aufgabe besteht aus Schritten. Frage bei jedem Schritt: <strong>Was kann KI gut – und wo braucht es meine eigene Stimme und mein Urteil?</strong></p><p>Beispiel Aufsatz: KI kann beim <em>Brainstorming</em> helfen, aber <strong>Meinung, Argumente und Schreibstil</strong> bleiben bei dir.</p>',
           en:'<p>A big task has steps. For each step ask: <strong>What is AI good at – and where do I need my own voice and judgement?</strong></p><p>Essay example: AI can help <em>brainstorm</em>, but <strong>opinion, arguments and style</strong> stay with you.</p>'}},
    {type:'sort',q:{de:'Aufsatz schreiben: eher KI oder eher du selbst?',en:'Writing an essay: more AI or more you?'},
     buckets:[{de:'KI kann unterstützen',en:'AI can support'},{de:'lieber selbst',en:'better yourself'}],
     items:[{text:{de:'erste Ideen sammeln',en:'gathering first ideas'},bucket:0},
            {text:{de:'deine eigene Meinung formulieren',en:'forming your own opinion'},bucket:1},
            {text:{de:'Rechtschreibung gegenlesen',en:'proofreading spelling'},bucket:0},
            {text:{de:'die Hauptargumente auswählen',en:'choosing the main arguments'},bucket:1}]},
    {type:'quiz',q:{de:'Wofür sollte beim Aufsatz deine eigene Stimme entscheiden?',en:'What in the essay should your own voice decide?'},
     options:[{de:'Meinung, Argumente und Schreibstil',en:'Opinion, arguments and writing style'},
              {de:'Nur die Schriftgröße',en:'Only the font size'},{de:'Gar nichts, das macht alles die KI',en:'Nothing, the AI does it all'}],
     correct:0,explain:{de:'Das Denken bleibt bei dir – KI hilft nur an passenden Stellen.',en:'The thinking stays yours – AI only helps where it fits.'},prod:true},
    {type:'info',title:{de:'Jetzt du: Aufgabe teilen mit Gemini',en:'Now you: dividing the task with Gemini'},
     body:{de:'<p>Wähle ein Thema, zu dem du bald etwas schreiben musst (oder erfinde eins, z. B. „Sollten Handys in der Schule erlaubt sein?"). Öffne <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> mit deinem GSIS-Account und lass dir <strong>5 Ideen</strong> dazu vorschlagen.</p>',
           en:'<p>Pick a topic you will soon write about (or invent one, e.g. "Should phones be allowed in school?"). Open <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> with your GSIS account and have it suggest <strong>5 ideas</strong> on it.</p>'}},
    {type:'reflect',q:{de:'Welche der 5 KI-Ideen behältst du, welche verwirfst du – und warum? Was hast du selbst ergänzt, das die KI nicht vorgeschlagen hat?',en:'Which of the 5 AI ideas do you keep, which do you discard – and why? What did you add yourself that the AI did not suggest?'},
     placeholder:{de:'Behalten: … / Verworfen: … weil … / Eigene Ergänzung: …',en:'Kept: … / Discarded: … because … / My own addition: …'},prod:true}
  ]},
  {id:'K08-M3',icon:'🤝',komp:'A',niveau:'III',title:{de:'Mit KI ko-konstruieren',en:'Co-creating with AI'},tasks:[
    {type:'info',title:{de:'In Schleifen besser werden',en:'Improving in loops'},
     body:{de:'<p>Gute KI-Nutzung ist ein <strong>Hin und Her</strong>: Idee → KI-Feedback → du entscheidest, was du übernimmst → verbessern.</p><p>Halte fest, <strong>was von der KI kam</strong> und was dein eigenes Denken war.</p>',
           en:'<p>Good AI use is a <strong>back and forth</strong>: idea → AI feedback → you decide what to keep → improve.</p><p>Track <strong>what came from the AI</strong> and what was your own thinking.</p>'}},
    {type:'quiz',q:{de:'Was beschreibt „ko-konstruieren" mit KI am besten?',en:'What best describes "co-creating" with AI?'},
     options:[{de:'Abwechselnd: ich, KI-Feedback, ich entscheide, verbessern',en:'Taking turns: me, AI feedback, I decide, improve'},
              {de:'Die KI macht alles, ich schaue zu',en:'The AI does everything, I watch'},{de:'Ich ignoriere jedes Feedback',en:'I ignore all feedback'}],
     correct:0,explain:{de:'Ko-konstruieren = gemeinsames Verbessern, du behältst die Kontrolle.',en:'Co-creating = improving together, you stay in control.'}},
    {type:'quiz',q:{de:'Warum solltest du markieren, was von der KI stammt?',en:'Why should you mark what came from the AI?'},
     options:[{de:'Ehrlichkeit und um die eigene Leistung zu erkennen',en:'Honesty and to recognise your own contribution'},
              {de:'Damit es schwieriger aussieht',en:'To make it look harder'},{de:'Aus keinem Grund',en:'For no reason'}],
     correct:0,explain:{de:'Transparenz zeigt, was du selbst geleistet hast.',en:'Transparency shows what you achieved yourself.'},prod:true},
    {type:'info',title:{de:'Jetzt du: eine Feedback-Schleife',en:'Now you: a feedback loop'},
     body:{de:'<p>Schreibe zuerst <strong>3–4 eigene Sätze</strong> zu einem Thema deiner Wahl. Gib sie dann bei <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> ein und bitte gezielt um Feedback zu <strong>Aufbau und Verständlichkeit</strong> (nicht um einen neuen Text!). Überarbeite deine Sätze danach selbst.</p>',
           en:'<p>First write <strong>3–4 sentences of your own</strong> on a topic of your choice. Then enter them at <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> and ask specifically for feedback on <strong>structure and clarity</strong> (not for a rewritten text!). Then revise your sentences yourself.</p>'}},
    {type:'reflect',q:{de:'Was hat Gemini konkret vorgeschlagen? Was hast du davon übernommen, was nicht – und warum?',en:'What did Gemini specifically suggest? What did you keep, what not – and why?'},
     placeholder:{de:'Vorschlag der KI: … / Übernommen: … / Nicht übernommen, weil: …',en:'AI suggestion: … / Kept: … / Not kept, because: …'},prod:true}
  ]},
  {id:'K08-M4',icon:'🛡️',komp:'R',niveau:'III',title:{de:'Grenzen, Risiken & Datenschutz',en:'Limits, risks & data protection'},tasks:[
    {type:'info',title:{de:'Sicher und überlegt',en:'Safe and considered'},
     body:{de:'<p>Achte auf: <strong>Datenschutz</strong> (keine privaten Daten von dir oder anderen eingeben), <strong>Urheberrecht</strong>, <strong>Umwelt</strong> und <strong>Überabhängigkeit</strong> – wer alles der KI überlässt, lernt selbst weniger.</p><p>KI ist nie deine <strong>einzige</strong> Quelle.</p>',
           en:'<p>Watch out for: <strong>privacy</strong> (do not enter private data about you or others), <strong>copyright</strong>, <strong>environment</strong> and <strong>overreliance</strong> – relying on AI for everything means learning less yourself.</p><p>AI is never your <strong>only</strong> source.</p>'}},
    {type:'multi',q:{de:'Was solltest du einer KI NICHT geben? (Mehrere)',en:'What should you NOT give an AI? (Several)'},
     options:[{de:'Deine Adresse und Telefonnummer',en:'Your address and phone number'},
              {de:'Passwörter',en:'Passwords'},
              {de:'Private Daten von Mitschüler:innen',en:'Private data of classmates'},
              {de:'Eine allgemeine Frage zum Schulthema',en:'A general question about a school topic'}],
     correct:[0,1,2],explain:{de:'Persönliche/private Daten gehören nicht in die KI – allgemeine Fragen sind okay.',en:'Personal/private data does not belong in AI – general questions are fine.'}},
    {type:'quiz',q:{de:'Was bedeutet „Überabhängigkeit" von KI?',en:'What does "overreliance" on AI mean?'},
     options:[{de:'Alles der KI überlassen und selbst kaum noch nachdenken',en:'Leaving everything to AI and barely thinking yourself'},
              {de:'KI nur einmal pro Woche nutzen',en:'Using AI only once a week'},{de:'KI gar nicht mögen',en:'Disliking AI'}],
     correct:0,explain:{de:'Wer nicht mehr selbst denkt, lernt weniger – das ist das Risiko.',en:'Stopping your own thinking means learning less – that is the risk.'}},
    {type:'info',title:{de:'Jetzt du: Wo Gemini an Grenzen stößt',en:'Now you: where Gemini hits its limits'},
     body:{de:'<p>Zähle zuerst <strong>selbst</strong>, wie oft der Buchstabe <strong>„s"</strong> im Wort <strong>„Verantwortungsbewusstsein"</strong> vorkommt. Frag danach genau das bei <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>.</p>',
           en:'<p>First count <strong>yourself</strong> how often the letter <strong>"s"</strong> appears in the German word <strong>"Verantwortungsbewusstsein"</strong>. Then ask Gemini exactly that at <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>.</p>'}},
    {type:'input',q:{de:'Wie oft kommt „s" in „Verantwortungsbewusstsein" wirklich vor (dein eigenes Nachzählen)?',en:'How often does "s" really appear in "Verantwortungsbewusstsein" (your own count)?'},
     hint:{de:'Zahl',en:'Number'},accept:['4'],
     explain:{de:'Richtig sind 4 „s". KI-Sprachmodelle verarbeiten Text nicht Buchstabe für Buchstabe, sondern in größeren Text-Bausteinen (Tokens) – deshalb verzählen sie sich bei solchen Buchstaben-Zählaufgaben erstaunlich oft, auch wenn sie sonst sehr kompetent wirken. Hat Gemini bei dir auch danebengelegen?',en:'The correct count is 4 "s". AI language models do not process text letter by letter but in larger text chunks (tokens) – which is why they surprisingly often miscount in tasks like this, even though they otherwise seem very competent. Did Gemini also get it wrong for you?'}}
  ]},
  {id:'K08-M5',icon:'✨',komp:'A',niveau:'III',title:{de:'Gemini kennenlernen',en:'Getting to know Gemini'},tasks:[
    {type:'info',title:{de:'Bevor du startest',en:'Before you start'},
     body:{de:'<p>Melde dich bei Gemini für den Unterricht <strong>immer mit deinem GSIS-Schulaccount</strong> an – nicht mit einem privaten Google-Konto.</p><p>Über das Schulprofil (Google Workspace for Education) werden deine Eingaben <strong>nicht zum Training</strong> der KI-Modelle verwendet.</p><p><strong>Trotzdem</strong> gilt weiterhin, was du in Klasse 8 schon gelernt hast: Gib niemals private Daten ein – auch nicht über den Schulaccount.</p>',
           en:'<p>Always log in to Gemini for schoolwork <strong>with your GSIS school account</strong> – not a private Google account.</p><p>Through the school profile (Google Workspace for Education), your input is <strong>not used to train</strong> the AI models.</p><p><strong>Even so</strong>, what you already learned in Grade 8 still applies: never enter private data – not even through the school account.</p>'}},
    {type:'info',title:{de:'Gemini – ab jetzt für dich freigegeben',en:'Gemini – now unlocked for you'},
     body:{de:'<p><strong>Gemini</strong> ist der KI-Assistent von Google. Ab Klasse 8 darfst du ihn an der GSIS für den Unterricht nutzen – deshalb schauen wir uns kurz an, wie er aufgebaut ist.</p>'+
       '<div style="border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-top:12px">'+
       '<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)">'+
       '<span>✨ Gemini</span><span style="margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px">① Modell: Fast ▾</span></div>'+
       '<div style="padding:16px;font-size:13px;color:var(--muted);min-height:36px">④ Antwortbereich – hier erscheint die Antwort von Gemini.</div>'+
       '<div style="display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)">'+
       '<span style="background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px">➕ ② Extras</span>'+
       '<span style="flex:1;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)">③ Frag Gemini etwas …</span></div></div>'+
       '<div style="margin-top:12px;font-size:13.5px;line-height:1.7">'+
       '<p>① <strong>Modell-Auswahl</strong> – Fast, Thinking oder Pro (mehr dazu gleich).</p>'+
       '<p>② <strong>Extras</strong> – z. B. Bild hochladen, Deep Research (recherchiert selbstständig), Canvas (erstellt Dokumente/kleine Programme).</p>'+
       '<p>③ <strong>Eingabefeld</strong> – hier tippst du deinen Prompt.</p>'+
       '<p>④ <strong>Antwortbereich</strong> – die Antwort, die du wie immer prüfen solltest.</p></div>',
       en:'<p><strong>Gemini</strong> is Google\'s AI assistant. From Grade 8 you may use it for schoolwork at GSIS – so let\'s look at how it is laid out.</p>'+
       '<div style="border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-top:12px">'+
       '<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)">'+
       '<span>✨ Gemini</span><span style="margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px">① Model: Fast ▾</span></div>'+
       '<div style="padding:16px;font-size:13px;color:var(--muted);min-height:36px">④ Response area – Gemini\'s answer appears here.</div>'+
       '<div style="display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)">'+
       '<span style="background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px">➕ ② Extras</span>'+
       '<span style="flex:1;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)">③ Ask Gemini something …</span></div></div>'+
       '<div style="margin-top:12px;font-size:13.5px;line-height:1.7">'+
       '<p>① <strong>Model picker</strong> – Fast, Thinking or Pro (more on this next).</p>'+
       '<p>② <strong>Extras</strong> – e.g. uploading an image, Deep Research (researches on its own), Canvas (creates documents/small programs).</p>'+
       '<p>③ <strong>Input field</strong> – this is where you type your prompt.</p>'+
       '<p>④ <strong>Response area</strong> – the answer, which you should always check.</p></div>'}},
    {type:'match',q:{de:'Welches Modell passt zu welcher Aufgabe?',en:'Which model fits which task?'},
     pairs:[{left:{de:'Fast',en:'Fast'},right:{de:'schnelle, einfache Fragen im Alltag',en:'quick, simple everyday questions'}},
            {left:{de:'Thinking',en:'Thinking'},right:{de:'knifflige Logik- oder Rechenaufgaben, bei denen Genauigkeit wichtiger ist als Tempo',en:'tricky logic or maths problems where accuracy matters more than speed'}},
            {left:{de:'Pro',en:'Pro'},right:{de:'ein langes Dokument analysieren oder höchste Genauigkeit gefragt',en:'analysing a long document or when top accuracy is needed'}}]},
    {type:'multi',q:{de:'Wie lässt sich Gemini sinnvoll im Unterricht einsetzen? (Mehrere)',en:'How can Gemini be used sensibly in class? (Several)'},
     options:[{de:'Erste Ideen oder eine Gliederung für eine Arbeit erstellen lassen',en:'Getting first ideas or an outline for a piece of work'},
              {de:'Verständnisfragen zu einem Thema stellen',en:'Asking questions to better understand a topic'},
              {de:'Feedback zu einem eigenen Übungstext einholen',en:'Getting feedback on a practice text you wrote'},
              {de:'Eine komplette bewertete Arbeit schreiben lassen und unverändert abgeben',en:'Having it write a whole graded assignment and submitting it unchanged'}],
     correct:[0,1,2],explain:{de:'Ideen, Verständnisfragen und Feedback unterstützen dein Lernen. Eine ganze bewertete Arbeit unverändert abzugeben, ist keine eigene Leistung mehr.',en:'Ideas, questions and feedback support your learning. Submitting a whole graded assignment unchanged is no longer your own work.'}},
    {type:'info',title:{de:'Wofür darf ich Gemini nutzen?',en:'What am I allowed to use Gemini for?'},
     body:{de:'<p>Das hängt von der jeweiligen Aufgabe ab. GSIS hat dafür eine Skala von <strong>0</strong> (keine KI erlaubt) bis <strong>4</strong> (volle KI-Nutzung unter deiner eigenen Aufsicht und Verantwortung) – deine Lehrkraft sagt dir, welche Stufe für eine Aufgabe gilt.</p><p><a href="https://drive.google.com/file/d/13atktLu0TtHaTjkcqaVewYRJfTfROUvI/view?usp=sharing" target="_blank" rel="noopener">📄 GSIS KI-Ampel öffnen (PDF) ↗</a></p>',
           en:'<p>This depends on the specific task. GSIS uses a scale from <strong>0</strong> (no AI allowed) to <strong>4</strong> (full AI use under your own supervision and responsibility) – your teacher will tell you which level applies to a task.</p><p><a href="https://drive.google.com/file/d/13atktLu0TtHaTjkcqaVewYRJfTfROUvI/view?usp=sharing" target="_blank" rel="noopener">📄 Open the GSIS AI traffic-light scale (PDF) ↗</a></p>'}},
    {type:'reflect',q:{de:'Wähle eine Aufgabe aus deinem aktuellen Unterricht. Schau in der GSIS-KI-Skala nach: Welche Stufe (0–4) passt dazu, und wie dürftest du Gemini dabei einsetzen?',en:'Pick a task from your current lessons. Check the GSIS AI scale: which level (0–4) fits, and how would you be allowed to use Gemini for it?'},
     placeholder:{de:'Aufgabe … / Stufe (0–4) … / erlaubte Nutzung …',en:'Task … / Level (0–4) … / allowed use …'},prod:true},
    {type:'info',title:{de:'Deine erste Gemini-Challenge',en:'Your first Gemini challenge'},
     body:{de:'<p>Jetzt bist du dran! Öffne <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> in einem neuen Tab (mit deinem GSIS-Schulaccount) und gib dort genau diesen Prompt ein:</p>'+
       '<div class="infobox" style="font-style:italic">„Ein Zug fährt um 14:15 Uhr los und kommt nach 2 Stunden 47 Minuten an. Um wie viel Uhr kommt er an? Antworte nur mit der Uhrzeit im Format HH:MM."</div>'+
       '<p style="margin-top:10px">Rechne das Ergebnis am besten kurz selbst nach, bevor du zurückkommst – du weißt ja: KI-Antworten immer prüfen!</p>',
           en:'<p>Now it\'s your turn! Open <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> in a new tab (with your GSIS school account) and enter exactly this prompt there:</p>'+
       '<div class="infobox" style="font-style:italic">"A train leaves at 14:15 and arrives after 2 hours 47 minutes. What time does it arrive? Answer only with the time in HH:MM format."</div>'+
       '<p style="margin-top:10px">Best to quickly work out the answer yourself too before you come back – you know the rule: always check AI answers!</p>'}},
    {type:'input',q:{de:'Welche Uhrzeit hat Gemini ausgegeben (und deine eigene Rechnung ergeben)?',en:'What time did Gemini give you (and what did your own calculation give)?'},
     hint:{de:'Uhrzeit im Format HH:MM',en:'Time in HH:MM format'},accept:['17:02'],
     explain:{de:'14:15 Uhr + 2 Stunden 47 Minuten = 17:02 Uhr. Falls Gemini etwas anderes geliefert hat: gut, dass du nachgerechnet hast!',en:'14:15 + 2 hours 47 minutes = 17:02. If Gemini gave you something different: good that you checked!'}}
  ]},
  {id:'K08-M6',icon:'🚦',komp:'R',niveau:'III',title:{de:'KI im Unterricht: Zulässig oder nicht?',en:'AI in class: allowed or not?'},tasks:[
    {type:'info',title:{de:'Fünf Situationen aus dem Schulalltag',en:'Five situations from everyday school life'},
     body:{de:'<p>Du kennst jetzt die GSIS-KI-Skala (0–4). In der Praxis ist aber nicht immer sofort klar, was erlaubt ist.</p><p>Hier kommen fünf echte Situationen – entscheide jeweils, ob der KI-Einsatz in Ordnung ist, und vor allem: <strong>warum</strong>.</p>',
           en:'<p>You now know the GSIS AI scale (0–4). In practice, though, it is not always immediately clear what is allowed.</p><p>Here come five real situations – decide in each case whether the AI use is okay, and above all: <strong>why</strong>.</p>'}},
    {type:'quiz',q:{de:'Für einen Aufsatz (Stufe 2 laut Lehrkraft erlaubt: „KI-gestützte Bearbeitung") lässt sich Miriam von Gemini ihren bereits fertig geschriebenen Text auf Rechtschreibung und Satzbau prüfen. Sie übernimmt nur sprachliche Korrekturen, keine neuen Inhalte. Ist das zulässig?',en:'For an essay (teacher allows Level 2: "AI-assisted editing"), Miriam has Gemini check her already finished text for spelling and sentence structure. She only applies language corrections, no new content. Is this allowed?'},
     options:[{de:'Ja – sie hat den Text selbst geschrieben, Gemini hilft nur sprachlich. Genau das erlaubt Stufe 2.',en:'Yes – she wrote the text herself, Gemini only helps with language. That is exactly what Level 2 allows.'},
              {de:'Ja, weil Rechtschreibprüfung sowieso nie als KI-Nutzung zählt.',en:'Yes, because spellchecking never counts as AI use anyway.'},
              {de:'Nein, weil sie für eine bewertete Arbeit überhaupt keine KI nutzen darf.',en:'No, because she may not use any AI at all for a graded piece of work.'}],
     correct:0,explain:{de:'Die Lehrkraft hat für diese Aufgabe Stufe 2 erlaubt – sprachliche Verbesserung ohne neue Inhalte ist damit genau im Rahmen.',en:'The teacher allowed Level 2 for this task – language improvement without new content is exactly within that.'}},
    {type:'quiz',q:{de:'Tom lässt sich von Gemini vor einem Referat mehrere mögliche Gliederungen zu seinem selbst gewählten Thema vorschlagen. Er vergleicht sie, entscheidet sich für seine eigene Mischung daraus und schreibt das Referat komplett selbst. Die Aufgabe erlaubt „KI-gestützte Ideenfindung und Strukturierung" (Stufe 1). Ist das zulässig?',en:'Before a presentation, Tom has Gemini suggest several possible outlines for his self-chosen topic. He compares them, picks his own mix of ideas, and writes the presentation entirely himself. The task allows "AI-assisted ideation and structuring" (Level 1). Is this allowed?'},
     options:[{de:'Ja, genau das ist mit Stufe 1 gemeint – Ideen und Struktur ja, der eigentliche Inhalt bleibt seine Leistung.',en:'Yes, that is exactly what Level 1 means – ideas and structure yes, the actual content stays his own work.'},
              {de:'Nein, weil eine von KI vorgeschlagene Gliederung automatisch ein Plagiat ist.',en:'No, because an AI-suggested outline is automatically plagiarism.'},
              {de:'Ja, aber nur, weil er die Vorschläge gar nicht wirklich gelesen hat.',en:'Yes, but only because he did not really read the suggestions.'}],
     correct:0,explain:{de:'Ideen sammeln und Struktur vorschlagen lassen, dann selbst schreiben – das ist der Kern von Stufe 1.',en:'Gathering ideas and getting structure suggestions, then writing it yourself – that is the core of Level 1.'}},
    {type:'quiz',q:{de:'Bei einer unangekündigten Klassenarbeit unter Aufsicht (Stufe 0: keine KI erlaubt) tippt Lukas heimlich eine Frage in Gemini auf seinem Handy und schreibt die Antwort ab. Ist das zulässig?',en:'During an unannounced, supervised class test (Level 0: no AI allowed), Lukas secretly types a question into Gemini on his phone and copies the answer. Is this allowed?'},
     options:[{de:'Nein – bei Stufe 0 ist während der Arbeit gar keine KI-Nutzung erlaubt, das ist ein klarer Verstoß.',en:'No – at Level 0, no AI use at all is allowed during the test, this is a clear violation.'},
              {de:'Ja, solange er die Antwort in eigenen Worten aufschreibt.',en:'Yes, as long as he writes the answer in his own words.'},
              {de:'Nein, aber nur weil er sein Handy benutzt hat, nicht wegen der KI.',en:'No, but only because he used his phone, not because of the AI.'}],
     correct:0,explain:{de:'Bei Stufe 0 zählt: gar keine KI, unabhängig davon, ob man die Antwort umformuliert oder welches Gerät man nutzt.',en:'At Level 0 the rule is: no AI at all, regardless of whether you rephrase the answer or which device you use.'}},
    {type:'quiz',q:{de:'Bea übt zu Hause für einen Mathe-Test. Sie lässt sich von Gemini (Thinking) eine ähnliche Aufgabe Schritt für Schritt vorrechnen, geht die Lösung genau durch, bis sie den Rechenweg versteht – und löst danach mehrere ähnliche Aufgaben ganz allein, ohne KI. Es wird nichts abgegeben oder bewertet. Ist das zulässig?',en:'Bea is practising at home for a maths test. She has Gemini (Thinking) work through a similar problem step by step, studies the solution until she understands the method – then solves several similar problems entirely on her own, without AI. Nothing is submitted or graded. Is this allowed?'},
     options:[{de:'Ja – es ist reine Übung ohne Abgabe, sie hat den Weg wirklich verstanden und danach selbstständig geübt.',en:'Yes – it is pure practice with no submission, she genuinely understood the method and then practised independently.'},
              {de:'Nein, weil sie die erste Aufgabe nicht komplett allein gelöst hat.',en:'No, because she did not solve the first problem entirely on her own.'},
              {de:'Ja, aber nur, weil Mathe-Aufgaben sowieso nicht als „richtige" KI-Nutzung zählen.',en:'Yes, but only because maths problems do not count as "real" AI use anyway.'}],
     correct:0,explain:{de:'Beim Üben zählt: Es wird nichts abgegeben oder bewertet, sie hat den Lösungsweg verstanden statt nur abgeschrieben, und geübt hat sie danach komplett allein – vergleichbar mit einem Lösungsheft oder Nachhilfe.',en:'For practice, what counts is: nothing is submitted or graded, she understood the method instead of just copying it, and she then practised entirely on her own – comparable to a solutions booklet or tutoring.'}},
    {type:'quiz',q:{de:'Für eine Kunstaufgabe darf Jonas laut Aufgabenstellung KI zur Bildideenfindung nutzen (Stufe 3: „KI-Erstellung" – Nutzung muss mit Prompts/MLA-Zitat angegeben werden). Er lässt sich von Gemini mehrere Bildideen erstellen, wählt eine aus und bearbeitet sie weiter. Beim Abgeben vergisst er, den KI-Einsatz anzugeben. Ist das zulässig?',en:'For an art task, Jonas is allowed to use AI for image ideas (Level 3: "AI creation" – use must be disclosed with prompts/MLA citation). He has Gemini generate several image ideas, picks one and edits it further. When submitting, he forgets to disclose the AI use. Is this allowed?'},
     options:[{de:'Nein – die Nutzung selbst war erlaubt, aber ohne Angabe/Kennzeichnung ist es trotzdem ein Verstoß.',en:'No – the use itself was allowed, but without disclosure/labelling it is still a violation.'},
              {de:'Ja, weil KI-Nutzung bei dieser Aufgabe grundsätzlich erlaubt war.',en:'Yes, because AI use was fundamentally allowed for this task.'},
              {de:'Nein, aber nur weil er ein Bild statt eines Textes erzeugt hat.',en:'No, but only because he generated an image instead of a text.'}],
     correct:0,explain:{de:'Erlaubnis zur Nutzung und Pflicht zur Kennzeichnung sind zwei getrennte Dinge. Jede Stufe der GSIS-Skala verlangt eine Offenlegung – wer die vergisst, verstößt gegen die Regeln, selbst wenn die KI-Nutzung an sich okay war.',en:'Permission to use AI and the duty to disclose it are two separate things. Every level of the GSIS scale requires disclosure – forgetting it breaks the rules, even if the AI use itself was fine.'}},
    {type:'reflect',q:{de:'Wähle eine der fünf Situationen aus, bei der du dir zuerst nicht sicher warst. Begründe in 2–3 Sätzen, warum du dich am Ende so entschieden hast.',en:'Pick one of the five situations where you were unsure at first. Explain in 2–3 sentences why you decided the way you did in the end.'},
     placeholder:{de:'Situation … / meine Entscheidung … / Begründung …',en:'Situation … / my decision … / reasoning …'},prod:true}
  ]}
 ],
 K09:[
  {id:'K09-M1',icon:'🔄',komp:'V',niveau:'III',title:{de:'Auffrischung Klasse 8',en:'Refresher Grade 8'},tasks:[
    {type:'quiz',q:{de:'Was ist beim Teilen von Aufgaben mit KI klug?',en:'What is smart when dividing tasks with AI?'},
     options:[{de:'KI für Passendes nutzen, eigenes Urteil behalten',en:'Use AI where it fits, keep your own judgement'},
              {de:'Immer alles der KI geben',en:'Always give everything to AI'},{de:'KI nie nutzen',en:'Never use AI'}],
     correct:0,explain:{de:'Bewusst aufteilen – Mensch und KI je nach Stärke.',en:'Divide deliberately – human and AI by strength.'}},
    {type:'quiz',q:{de:'Was gehört NICHT in eine KI?',en:'What does NOT belong in an AI?'},
     options:[{de:'Private Daten und Passwörter',en:'Private data and passwords'},
              {de:'Eine Frage zum Unterricht',en:'A question about the lesson'},{de:'Eine Idee zum Brainstorming',en:'An idea for brainstorming'}],
     correct:0,explain:{de:'Private Daten schützt man immer.',en:'Always protect private data.'}}
  ]},
  {id:'K09-M2',icon:'🔬',komp:'R',niveau:'III',title:{de:'KI bewerten & vergleichen',en:'Evaluating & comparing AI'},tasks:[
    {type:'info',title:{de:'Nicht jede KI passt zu jeder Aufgabe',en:'Not every AI fits every task'},
     body:{de:'<p>Bewerte ein KI-System nach: <strong>Zweck</strong> (wofür gemacht?), <strong>Nutzer</strong> (für wen?), <strong>Grenzen</strong> (was kann es nicht?) und <strong>Folgen</strong> (wer profitiert, wer nicht?).</p><p>Oft lohnt sich der <strong>Vergleich</strong> mehrerer Werkzeuge – oder die Entscheidung, gar keine KI zu nutzen.</p>',
           en:'<p>Evaluate an AI system by: <strong>purpose</strong> (made for what?), <strong>users</strong> (for whom?), <strong>limits</strong> (what can it not do?) and <strong>impact</strong> (who benefits, who not?).</p><p>Often it pays to <strong>compare</strong> several tools – or decide to use no AI at all.</p>'}},
    {type:'quiz',q:{de:'Welche Frage hilft am besten, ein KI-Tool zu bewerten?',en:'Which question best helps to evaluate an AI tool?'},
     options:[{de:'Wofür wurde es gemacht und wo sind seine Grenzen?',en:'What was it made for and where are its limits?'},
              {de:'Welche Farbe hat das Logo?',en:'What colour is the logo?'},{de:'Wie viele nutzen es?',en:'How many people use it?'}],
     correct:0,explain:{de:'Zweck und Grenzen sind entscheidend – nicht Aussehen oder Beliebtheit.',en:'Purpose and limits are decisive – not looks or popularity.'}},
    {type:'multi',q:{de:'Wonach beurteilst du ein KI-System fair? (Mehrere)',en:'By what do you judge an AI system fairly? (Several)'},
     options:[{de:'Zweck und Zielgruppe',en:'Purpose and target users'},
              {de:'Grenzen und mögliche Fehler',en:'Limits and possible errors'},
              {de:'Wer profitiert, wer wird benachteiligt',en:'Who benefits, who is disadvantaged'},
              {de:'Nur wie cool es aussieht',en:'Only how cool it looks'}],
     correct:[0,1,2],explain:{de:'Zweck, Grenzen, Folgen – das zählt. Aussehen allein nicht.',en:'Purpose, limits, impact – that counts. Looks alone do not.'}},
    {type:'info',title:{de:'Jetzt du: Modelle live vergleichen',en:'Now you: comparing models live'},
     body:{de:'<p>Öffne <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>, wähle das Modell <strong>Fast</strong> und gib genau diesen Prompt ein: <em>„Ein Bauer hat 17 Schafe. Alle außer 9 laufen weg. Am nächsten Tag kommt die Hälfte der weggelaufenen Schafe zurück. Wie viele Schafe hat er jetzt? Antworte nur mit einer Zahl."</em> Notiere die Antwort. Wechsle dann auf <strong>Thinking</strong> (oder Pro) und stelle exakt dieselbe Frage noch einmal.</p>',
           en:'<p>Open <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a>, choose the <strong>Fast</strong> model and enter exactly this prompt: <em>"A farmer has 17 sheep. All but 9 run away. The next day, half of the sheep that ran away come back. How many sheep does he have now? Answer with just a number."</em> Note the answer. Then switch to <strong>Thinking</strong> (or Pro) and ask the exact same question again.</p>'}},
    {type:'input',q:{de:'Rechne selbst, Schritt für Schritt: Wie viele Schafe hat der Bauer jetzt wirklich?',en:'Work it out yourself, step by step: how many sheep does the farmer really have now?'},
     hint:{de:'Zahl',en:'Number'},accept:['13'],
     explain:{de:'Schritt 1: „Alle außer 9 laufen weg" – 9 Schafe bleiben, 8 laufen weg (17−9=8; nicht die 17!). Schritt 2: Die Hälfte der 8 Weggelaufenen kommt zurück, also 4. Ergebnis: 9+4 = 13. Das ist eine doppelte Falle – wer nur Zahlenmuster erkennt statt genau zu lesen, verrechnet sich gleich zweimal.',en:'Step 1: "all but 9 run away" – 9 sheep stay, 8 run away (17−9=8; not the 17!). Step 2: half of those 8 come back, so 4. Result: 9+4 = 13. This is a double trap – a model that just spots number patterns instead of reading carefully gets it wrong twice over.'}},
    {type:'reflect',q:{de:'Kamen Fast und Thinking/Pro bei dir auf das gleiche Ergebnis? Welches Modell hat es richtig gelöst, und bei welchem der zwei Schritte ist es (falls überhaupt) danebengelegen?',en:'Did Fast and Thinking/Pro give you the same result? Which model got it right, and at which of the two steps (if any) did it go wrong?'},
     placeholder:{de:'Fast antwortete: … / Thinking/Pro antwortete: … / Fehler bei Schritt … / Meine Schlussfolgerung: …',en:'Fast answered: … / Thinking/Pro answered: … / Error at step … / My conclusion: …'},prod:true},
    {type:'info',title:{de:'Jetzt du: erfinde eigene Fallen',en:'Now you: invent your own traps'},
     body:{de:'<p>Erfinde <strong>zwei eigene</strong> knifflige Testfragen – z. B. eine weitere Ablenkungs-Rechnung wie beim Schaf-Rätsel, ein Logik-Rätsel oder eine Buchstaben-Zählaufgabe. Teste beide bei <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> sowohl mit <strong>Fast</strong> als auch mit <strong>Thinking/Pro</strong>.</p>',
           en:'<p>Invent <strong>two of your own</strong> tricky test questions – e.g. another distraction calculation like the sheep riddle, a logic puzzle, or a letter-counting task. Test both at <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> with both <strong>Fast</strong> and <strong>Thinking/Pro</strong>.</p>'}},
    {type:'reflect',q:{de:'Notiere deine zwei Testfragen und was Fast bzw. Thinking/Pro jeweils geantwortet haben. Bei welcher Frage gab es einen Unterschied – und warum, vermutest du, ist das so?',en:'Note your two test questions and what Fast and Thinking/Pro each answered. Where was there a difference – and why do you think that is?'},
     placeholder:{de:'Testfrage 1: … / Fast: … / Thinking: … / Testfrage 2: … / Fast: … / Thinking: … / Vermutung: …',en:'Test question 1: … / Fast: … / Thinking: … / Test question 2: … / Fast: … / Thinking: … / My guess: …'},prod:true},
    {type:'info',title:{de:'Bekannte Halluzinationen aus der echten Welt',en:'Known real-world hallucinations'},
     body:{de:'<p>2023 nutzten US-Anwälte ChatGPT für einen Gerichtsschriftsatz. Die KI erfand dabei <strong>sechs komplett fiktive Gerichtsurteile</strong> mit erfundenen Zitaten – die Anwälte reichten sie ein, ohne sie zu prüfen. Ein Richter entdeckte, dass es diese Fälle nie gab, und verhängte 2023 eine Geldstrafe gegen die Anwälte (<a href="https://en.wikipedia.org/wiki/Mata_v._Avianca,_Inc." target="_blank" rel="noopener">Fall Mata v. Avianca ↗</a>).</p><p>2024 empfahl Googles KI-Übersicht in der Suche, <strong>Klebstoff in Pizzasoße</strong> zu mischen (Quelle: ein alter Scherz auf Reddit) und riet, täglich <strong>einen Stein zu essen</strong> (Quelle: ein satirischer Artikel von The Onion) – bevor Google die Funktion nachbessern musste.</p>',
           en:'<p>In 2023, US lawyers used ChatGPT for a court filing. The AI invented <strong>six completely fictional court rulings</strong> with made-up quotes – the lawyers submitted them without checking. A judge discovered the cases never existed and fined the lawyers in 2023 (<a href="https://en.wikipedia.org/wiki/Mata_v._Avianca,_Inc." target="_blank" rel="noopener">Mata v. Avianca case ↗</a>).</p><p>In 2024, Google\'s AI Overview in Search recommended mixing <strong>glue into pizza sauce</strong> (source: an old joke on Reddit) and advised eating <strong>one rock a day</strong> (source: a satirical article from The Onion) – before Google had to fix the feature.</p>'}},
    {type:'info',title:{de:'Jetzt du: provoziere selbst eine Halluzination',en:'Now you: trigger a hallucination yourself'},
     body:{de:'<p>Frag Gemini nach etwas sehr <strong>spezifischem und wenig bekanntem</strong>, das eine Halluzination wahrscheinlicher macht – z. B. nach einem genauen Paragrafen/Absatz aus einem echten, aber wenig bekannten Gesetzestext, oder nach einem exakten Zitat einer Person zu einem sehr speziellen Thema.</p>',
           en:'<p>Ask Gemini for something very <strong>specific and little-known</strong>, which makes a hallucination more likely – e.g. an exact paragraph/clause from a real but obscure law, or an exact quote from a person on a very specific topic.</p>'}},
    {type:'reflect',q:{de:'Was hast du gefragt? Hat Gemini etwas erfunden (z. B. eine Quelle, ein Zitat, einen Paragrafen, den es so nicht gibt)? Wie hast du das überprüft?',en:'What did you ask? Did Gemini invent something (e.g. a source, quote or clause that does not actually exist)? How did you check?'},
     placeholder:{de:'Meine Frage: … / Antwort von Gemini: … / Überprüft durch: … / Halluziniert? …',en:'My question: … / Gemini\'s answer: … / Checked via: … / Hallucinated? …'},prod:true}
  ]},
  {id:'K09-M3',icon:'🧪',komp:'M',niveau:'III',title:{de:'KI mitgestalten — Daten & Bias',en:'Shaping AI — data & bias'},tasks:[
    {type:'info',title:{de:'Daten formen das Verhalten',en:'Data shapes behaviour'},
     body:{de:'<p>Wer eine KI baut, wählt <strong>Daten</strong> aus – und diese Auswahl prägt, wie die KI sich verhält. Einseitige Daten → einseitige KI.</p><p>Mitgestalten heißt: bewusst auf <strong>ausgewogene Daten</strong> achten und das Ergebnis <strong>testen</strong>.</p>',
           en:'<p>Whoever builds an AI selects <strong>data</strong> – and that selection shapes how the AI behaves. One-sided data → one-sided AI.</p><p>Shaping means: deliberately aim for <strong>balanced data</strong> and <strong>test</strong> the result.</p>'}},
    {type:'quiz',q:{de:'Du trainierst eine KI, die Äpfel und Tomaten erkennt. Was ist wichtig?',en:'You train an AI to recognise apples and tomatoes. What matters?'},
     options:[{de:'Viele ausgewogene Beispiele von beiden',en:'Many balanced examples of both'},
              {de:'Nur rote Äpfel, keine grünen',en:'Only red apples, no green ones'},{de:'Möglichst wenige Beispiele',en:'As few examples as possible'}],
     correct:0,explain:{de:'Ausgewogene, vielfältige Daten → faires, zuverlässiges Modell.',en:'Balanced, diverse data → fair, reliable model.'}},
    {type:'quiz',q:{de:'Dein Modell verwechselt grüne Äpfel mit Tomaten. Beste Erklärung?',en:'Your model confuses green apples with tomatoes. Best explanation?'},
     options:[{de:'Im Training fehlten grüne Äpfel – die Daten waren einseitig',en:'Green apples were missing in training – the data was one-sided'},
              {de:'Grüne Äpfel sehen Tomaten einfach zu ähnlich, egal welche Daten man nutzt',en:'Green apples simply look too similar to tomatoes, no matter what data you use'},{de:'Tomaten sind klüger',en:'Tomatoes are smarter'}],
     correct:0,explain:{de:'Lücken in den Daten zeigen sich direkt im Verhalten der KI – nicht die „Ähnlichkeit" der Früchte allein entscheidet.',en:'Gaps in the data show up directly in the AI behaviour – it is not just how similar the fruits look.'},prod:true},
    {type:'info',title:{de:'Jetzt du: Bias selbst erzeugen',en:'Now you: creating bias yourself'},
     body:{de:'<p>Öffne <a href="https://teachablemachine.withgoogle.com/" target="_blank" rel="noopener">teachablemachine.withgoogle.com ↗</a> → „Image Project". Trainiere zwei Kategorien (z. B. „Daumen hoch" / „Daumen runter") aber <strong>absichtlich einseitig</strong>: zeige eine Kategorie nur aus einem Winkel oder bei einer Beleuchtung. Teste das Modell danach mit einem anderen Winkel/Licht.</p>',
           en:'<p>Open <a href="https://teachablemachine.withgoogle.com/" target="_blank" rel="noopener">teachablemachine.withgoogle.com ↗</a> → "Image Project". Train two categories (e.g. "thumbs up" / "thumbs down") but <strong>deliberately one-sidedly</strong>: show one category from only one angle or lighting. Then test the model with a different angle/light.</p>'}},
    {type:'reflect',q:{de:'Was hast du absichtlich unausgewogen trainiert, und wie hat sich das im Test gezeigt? Was sagt dir dieses Mini-Experiment über echte KI-Systeme (z. B. Gesichtserkennung)?',en:'What did you deliberately train unevenly, and how did that show up in the test? What does this mini-experiment tell you about real AI systems (e.g. facial recognition)?'},
     placeholder:{de:'Einseitig trainiert: … / Beobachtung im Test: … / Bezug zu echten Systemen: …',en:'Trained one-sidedly on: … / Observation in the test: … / Link to real systems: …'},prod:true}
  ]},
  {id:'K09-M4',icon:'🌍',komp:'M',niveau:'III',title:{de:'Ethik, Gesellschaft & dein Projekt',en:'Ethics, society & your project'},tasks:[
    {type:'info',title:{de:'KI verantwortungsvoll mitgestalten',en:'Shaping AI responsibly'},
     body:{de:'<p>KI wirkt auf <strong>Gesellschaft</strong>: Sie kann informieren – oder mit Desinformation der <strong>Demokratie</strong> schaden. Frage immer: <strong>Wer profitiert, wer wird benachteiligt?</strong></p><p>Zum Abschluss entwickelst du eine Idee, wie KI <strong>für den Menschen</strong> verbessert werden könnte, und reflektierst deinen KI-Einsatz.</p>',
           en:'<p>AI affects <strong>society</strong>: it can inform – or harm <strong>democracy</strong> through disinformation. Always ask: <strong>who benefits, who is disadvantaged?</strong></p><p>To finish, you develop an idea how AI could be improved <strong>for people</strong>, and reflect on your AI use.</p>'}},
    {type:'quiz',q:{de:'Warum ist KI-Desinformation für die Demokratie gefährlich?',en:'Why is AI disinformation dangerous for democracy?'},
     options:[{de:'Sie kann täuschen und Meinungen unfair beeinflussen',en:'It can deceive and unfairly influence opinions'},
              {de:'Sie macht das Internet langsamer',en:'It slows the internet'},{de:'Sie ist immer leicht zu erkennen',en:'It is always easy to spot'}],
     correct:0,explain:{de:'Überzeugende Fälschungen können Wahlen und Meinungen verzerren.',en:'Convincing fakes can distort elections and opinions.'}},
    {type:'quiz',q:{de:'Was ist die Leitfrage beim ethischen Mitgestalten von KI?',en:'What is the guiding question when shaping AI ethically?'},
     options:[{de:'Wer profitiert – und wer wird benachteiligt?',en:'Who benefits – and who is disadvantaged?'},
              {de:'Wie werde ich am schnellsten fertig?',en:'How do I finish fastest?'},{de:'Wie sieht es am coolsten aus?',en:'How does it look coolest?'}],
     correct:0,explain:{de:'Nutzen und Schaden für Menschen abwägen – das ist der Kern.',en:'Weighing benefit and harm for people – that is the core.'}},
    {type:'info',title:{de:'Jetzt du: Erst mit KI diskutieren, dann selbst urteilen',en:'Now you: discuss with AI first, then judge for yourself'},
     body:{de:'<p>Bilde dir zuerst kurz deine eigene Meinung zu dieser Frage: <em>„Sollte von KI erzeugte Kunst bei Wettbewerben gegen menschliche Kunst antreten dürfen?"</em> Diskutiere sie dann bei <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> und bitte gezielt um das <strong>stärkste Gegenargument</strong> zu deiner Position.</p>',
           en:'<p>First briefly form your own opinion on this question: <em>"Should AI-generated art be allowed to compete against human art in competitions?"</em> Then discuss it at <a href="https://gemini.google.com/app" target="_blank" rel="noopener">gemini.google.com/app ↗</a> and specifically ask for the <strong>strongest counter-argument</strong> to your position.</p>'}},
    {type:'reflect',q:{de:'Was war das stärkste Gegenargument, das Gemini gebracht hat? Hat es deine Meinung verändert – warum oder warum nicht?',en:'What was the strongest counter-argument Gemini gave? Did it change your opinion – why or why not?'},
     placeholder:{de:'Meine Ausgangsmeinung: … / Gegenargument der KI: … / Meine Meinung jetzt: …',en:'My starting opinion: … / AI counter-argument: … / My opinion now: …'},prod:true},
    {type:'reflect',q:{de:'Projekt: Beschreibe kurz eine KI-Idee, die Menschen wirklich helfen würde – und einen Risiko-Punkt, auf den du achten würdest.',en:'Project: briefly describe an AI idea that would truly help people – and one risk you would watch for.'},
     placeholder:{de:'Idee … / Risiko …',en:'Idea … / Risk …'},prod:true}
  ]}
 ],
 K10:[
  {id:'K10-M1',icon:'🔄',komp:'V',niveau:'III',title:{de:'Auffrischung Klasse 9',en:'Refresher Grade 9'},tasks:[
    {type:'quiz',q:{de:'Warum lohnt sich oft ein Vergleich mehrerer KI-Werkzeuge, statt einfach das bekannteste zu nehmen?',en:'Why is it often worth comparing several AI tools instead of just picking the most well-known one?'},

    {type:'quiz',q:{de:'Ein Modell erkennt eine bestimmte Gruppe von Bildern durchgehend schlecht. Woran liegt das meistens?',en:'A model consistently recognises a certain group of images poorly. What is usually the cause?'},
